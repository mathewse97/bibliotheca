# ===========================================================================
# OBRA
# ===========================================================================
form:
  status: recuperado
  source: "sources/blueprint-2026-09-05.md §C, tabela de dimensões de
           classificação; a lista truncada em works/*.md termina aqui"
  note: "A forma bibliográfica da unidade intelectual, distinta de work_type,
         que é o gênero intelectual. Colapsar as duas é o que força toda
         unidade intelectual a ser um 'livro' — e é por isso que as duas
         conferências de Weber quase viraram um registro só."
  values: [book, essay, lecture, speech, dialogue, treatise, novel, play]
  observed_in_data: [lecture]

work_type:
  status: declarado-aberto
  source: "works/*.md, comentário do campo — `primary-source | political-theory | … (§E)`;
           categorias em sources/blueprint-2026-09-05.md §C"
  note: "Pertence ao §E: é produto da pesquisa, não do import. Ver
         bibliographic-rules.md §E.5. Hoje 52 dos 53 registros têm null.
         O blueprint nomeia CINCO categorias — fonte primária, teoria,
         sociologia, literatura, comentário — e serve à análise de equilíbrio
         (o sinal da lacuna `type-monoculture`). Mas nomeia-as em prosa, e não
         dá as formas de slug: os valores atestados abaixo vêm do comentário do
         campo e do acervo. Um slug novo é decisão de classificação e vai a
         revisão (curation-rules.md §6.8), não é escolhido em silêncio."
  categories_named_in_blueprint: [fonte-primaria, teoria, sociologia,
                                  literatura, comentario]
  values: [primary-source, political-theory, literatura]
  observed_in_data: [political-sociology]
  added:
    - value: literatura
      by: voce
      date: 2026-09-28
      reason: "O documento fundador já nomeava 'literatura' entre as cinco
               categorias, mas a forma do slug nunca tinha sido fixada, e por
               isso toda obra literária do acervo estava classificada como
               fonte primária — a mesma etiqueta de Tucídides. Isso fazia o
               detector de equilíbrio de tipos medir errado. O valor foi
               criado com a pesquisa do lote 2, quando seis romances entraram
               de uma vez. É o que a obra É; como ela FUNCIONA numa coleção
               continua sendo o papel da participação, que varia de coleção
               para coleção — uma tragédia grega é literatura em qualquer
               lugar, e é fonte primária em Greco-Romana e tratamento
               literário em Política ao mesmo tempo."


research_status:
  status: recuperado
  source: "sources/blueprint-2026-09-05.md §E, 'When is a work fully researched'"
  note: "CORREÇÃO: a versão anterior deste arquivo listava
         [not_researched, researched] e marcava-o como declarado-fechado. O
         segundo valor era inferência minha, e estava errado — nenhum arquivo o
         declarava. A lista real tem quatro valores. `partially_researched`
         exige que os itens em falta sejam nomeados; `needs_review` é
         automático quando a disponibilidade foi checada há mais de um ano — a
         avaliação continua boa, a informação de compra não. Critério completo
         em bibliographic-rules.md §E.4. Hoje todos os registros de obra e a
         única publicação estão not_researched."
  values: [not_researched, partially_researched, fully_researched, needs_review]

priority_library:
  status: observado
  source: "review/gaps/*.yaml, blocos `placement`"
  note: "Curatorial. Distinta de priority_personal, que é do Mathews e vem de
         config/writable-fields.yaml. Nenhum registro de obra a tem preenchida
         hoje — os valores abaixo ocorrem apenas em colocações propostas."
  values: [core, secondary]

relations.type:
  status: declarado-no-codigo
  source: "tools/build.py, mapa de relações inversas; glosas e inversas
           confirmadas em sources/blueprint-2026-09-05.md §C"
  note: "A build deriva a relação inversa a partir deste mapa. Um tipo fora
         dele NÃO é erro: passa adiante sem inversão declarada, o que é a
         forma silenciosa de corromper o grafo. `part_of` fica reservado a
         volumes de uma obra autoral única — um ensaio numa coletânea de
         editor é uma publicação que contém obras
         (review/political-thought.md §2.3)."
  values: [prerequisite_for, responds_to, criticizes, continues, influenced_by,
           same_tradition_as, opposing_tradition_to, complements,
           literary_treatment_of, primary_source_for, commentary_on, part_of]
  observed_in_data: [complements]
  glosses:
    prerequisite_for:      "dependência real: não se segue B sem A"
    responds_to:           "engajamento direto com um predecessor nomeado"
    criticizes:            "ataque sustentado, não discordância de passagem"
    continues:             "continuações e completamentos"
    influenced_by:         "dívida formativa reconhecida"
    same_tradition_as:     "simétrica. Usar com parcimônia — `traditions:` costuma bastar"
    opposing_tradition_to: "simétrica. Discordância estrutural, não pessoal.
                            É também o sinal da lacuna `one-sided-tradition`"
    complements:           "simétrica. Melhor lidas juntas do que separadas"
    literary_treatment_of: "Orwell para a teoria do totalitarismo"
    primary_source_for:    "liga uma fonte ao seu comentário"
    commentary_on:         "comentário acadêmico explícito"
    part_of:               "obra dentro de obra autoral maior — um volume de uma
                            obra em vários volumes. NÃO para ensaio em coletânea
                            de editor: isso é uma publicação que contém obras"

# ===========================================================================
# PUBLICAÇÃO — todos declarados em publications/_TEMPLATE.md
# ===========================================================================
contains.verdict:
  status: declarado-fechado
  source: "publications/_TEMPLATE.md"
  note: "O veredito vive no par obra–publicação, nunca na publicação."
  values: [recommended, alternative, rejected, unassessed]

translated_from:
  status: declarado-fechado
  source: "publications/_TEMPLATE.md"
  values: [direct, "via:<lang>", unknown]

completeness:
  status: declarado-fechado
  source: "publications/_TEMPLATE.md"
  values: [complete, abridged, selections]

register:
  status: declarado-fechado
  source: "publications/_TEMPLATE.md"
  values: [critical, academic, popular, escolar]

packaging:
  status: declarado-fechado
  display_term: "Box"   # decisão do Mathews, 2026-09-23: na tela e nos títulos,
                        # a embalagem com vários volumes se chama "Box" (o termo
                        # comum, também no Brasil), nunca "Caixa". O VALOR do
                        # campo continua `caixa` para não quebrar os registros.
  source: "publications/_TEMPLATE.md; decisão do Mathews, 2026-09-22"
  note: "O objeto é um tomo único ou uma embalagem com vários? Independente de
         quantas OBRAS ele contém: as duas dimensões se cruzam e produzem os
         quatro casos que a interface precisa distinguir — caixa com obras
         diferentes, obras num mesmo volume, edição de uma obra em vários
         volumes, e caixa com os volumes de uma obra. Ausente = volume."
  values: [volume, caixa]

availability_br:
  status: declarado-fechado
  source: "publications/_TEMPLATE.md"
  values: [em-catalogo, esgotado, importacao, usado]

provenance.confidence:
  status: declarado-fechado
  source: "publications/_TEMPLATE.md"
  values: [verified, reported, inferred, unverified]

source_tier:
  status: parcialmente-recuperado
  source: "config/acquisition.yaml; publications/_TEMPLATE.md"
  note: "1–5 bibliográfico · 6–7 só disponibilidade. A definição interna de
         1 a 5 NÃO é recuperável — ver bibliographic-rules.md §E.1 antes de
         atribuir um tier."
  values: [1, 2, 3, 4, 5, 6, 7]

