  source: "sources/blueprint-2026-09-05.md §D, campo do cabeçalho de coleção"
  note: "A cronológica é sempre DERIVADA de date_sort, nunca mantida à mão:
         há exatamente uma ordem cronológica verdadeira."
  values: [intellectual, chronological, thematic]
