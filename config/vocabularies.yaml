# ---------------------------------------------------------------------------
# VOCABULÁRIOS CONTROLADOS
#
# Reúne, num lugar só, os valores que os campos da biblioteca admitem. Existe
# porque vários deles não estavam declarados em lugar nenhum: um agente que
# precisasse de um `role` ou de um `work_type` teria de os adivinhar a partir
# dos dados — e adivinhar um vocabulário é como um vocabulário se corrompe.
#
# ESTE ARQUIVO É RECUPERAÇÃO, NÃO LEGISLAÇÃO. Nenhum valor foi acrescentado,
# nenhum foi normalizado, nenhuma lista foi fechada por parecer completa. Cada
# entrada declara de onde veio e em que estado está:
#
#   declarado-fechado  a fonte enumera a lista inteira. É a lista.
#   declarado-aberto   a fonte enumera e termina em reticências. Há valores
#                      legítimos que não estão aqui.
#   observado          nenhum arquivo declara o vocabulário. Os valores abaixo
#                      são os que ocorrem no acervo hoje, e mais nada se sabe.
#   recuperado         declarado no blueprint original, arquivado em
#                      sources/blueprint-2026-09-05.md. Precedência 4: recupera
#                      o que se perdeu, nunca substitui uma regra atual.
#
# COMO USAR UM VOCABULÁRIO `observado` OU `declarado-aberto`: reutilizar um
# valor existente quando ele descreve o caso. Precisar de um valor novo é uma
# decisão de classificação, não um detalhe de preenchimento — vai para revisão
# e é levantada, não decidida (curation-rules.md §6.8), e quando decidida entra
# aqui.
#
# A BUILD NÃO LÊ ESTE ARQUIVO. Nenhum destes vocabulários é validado: um valor
# inventado não produz erro de integridade, só um acervo incoerente. Ver
# curation-rules.md §8.2.
# ---------------------------------------------------------------------------
version: 1

# ===========================================================================
# PARTICIPAÇÃO — atributos da entrada de uma obra numa coleção
# ===========================================================================
role:
  status: observado
  source: "collections/*.md, entradas de `sequence`"
  note: "O papel da obra NESTA coleção. A mesma obra pode ter papéis
         diferentes em coleções diferentes — é participação, não etiqueta."
  values: [foundational, primary-source, critical-response, pivot,
           comparative, literary-treatment, supplementary]

demand:
  status: observado
  source: "collections/*.md, entradas de `sequence`"
  note: "O que a obra exige do leitor. Escala aparente de três degraus."
  values: [leve, moderado, exigente]

core:
  status: declarado-fechado
  source: "collections/political-thought.md; curation-rules.md §1"
  note: "★: obra INDISPENSÁVEL dentro da coleção completa. Sem ela a
         coleção não responde bem à própria pergunta, e nenhuma outra obra
         dela cobre o que ela cobre. Não se reconcilia com pertencer a um
         caminho. Quem define é o agente, com pesquisa e a justificativa de
         cada estrela registrada na revisão da coleção (decisão do Mathews,
         2026-10-27). As estrelas que vieram da lista dele (Política) são
         dele: continuam, e uma discordância vira cartão."
  values: [true]

