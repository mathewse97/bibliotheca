# LACUNAS E PROPOSTAS — forma completa em config/gap-records.yaml
# ===========================================================================
gap.type:
  status: recuperado
  source: "sources/blueprint-2026-09-05.md §I, tabela de tipos e sinais;
           `sequence-gap` vem do acervo (review/gaps/political-thought.yaml)"
  note: "Cada tipo tem um SINAL nos dados, e o sinal vem antes do argumento. O
         catálogo completo, com o sinal e o grau de julgamento de cada um, está
         em config/gap-records.yaml. `sequence-gap` não consta do blueprint e é
         um acréscimo posterior, em uso; os três tipos do blueprint que ainda
         não ocorrem no acervo continuam válidos."
  values: [dangling-interlocutor, broken-prerequisite, one-sided-tradition,
           orphan-foundational, period-discontinuity, type-monoculture,
           unanswered-movement, sequence-gap]
  observed_in_data: [type-monoculture, period-discontinuity,
                     dangling-interlocutor, sequence-gap, one-sided-tradition]

gap.necessity:
  status: observado
  source: "review/gaps/*.yaml"
  note: "Único eixo que determina prioridade (curation-rules.md §2.4). Os três
         valores abaixo são os que ocorrem; a escala completa não está
         declarada."
  values: [alta, media-alta, media]

gap.status:
  status: recuperado
  source: "sources/blueprint-2026-09-05.md §I, exemplo de registro de lacuna"
  note: "Não confundir com o estado das PROPOSTAS ESTRUTURAIS
         (open|approved|rejected, em config/structural-proposals.yaml): campos
         diferentes, vocabulários diferentes. `accepted` é o estado de uma
         lacuna fechada por uma obra que entrou; nesse caso a colocação herda o
         argumento já escrito no registro em vez de o re-derivar. Só `open`
         ocorre hoje, nas seis lacunas abertas."
  values: [open, proposed, accepted, dismissed]
  observed_in_data: [open]

candidate.verdict:
  status: parcialmente-recuperado
  source: "review/gaps/*.yaml; sources/blueprint-2026-09-05.md §I"
  note: "A correspondência com as quatro categorias de curation-rules.md §2.3,
         que na volta anterior eu declarei não recuperável, ESTÁ no blueprint:
         lacuna genuína → gap-filler, e só ela gera proposta · complementar →
         registrada contra a lacuna como candidato considerado, não proposta ·
         enriquecedora → lista por coleção, nunca surge sem ser pedida ·
         redundante → registrada permanentemente, com a razão e as obras que
         cobrem a contribuição. ATENÇÃO: só dois slugs estão atestados
         (gap-filler, complementary). Os das duas últimas categorias não
         aparecem em lado nenhum e NÃO foram inventados aqui.
         `different-region` não consta do blueprint e é um acréscimo posterior,
         em uso: marca o candidato que fecha OUTRA região do scope_map, e não
         esta."
  values: [gap-filler, complementary, different-region]
  categories_without_attested_slug: [enriquecedora, redundante]

settled.verdict:
  status: observado
  source: "review/gaps/political-thought.yaml"
  values: [not-redundant]

# ===========================================================================
