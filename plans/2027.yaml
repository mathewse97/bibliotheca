# Frases opcionais dos fios. Os fios em si saem das marcas de lugar e tema das
# obras (config/lugar-tema.yaml) e das relações entre elas; aqui só se escreve a
# frase que explica um fio, pela chave do lugar ou do tema.
thread_notes:
  grecia: "A Grécia de ponta a ponta: Alexandre em fevereiro, os deuses e o trabalho em Hesíodo, a filosofia em Hadot, Ulisses em agosto e a tragédia de Sófocles em outubro."
  roma: "Roma do império de Woolf à vida de César, ao chão de Pompeia, às escolas de filosofia e, em setembro, ao poema que Augusto quis para a cidade."
  imperios: "Como impérios se fazem e se desfazem: Roma em Woolf, Alexandre e César em Plutarco, o colapso dos reinos da Idade do Bronze em Cline e, em dezembro, os impérios da Ásia Central em Frankopan."
  mitos-deuses: "Os deuses que Hesíodo põe em ordem em maio voltam a agir sobre os heróis, na Odisseia e na Eneida."
  epica: "A poesia que conta em verso: Hesíodo ensinando o irmão, Homero com Ulisses e Virgílio, que reescreve Homero para Roma."
  tirania: "O poder de um só: César, que Plutarco acompanha até o assassinato, e Édipo, o tirano que descobre o próprio crime."
