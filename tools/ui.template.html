/* ---------- capa e aquisição --------------------------------------------
   Ambas são propriedades da PUBLICAÇÃO. Uma obra não tem capa nem preço.
   Aquisição fica num bloco à parte do bibliográfico, de propósito: vendedor
   é tier 6–7 e não sustenta juízo nenhum sobre a edição.                   */
const FRESH = {fresh:['verificado','ok'], aging:['a reverificar','warn'],
               stale:['desatualizado','flag'], unchecked:['sem data','flag']};
function coverImg(p, cls){
  const c = p.cover; if(!c) return '';
  const src = c.data_uri || c.relative_path; if(!src) return '';
  return `<img class="cover ${cls||'lg'}" src="${src}" alt="Capa de ${E(p.title_as_published||p.id)}" loading="lazy">`;
}
function coverBlock(p){
  const c = p.cover;
  if(!c || !(c.data_uri||c.relative_path))
    return `<div class="nocover">sem capa<br>verificada</div>`;
  const f = FRESH[c.freshness]||['',''];
  return `<div>${coverImg(p,'lg')}
    <div class="by" style="margin-top:5px;max-width:110px">capa desta publicação
      · ${E(c.source_type||'')}${c.checked?` · <span class="b ${f[1]}">${f[0]}</span>`:''}</div></div>`;
}
function acqBlock(p){
  const as = p.acquisition||[];
  const head = `<h2>Aquisição <span class="lock">— não é evidência bibliográfica</span></h2>
    <p class="small muted">Vendedores são fonte de nível 6–7: estabelecem que o livro existe e pode
      ser comprado, e nada mais. Disponibilidade, preço e popularidade não tocam o veredito desta
      edição nem a prioridade de nenhuma obra.</p>`;
  if(!as.length) return head+`<div class="panel"><p class="small muted" style="margin:0">
    Nenhuma fonte de aquisição verificada. <b>Isso não é um defeito bibliográfico</b> — apenas
    ninguém pesquisou onde comprar esta edição, ou nenhum anúncio pôde ser confirmado como sendo
    dela.</p></div>`;
  return head+`<div class="acq">${as.map(a=>{
    const f=FRESH[a.freshness]||['',''];
    return `<div class="a${a.actionable?'':' no'}">
      <div style="display:flex;gap:8px;align-items:baseline;flex-wrap:wrap">
        <b>${E(a.retailer_name||a.retailer)}</b>
        <span class="b ${f[1]}">${f[0]}${a.days_since_check!=null?` · ${a.days_since_check}d`:''}</span>
        ${a.availability?`<span class="b">${E(a.availability)}</span>`:''}
        ${a.format_listed?`<span class="b">${E(a.format_listed)}</span>`:''}
        ${a.price_band?`<span class="b">${E(a.price_band)}</span>`:''}
        <span class="by">tier ${E(a.source_tier)}</span>
      </div>
      <div class="small" style="margin-top:4px">
        <span class="lock">correspondência</span> ${E(a.match_basis||'—')}
        ${a.actionable?'':' <span class="b flag">não confirmada como esta edição</span>'}
        ${a.match_note?`<div class="by">${E(a.match_note)}</div>`:''}</div>
      ${a.url?(a.actionable
        ? `<div class="small" style="margin-top:5px"><a href="${E(a.url)}" target="_blank" rel="noopener">abrir anúncio ↗</a>
             ${a.listing_id?`<span class="by"> ${E(a.listing_id)}</span>`:''}</div>`
        : `<div class="small muted" style="margin-top:5px">Link guardado como pista e não
             apresentado como opção de compra desta edição, porque a correspondência não foi
             confirmada. <a href="${E(a.url)}" target="_blank" rel="noopener">ver mesmo assim ↗</a></div>`)
        :''}
    </div>`;}).join('')}</div>`;
}

/* ---------- revalidação -------------------------------------------------
   Uma conclusão guardada só em prosa envelhece em silêncio. Cada afirmação
   estrutural carrega um predicado reexecutado a cada build; a prosa original
   fica visível ao lado do resultado, para que se veja o que mudou.          */
const RV = {current:['evidência confere','ok'],
            stale:['evidência desatualizada','flag'],
            unverifiable:['sem evidência verificável','warn']};
function rvBadge(g){
  const s=(g.revalidation||{}).status; if(!s) return '';
  const r=RV[s]||[s,''];
  return `<span class="b ${r[1]}" title="revalidado em ${E((g.revalidation||{}).checked||'')}">${r[0]}</span>`;
}
function gapEvidence(g){
  const rv=g.revalidation||{};
  const items = rv.evidence || (g.evidence||[]).map(e=>
    typeof e==='string' ? {claim:e, checkable:false, reason:'evidência em prosa'} : e);
  if(!items.length) return '';
  return `<p class="small" style="margin-top:10px"><b>Evidência</b></p>
  <ul class="small">${items.map(e=>{
    if(!e.checkable) return `<li>${E(e.claim)} <span class="b">não verificável</span>
      ${e.reason?`<div class="by">${E(e.reason)}</div>`:''}</li>`;
    const bad=(e.checks||[]).filter(c=>c.ok!==true);
    return `<li>${E(e.claim)}
      <span class="b ${e.holds?'ok':'flag'}">${e.holds?'confere':'NÃO confere mais'}</span>
      ${bad.length?`<div class="by">${bad.map(c=>
        `${E(CHK_PT[c.type]||c.type)}: esperava ${E(plain(c.expect))}, hoje é ${E(plain(c.actual))}`
        +(c.error?' — '+E(c.error):'')).join('<br>')}</div>`:''}</li>`;
  }).join('')}</ul>`;
}

const GAP_TYPE = {

  'asymmetric-coverage':      'Um lado muito mais coberto que o outro',
  'absent-region':            'Um assunto inteiro ausente'
};
const CAND_PT = {'gap-filler':'fecha a lacuna',

const GAP_ST = {open:'em aberto', proposed:'proposta feita',
                accepted:'resolvida', dismissed:'descartada'};
const CHK_PT = {

  count_tensions:'número de tensões', tension_present:'presença de uma tensão',
  relation_count:'número de ligações entre obras'
};
const plain = v => v==null ? '—'
  : (typeof v==='object' ? Object.entries(v).map(([k,x])=>k+': '+x).join(', ') : String(v));
/* Renderiza um bloco de dados como frases, nunca como JSON. */
function propBlock(o, prefix){
  if(o==null) return '';
  if(Array.isArray(o)) return `<ul class="small">${o.map(x=>`<li>${E(plain(x))}</li>`).join('')}</ul>`;
  if(typeof o!=='object') return `<p class="small">${E(String(o))}</p>`;
  const PT = {creates:'Criaria', movements:'Movimentos', question:'Pergunta',
              title:'Título', note:'Observação', member_allocation:'Divisão das obras',
              inclusion_criteria:'Critérios do que entra', keeps:'Mantém',
              affects:'Afeta', rationale:'Razão'};
  return `<ul class="small">${Object.entries(o).map(([k,v])=>{
    const rot = PT[k] || k.replace(/_/g,' ');
    if(v && typeof v==='object' && !Array.isArray(v))
      return `<li><b>${E(rot)}</b>${propBlock(v)}</li>`;
    if(Array.isArray(v))
      return `<li><b>${E(rot)}:</b> ${v.map(x=>E(plain(x))).join(' · ')}</li>`;
    return `<li><b>${E(rot)}:</b> ${E(String(v))}</li>`;
  }).join('')}</ul>`;
}
const SP_TYPE = {refine:['refinar','degrau 3'], rename:['renomear','degrau 4'],

const SP_ST = {open:['aberta','warn'], approved:['aprovada por você','ok'],

function vPropostas(){ return ''; }  /* incorporado em vRevisao (interface-rules §6) */

                media:['prioridade média','warn'], baixa:['prioridade baixa','']};
/* ---------- Decisões (interface-rules §7; dados em review/decisions.yaml) -- */
const DK = {obra:['＋','Adicionar obra'], edicao:['▤','Escolher edição'], posicao:['↕','Confirmar posição'],
            colecao:['⇆','Mudar uma coleção'], lugar:['⌂','Onde colocar'],
            regra:['§','Mudar uma regra']};
const DPRI = {alta:['Alta','hi',0], media:['Média','md',1], baixa:['Baixa','',2]};
const DSHORT = {'greco-roman':'Greco-Romana','political-thought':'Política','survival-self-sufficiency':'Sobrevivência'};
const DEC = {st:'decidir', k:'', c:'', pick:{}};
const mdi = s => E(s||'').replace(/\*([^*]+)\*/g,'<i>$1</i>');
function decColls(cs){

function decComposition(cid, note){
  const k=C(cid); if(!k) return '';
  const mv=[]; let cur=null;
  (k.sequence||[]).forEach(s=>{ if(s.kind==='movement'){ const m=/^\s*[IVXLCDM]+\s*[.—-]\s*(.+)$/.exec(s.movement||''); cur={n:m?m[1]:s.movement,c:0}; mv.push(cur);} else if(cur) cur.c++; });
  const cols=['#12509b','#1b6cd0','#3d82d8','#5b9be6','#8ab8ee','#b9d3f3','#7c8796','#9aa4b2','#4a6fa5','#2c5d9e','#c2cad6'];
  return `<h4>Como a coleção está hoje</h4>
    <div class="dbar">${mv.map((m,i)=>`<span style="flex:${m.c};background:${cols[i%cols.length]}"></span>`).join('')}</div>

    ${note?`<p class="dnote">${mdi(note)}</p>`:''}`;

function decPos(d){
  const w=W(d.work); if(!w) return '';
  const cid=(d.collections||[])[0]; const k=C(cid);
  let chips='';
  if(k){ let mvName='', mvIdx=-1; const seq=k.sequence||[];
    const i=seq.findIndex(s=>s.work===d.work);
    for(let j=i;j>=0;j--) if(seq[j].kind==='movement'){ mvName=seq[j].movement; break; }
    const prev=seq.slice(0,i).reverse().find(s=>s.kind==='work'), next=seq.slice(i+1).find(s=>s.kind==='work');
    const au = s => (wAuthors(s.work)||'').split(',')[0].trim();
    const same = [prev,next].some(s=>s&&au(s)===au(seq[i]));
    const short = s => { const x=wTitle(s.work)||''; return x.length>26?x.slice(0,24)+'…':x; };
    const nm = s => s?`${s.n} ${E(same||!au(s)?short(s):au(s).split(' ').slice(-1)[0])}`:'';
    chips = `<div class="dposl"><span>${E(mvName)}</span>${prev?`<span>${nm(prev)}</span>`:''}<span class="me">${nm(seq[i])}</span>${next?`<span>${nm(next)} →</span>`:''}</div>`;
  }
  return `<div class="dcov">${thumbWork(w)}<div><b>${lk('obra/'+w.id,wTitle(w.id))}</b> · ${E(wAuthors(w.id))}${chips}</div></div>`;
}
/* Literal JS entre aspas simples, seguro dentro de um atributo HTML de aspas
   duplas — JSON.stringify não serve aqui: as aspas duplas dele fecham o
   atributo e o onclick vira sintaxe quebrada. */
function JSQ(v){return "'"+String(v==null?'':v).replace(/\\/g,'\\\\').replace(/'/g,"\\'")
  .replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/\n/g,' ')+"'";}
function decEditions(d, ro){
  return `<div class="dcmp">${(d.editions||[]).map(e=>{const p=e.pub&&P(e.pub);
    const img = p ? coverImg(p,'sm') : '';
    const tag = ro ? 'div' : 'button';
    const chosen = ro && d.decided && String(d.decided.choice||'').trim().startsWith(e.key+' ');
    return `<${tag} class="ded${ro?' ro':''}${chosen?' sel':''}" data-o="${E(e.key)}"${ro?'':` onclick="decPick('${E(d.id)}','${E(e.key)}','edicao',${JSQ(e.label)})"`}>
      ${img||`<div class="dnoimg">${p?'sem capa':'sem registro<br>ainda'}</div>`}<div>
      <h3><span class="dk">edição ${E(e.key)}</span> ${E(e.label)}</h3><div class="dhint">${E(e.status||'')}</div>
      <dl>${(e.facts||[]).map(f=>`<dt>${E(f[0])}</dt><dd>${E(f[1])}</dd>`).join('')}</dl>
      <ul class="dpc">${(e.pros||[]).map(x=>`<li class="plus">+ ${E(x)}</li>`).join('')}${(e.cons||[]).map(x=>`<li class="minus">− ${E(x)}</li>`).join('')}</ul></div></${tag}>`;}).join('')}</div>`;
}
function decCands(d){
  const cs=d.candidates||[]; const comp=d.composition && (d.collections||[])[0];
  if(!cs.length && !comp) return '';
  const VD={resolve:['Resolve','yes'],complementa:['Complementa','part'],outra:['Outra questão','part']};
  return `<details class="dmore"><summary>${cs.length?`Comparar as obras sugeridas <span class="dcnt">${cs.length}</span>`:'Como a coleção está hoje'}</summary><div class="dmbody">
    ${cs.length?`<div class="dcands">${cs.map(c=>{const v=VD[c.verdict]||['',''];
      return `<div class="dcand${c.best?' best':''}"><div class="dch"><div><div class="dct">${mdi(c.title)}</div><div class="dca">${E(c.author||'')}</div></div>${v[0]?`<span class="dst ${v[1]}">${v[0]}</span>`:''}</div>
        ${c.adds?`<p>${mdi(c.adds)}</p>`:''}
        ${(c.facts||[]).length?`<div class="dfacts">${c.facts.map(f=>f[0]==='+'?`<span class="g">${E(f.slice(1))}</span>`:f[0]==='-'?`<span class="b">${E(f.slice(1))}</span>`:`<span>${E(f)}</span>`).join('')}</div>`:''}</div>`;}).join('')}</div>`:''}
    ${comp?decComposition(comp, d.composition_note):''}
  </div></details>`;
}
/* Cartão decidido: o raciocínio continua consultável, recolhido. */
function decDecidedDetail(d){
  const eds=(d.editions||[]).length, ops=(d.options||[]).length;
  if(!eds && !ops && !d.why && !d.recommendation) return '';
  const rec=(d.options||[]).find(o=>o.recommended), recKey = rec?rec.key:d.recommended;
  return `<details class="dmore"><summary>Ver as opções e os motivos</summary><div class="dmbody">
    ${d.why?`<p class="dwhy">${mdi(d.why)}</p>`:''}

    ${ops?`<ul class="dpc">${d.options.map(o=>`<li><b>${E(o.key)}.</b> ${mdi(o.title)}${o.effect?` <span class="dhint">${mdi(o.effect)}</span>`:''}</li>`).join('')}</ul>`:''}

  </div></details>`;
}
function decCard(d){
  const kd=DK[d.kind]||['•',d.kind], pr=DPRI[d.priority];
  const rec=(d.options||[]).find(o=>o.recommended), recKey = rec?rec.key:d.recommended;
  const top=`<div class="dtop"><span class="dkind"><span class="dki">${kd[0]}</span>${kd[1]}<span class="dsep">·</span><span class="dcoll">${E(decColls(d.collections))}</span></span>${pr?`<span class="dprio ${pr[1]}">${pr[0]}</span>`:''}</div>`;
  if(d.state==='decidida'){
    const dc=d.decided||{};
    return `<article class="dcard dsmall" data-st="decidida" data-k="${E(d.kind)}" data-c="${E((d.collections||[]).join(' '))}">
      <div class="dhead">${top}<h2 class="dq">${mdi(d.question)}</h2>
      <p class="dwhy"><b>Escolha:</b> ${mdi(dc.choice)}${dc.note?` <span class="dhint">${mdi(dc.note)}</span>`:''}</p>
      <p class="dhint">Decidido em ${E(dc.date||'')}. Para desfazer, peça na conversa.</p></div>
      ${decDecidedDetail(d)}</article>`;
  }
  return `<article class="dcard" id="dc-${E(d.id)}" data-st="${E(d.state)}" data-k="${E(d.kind)}" data-c="${E((d.collections||[]).join(' '))}" data-q="${E((d.question||'').replace(/\*/g,''))}">
    <div class="dhead">${top}
      <h2 class="dq">${mdi(d.question)}</h2>
      ${d.why?`<p class="dwhy">${mdi(d.why)}</p>`:''}
      ${d.update?`<p class="dupd">${mdi(d.update)}</p>`:''}
    </div>
    ${d.kind==='posicao'||d.kind==='lugar'?decPos(d):''}
    ${(d.editions||[]).length?decEditions(d):''}
    ${d.state==='aguardando'?`<div class="dwait"><span>⏳</span><div><b>Nada a decidir agora.</b> ${mdi(d.waiting_for||'')}</div></div>
      ${(d.signals||[]).length?`<div class="dsig">${d.signals.map(s=>`<div><span class="ddot"></span><span>${mdi(s)}</span></div>`).join('')}</div>`:''}`:''}
    ${d.state==='decidir'&&(d.options||[]).length?`<div class="dopts">${d.options.map(o=>`<button class="dopt" data-o="${E(o.key)}" onclick="decPick('${E(d.id)}','${E(o.key)}','opcao',${JSQ(o.title)})">
      <span class="dl">${E(o.key)}</span><span><span class="dt">${mdi(o.title)}</span>${o.recommended?'<span class="drec">recomendada</span>':''}
      <div class="dc">${mdi(o.effect||'')}</div></span></button>`).join('')}</div>`:''}
    ${d.state==='decidir'&&d.recommendation?`<p class="drecwhy"><b>${recKey?`Por que ${E(recKey)}:`:'Minha leitura:'}</b> ${mdi(d.recommendation)}</p>`:''}
    ${d.state==='decidir'?`<div class="dfoot"><button class="dbtn" disabled onclick="decSend('${E(d.id)}')">Responder</button><span class="dhint">Escolha uma opção. A resposta é copiada para você colar na conversa.</span></div>`
      :((d.signals||[]).length?`<div class="dfoot"><span class="dhint">Verificado a cada atualização da biblioteca.</span></div>`:'<div style="height:18px"></div>')}
    ${decCands(d)}
  </article>`;
}
/* DEFEITO CORRIGIDO 2026-09-27 — o texto copiado dizia "opção X" mesmo quando
   o que fora escolhido era uma EDIÇÃO. Nos cartões de edição não existe opção
   nenhuma com aquela letra, então a resposta colada na conversa apontava para
   algo que não existe no arquivo, e o agente tinha de adivinhar. Agora a
   escolha diz o que é e carrega o rótulo, que sobrevive a renumeração. */
function decPick(id,key,tipo,rotulo){
  const card=document.getElementById('dc-'+id); if(!card) return;
  card.querySelectorAll('[data-o]').forEach(x=>x.classList.toggle('sel',x.dataset.o===key));
  DEC.pick[id]={key:key,tipo:tipo||'opcao',rotulo:rotulo||''};
  const b=card.querySelector('.dbtn');
  if(b){b.disabled=false;b.textContent='Responder: '+decFrase(DEC.pick[id]);}
}
function decFrase(p){
  const nome=(p.tipo==='edicao'?'edição ':'opção ')+p.key;
  return p.rotulo ? nome+' · '+p.rotulo : nome;
}
function decSend(id){
  const card=document.getElementById('dc-'+id); const p=DEC.pick[id]; if(!card||!p) return;
  const txt='Decisão — '+card.dataset.q+' → '+decFrase(p);
  const ok=()=>{const t=document.getElementById('dtoast'); if(t){t.classList.add('on');setTimeout(()=>t.classList.remove('on'),1800);}};
  try{ navigator.clipboard.writeText(txt).then(ok,()=>prompt('Copie a resposta:',txt)); }catch(e){ prompt('Copie a resposta:',txt); }
}
function decApply(){
  let n=0;
  document.querySelectorAll('.dcard').forEach(el=>{const ok=el.dataset.st===DEC.st&&(!DEC.k||el.dataset.k===DEC.k)&&(!DEC.c||el.dataset.c.split(' ').includes(DEC.c));
    el.classList.toggle('dhide',!ok); if(ok) n++;});
  const e=document.getElementById('dempty'); if(e) e.style.display=n?'none':'block';
  document.querySelectorAll('.dtab').forEach(b=>b.classList.toggle('on',b.dataset.st===DEC.st));
  document.querySelectorAll('.dchip[data-k]').forEach(b=>b.classList.toggle('on',b.dataset.k===DEC.k));
}
function decTab(st){DEC.st=st;decApply();}
function decKind(k){DEC.k=k;decApply();}
function decColl(c){DEC.c=c;decApply();}

async function connectDir(){
  if(!window.showDirectoryPicker){
    alert('Este navegador não oferece acesso a pastas. Use "Gravar" (Salvar como) ou "Copiar YAML".');
    return false;
  }
  try{
    const h = await window.showDirectoryPicker({mode:'readwrite', id:'bibliotheca'});
    try{ await h.getDirectoryHandle('collections'); await h.getDirectoryHandle('state'); }
    catch(e){
      alert('Essa pasta não parece ser a raiz da biblioteca — falta collections/ ou state/.\\n'+
            'Escolha a pasta que contém collections/, works/, state/ e tools/.');
      return false;
    }
    DIRH = h; render(); return true;
  }catch(e){ return false; }
}

async function saveState(){
  const yaml = stateYaml();
  let ok = false, why = '';
  if(!DIRH && window.showDirectoryPicker) await connectDir();
  if(DIRH){
    try{
      const st = await DIRH.getDirectoryHandle('state', {create:true});
      const fh = await st.getFileHandle('personal.yaml', {create:true});
      const w  = await fh.createWritable(); await w.write(yaml); await w.close();
      ok = true;
    }catch(e){ why = e.message; }
  }
  if(!ok && window.showSaveFilePicker){
    try{
      const h = await window.showSaveFilePicker({suggestedName:'personal.yaml'});
      const w = await h.createWritable(); await w.write(yaml); await w.close();
      ok = true;
    }catch(e){ if(e && e.name!=='AbortError') why = e.message; }
  }
  if(ok) commitSaved();
  else if(why) alert('Falha ao gravar: '+why);
  else if(!window.showDirectoryPicker && !window.showSaveFilePicker)
    alert('Este navegador/contexto não permite gravar arquivos locais. Use "Copiar YAML".');
  return ok;
}

/* Só depois de uma gravação BEM-SUCEDIDA: o que estava pendente passa a ser
   a base, o pendente esvazia, e o indicador volta a limpo. */
function commitSaved(){
  for(const b of Object.keys(PENDING)){
    D.state[b] = D.state[b] || {};
    for(const id in PENDING[b])
      D.state[b][id] = Object.assign({}, D.state[b][id]||{}, PENDING[b][id]);
    PENDING[b] = {};
  }
  LASTSAVED = new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
  updateSaveUI();
  render();
}
function stateYaml(){
  const merge=(k)=>{const o={};Object.assign(o, D.state[k]||{});
    for(const id in PENDING[k]) o[id]=Object.assign({},o[id]||{},PENDING[k][id]);
    return o;};
  const dump=(o)=>{const ks=Object.keys(o).sort();if(!ks.length)return ' {}';
    return '\n'+ks.map(id=>'  '+id+':\n'+Object.entries(o[id]).map(([f,v])=>
      '    '+f+': '+(v==null?'null':(/^[\w.-]+$/.test(String(v))?v:JSON.stringify(v)))).join('\n')).join('\n');};
  return '# Estado pessoal. O único arquivo que a interface escreve.\nworks:'+
    dump(merge('works'))+'\npublications:'+dump(merge('publications'))+'\n';
}
function copyState(){
  const y = stateYaml();
  const done = ()=>{const b=$('#savestatus'); if(b){const t=b.textContent; b.textContent='YAML copiado';
    setTimeout(()=>updateSaveUI(),1400);} };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(y).then(done, ()=>selectYaml());
  } else selectYaml();
  function selectYaml(){
    const pre=$('pre.state'); if(!pre) return; const dd=pre.closest('details'); if(dd) dd.open=true;
    const r=document.createRange(); r.selectNodeContents(pre);
    const s=getSelection(); s.removeAllRanges(); s.addRange(r);
    alert('Não consegui usar a área de transferência aqui. O YAML já está selecionado — copie com Ctrl+C.');
  }
}

function vBusca(q){

  const ws=Object.values(D.works).filter(w=>hit(w.title_pt)||hit(w.title_original)||hit(w.id)||hit(wAuthors(w.id))
    ||w.memberships.some(m=>hit(m.why_here)));
  const cs=Object.values(D.collections).filter(c=>hit(c.title_pt)||hit(c.question)||hit(c.id));
  const ps=Object.values(D.publications).filter(p=>hit(p.title_as_published)||hit(p.publisher)||hit(p.id));

  ${!(ws.length+cs.length+ps.length+as.length+gs.length)?'<p class="unk">Nada encontrado.</p>':''}`;

function byMark(by){

const FOLD = {mvClosed:{}, volOpen:{}, keys:{mv:[], vol:[]}};
function rerender(){ const y=window.scrollY; render(); window.scrollTo(0,y); }
function toggleMv(k){ FOLD.mvClosed[k] = !FOLD.mvClosed[k]; rerender(); }

/* Voltar. A trilha é nossa e não o histórico do navegador: dentro de um
   artefato o histórico pode levar para fora da página, e a trilha nunca leva.
   Quando o destino já está na trilha, ela encolhe em vez de crescer — assim
   ir e voltar entre duas telas não acumula. */
const trail = [];
const scrollMem = {};
let curHash = location.hash || '#/';
const PARENT = {obra:['#/catalogo','Catálogo'], publicacao:['#/publicacoes','Publicações'],
                autor:['#/autores','Autores'], colecao:['#/colecoes','Coleções'],
                busca:['#/','Visão geral']};
const RNAME = {'':'Visão geral', catalogo:'Catálogo', colecoes:'Coleções', colecao:'Coleção',
               obra:'Obra', autor:'Autor', autores:'Autores', publicacao:'Publicação',
               publicacoes:'Publicações', leitura:'Leitura e acervo', estado:'Estado pessoal',
               revisao:'Decisões', busca:'Busca'};
function pushTrail(h){
  const i = trail.lastIndexOf(h);
  if(i >= 0) trail.length = i + 1; else trail.push(h);
}
function goBack(){
  if(trail.length > 1){ trail.pop(); location.hash = trail[trail.length-1]; }
  else location.hash = '#/';
}
function ctxBar(r, arg){
  if(r === '') return '';
  const parts = [`<a href="#/">Visão geral</a>`];
  const par = PARENT[r];
  if(par) parts.push(`<a href="${par[0]}">${par[1]}</a>`);
  let here = RNAME[r] || r;
  if(r==='obra')       here = wTitle(arg);
  if(r==='colecao')    here = (C(arg)||{}).title_pt || arg;
  if(r==='autor')      here = (A(arg)||{}).name_display || arg;
  if(r==='publicacao') here = (P(arg)||{}).title_as_published || arg;
  if(r==='busca')      here = 'Busca: ' + arg;
  parts.push(`<span class="here">${E(here)}</span>`);
  const prev = trail.length > 1 ? trail[trail.length-2] : (par ? par[0] : '#/');
  const prevName = trail.length > 1
    ? (RNAME[(prev.replace(/^#\//,'').split('/')[0])] || 'anterior')
    : (par ? par[1] : 'Visão geral');
  return `<div class="ctx">
    <button class="back" onclick="goBack()" title="Voltar para ${E(prevName)}">← Voltar</button>
    <nav class="crumb" aria-label="Trilha">${parts.join('<span class="sep">›</span>')}</nav>
  </div>`;
}

 '#/publicacoes':'<path d="M5 4.5A1.5 1.5 0 0 1 6.5 3H18a1 1 0 0 1 1 1v15.5a1 1 0 0 1-1 1H6.5A1.5 1.5 0 0 1 5 19V4.5z"/><path d="M5 17h14"/>',
 '#/leitura':'<path d="M12 6.5C10.5 5 8.5 4.4 4 4.6v13c4.5-.2 6.5.4 8 1.9 1.5-1.5 3.5-2.1 8-1.9v-13c-4.5-.2-6.5.4-8 1.9z"/><path d="M12 6.5v12.9"/>',
 '#/estado':'<circle cx="12" cy="8" r="3.2"/><path d="M4.5 20c.8-3.6 3.6-5.6 7.5-5.6s6.7 2 7.5 5.6"/>',
 '#/revisao':'<circle cx="11" cy="11" r="6.2"/><path d="m20 20-4.4-4.4"/><path d="M11 8.2v3.2M11 14h.01"/>',
};
function icon(href){
  const d = ICONS[href]; if(!d) return '';
  return `<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor"
    stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
}
let navCollOpen = (()=>{try{return localStorage.getItem('bib.navColl')==='1';}catch(e){return false;}})();
function toggleNavColl(ev){
  ev.preventDefault(); ev.stopPropagation();
  navCollOpen = !navCollOpen;
  try{localStorage.setItem('bib.navColl', navCollOpen?'1':'0');}catch(e){}
  nav();
}
const CHEV = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>';
/* Barra inferior no celular (≤760px) — decisão do Mathews, 2026-09-24:
   4 destinos + lupa; "Mais" abre o índice completo numa gaveta de baixo. */
const TABI = {
  search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',
  more:'<circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/>'};
const tsvg = d => `<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
function tabbar(){
  const h=location.hash||'#/';
  const main = h==='#/' ? 'home' : h==='#/catalogo'||h.startsWith('#/catalogo') ? 'cat'
    : (h==='#/colecoes'||h.startsWith('#/colecao/')) ? 'coll' : h.startsWith('#/busca') ? 'search' : 'more';
  const sOpen=document.body.classList.contains('search-open'), mOpen=document.body.classList.contains('sheet-open');
  const on = k => (k==='search'?sOpen:k==='more'?mOpen:(!sOpen&&!mOpen&&main===k)) || (k==='more'&&main==='more'&&!sOpen) || (k==='search'&&main==='search'&&!mOpen) ? ' on' : '';
  const a = (k,href,label,svg)=>`<a class="${on(k).trim()}" href="${href}" onclick="closeSheet();closeSearch()">${svg}<span>${label}</span></a>`;
  const b = (k,fn,label,svg)=>`<button type="button" class="${on(k).trim()}" onclick="${fn}">${svg}<span>${label}</span></button>`;
  $('#tabbar').innerHTML =
    a('home','#/','Início',icon('#/')) + a('cat','#/catalogo','Catálogo',icon('#/catalogo')) +
    b('search','toggleSearch()','Buscar',tsvg(TABI.search)) +
    a('coll','#/colecoes','Coleções',icon('#/colecoes')) + b('more','toggleSheet()','Mais',tsvg(TABI.more));
}
function toggleSheet(){ closeSearch(); document.body.classList.toggle('sheet-open'); tabbar(); }
function closeSheet(){ if(document.body.classList.contains('sheet-open')){document.body.classList.remove('sheet-open'); tabbar();} }
function toggleSearch(){
  closeSheet();
  const open=document.body.classList.toggle('search-open');
  if(open) setTimeout(()=>$('#q').focus(),30); else { $('#q').blur(); sug.hidden=true; }
  tabbar();
}
function closeSearch(){ if(document.body.classList.contains('search-open')){document.body.classList.remove('search-open'); tabbar();} }
function nav(){
  const c=D.counts, h=location.hash||'#/';
  const it=[['','#/','Visão geral',''],
    ['sec','','Acervo',''],
    ['','#/catalogo','Catálogo',c.works],
    ['coll','#/colecoes','Coleções',c.collections],
    ['','#/autores','Autores',Object.values(D.authors).filter(a=>(a.works||[]).length).length],
    ['','#/publicacoes','Publicações',c.publications],
    ['sec','','Você',''],
    ['','#/leitura','Leitura e acervo',''],
    ['','#/estado','Estado pessoal',''],
    ['sec','','Curadoria',''],
    ['','#/revisao','Decisões',(D.decisions||[]).filter(d=>d.state==='decidir').length]];
  const inColl = h.startsWith('#/colecao/');
  const open = navCollOpen || inColl;
  const link = (href,label,n,cls)=>`<a href="${href}" class="${cls||''}"><span class="ich">${icon(href)}</span><span class="lb">${label}</span>${n!==''?`<b>${n}</b>`:''}</a>`;
  $('#nav').innerHTML = '<div class="sheethead"><span>Índice</span><button type="button" onclick="closeSheet()" aria-label="Fechar">✕</button></div>' + it.map(([k,href,label,n])=>{
    if(k==='sec') return `<div class="sect">${label}</div>`;
    if(k==='coll'){
      const colls = Object.values(D.collections);
      const sub = colls.map(x=>{const hh='#/colecao/'+encodeURIComponent(x.id);
        return `<a href="${hh}" class="${h===hh?'on':''}"><span class="lb">${E(x.title_pt||x.id).replace(/\//g,'/<wbr>')}</span><b>${x.member_count}</b></a>`;}).join('');
      return `<div class="navgrp${open?' open':''}">${link(href,label,n,h===href?'on':'')}
        <button class="navx" type="button" aria-expanded="${open}" aria-label="${open?'Recolher':'Mostrar'} a lista de coleções" onclick="toggleNavColl(event)">${CHEV}</button></div>
        <div class="navsub"${open?'':' hidden'}>${sub}</div>`;
    }
    return link(href,label,n,h===href?'on':'');
  }).join('');
  tabbar();
}
function vPubs(){
  return `<h1>Publicações</h1>
  <p class="muted small">As edições registradas na biblioteca.</p>
  <div class="rows">${Object.values(D.publications).map(p=>`<div class="row"><div class="n">${coverImg(p,'sm')||'<span class="nothumb"></span>'}</div>
    <div class="t">${lk('publicacao/'+p.id,p.title_as_published||p.id)}
      <div class="au">${[p.publisher,p.year].filter(Boolean).map(E).join(', ')}</div></div>
    <div class="meta">${buyLink(p)}</div></div>`).join('')}</div>`;
}
function render(){
  const h=(location.hash||'#/').replace(/^#\//,'');
  const [r,arg]=[h.split('/')[0], decodeURIComponent(h.split('/').slice(1).join('/')||'')];
  let out;
  try{
    if(r==='') out=vHome();
    else if(r==='catalogo') out=vCatalogo();
    else if(r==='colecoes') out=vColecoes();
    else if(r==='colecao') out=vColecao(arg);
    else if(r==='obra') out=vObra(arg);
    else if(r==='publicacao') out=vPub(arg);
    else if(r==='publicacoes') out=vPubs();
    else if(r==='autor') out=vAutor(arg);
    else if(r==='autores') out=vAutores();
    else if(r==='leitura') out=vLeitura();
    else if(r==='estado') out=vEstado();
    else if(r==='revisao') out=vRevisao();
    else if(r==='busca') out=vBusca(arg);
    else out='<p>Rota desconhecida.</p>';
  }catch(err){out='<h1>Erro ao renderizar</h1><pre class="state">'+E(err&&err.stack||err)+'</pre>';}
  $('#view').innerHTML = ctxBar(r, arg) + out;
  nav(); updateSaveUI();
  window.scrollTo(0, scrollMem[location.hash||'#/'] || 0);
  const fc=$('#fc'),fr=$('#fr'),fd=$('#fd');
  if(fc)fc.onchange=e=>setSub('cat','coll',e.target.value);
  if(fr)fr.onchange=e=>setSub('cat','rs',e.target.value);
  if(fd)fd.onchange=e=>setSub('cat','rd',e.target.value);
  const fe=$('#fe'),fg=$('#fg');
  if(fe)fe.onchange=e=>setSub('cat','ed',e.target.value);
  if(fg)fg.onchange=e=>setSub('cat','g',e.target.value);
}
window.addEventListener('hashchange', ()=>{
  document.body.classList.remove('sheet-open','search-open');
  if(typeof sug!=='undefined' && sug) sug.hidden = true;
  scrollMem[curHash] = window.scrollY;      // guarda onde estavas
  curHash = location.hash || '#/';
  pushTrail(curHash);
  render();
});
pushTrail(curHash);
function goCat(f){
  state.cat = Object.assign({}, f);
  if((location.hash||'#/') === '#/catalogo') render();   // hash igual não dispara hashchange
  else location.hash = '#/catalogo';
}

/* Busca incremental. O acervo inteiro cabe em memória; procurar a cada tecla
   custa nada e muda a sensação de controlo — antes era preciso disparar uma
   rota às cegas para saber se havia resultado. */
const sug = $('#sug');
const norm = t => (t||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
function suggest(q){
  const n = norm(q);
  if(n.length < 2){ sug.hidden = true; sug.innerHTML=''; return; }
  const hit = [];
  const push = (kind,href,label,sub)=>{ if(hit.length<9) hit.push({kind,href,label,sub}); };
  Object.values(D.works).forEach(w=>{ if(norm(wTitle(w.id)).includes(n)||norm(wAuthors(w.id)).includes(n))
    push('obra','#/obra/'+w.id, wTitle(w.id), wAuthors(w.id)); });
  Object.values(D.collections).forEach(k=>{ if(norm(k.title_pt).includes(n))
    push('coleção','#/colecao/'+k.id, k.title_pt, (k.question||'').slice(0,70)); });
  Object.values(D.authors).forEach(a=>{ if(norm(a.name_display).includes(n))
    push((a.role||'author')==='author'?'autor':'tradutor','#/autor/'+a.id, a.name_display,
         ((a.works||[]).length? (a.works.length+' obra(s)') : '')); });
  Object.values(D.publications).forEach(pb=>{ if(norm(pb.title_as_published||pb.id).includes(n))
    push('edição','#/publicacao/'+pb.id, pb.title_as_published||pb.id, pb.publisher||''); });
  sug.innerHTML = hit.length
    ? hit.map(h=>`<a href="${h.href}"><span class="k">${h.kind}</span>${E(h.label)}${
        h.sub?`<div class="au">${E(h.sub)}</div>`:''}</a>`).join('') +
      `<a href="#/busca/${encodeURIComponent(q)}"><span class="k">tudo</span>Ver todos os resultados de “${E(q)}”</a>`
    : '<div class="none">Nada encontrado.</div>';
  sug.hidden = false;
}
$('#q').addEventListener('input', e=>suggest(e.target.value));
$('#q').addEventListener('keydown',e=>{
  if(e.key==='Enter'){ sug.hidden=true; location.hash='#/busca/'+encodeURIComponent(e.target.value); }
  if(e.key==='Escape'){ sug.hidden=true; e.target.blur(); closeSearch(); }
});
document.addEventListener('click', e=>{ if(!e.target.closest('.searchwrap')) sug.hidden=true; });
$('#themebtn').onclick=()=>{const r=document.documentElement;
  r.dataset.theme = r.dataset.theme==='light' ? 'dark' : 'light';};
/* Capas ampliáveis. A escuta é na fase de captura para que o clique na capa
   não acione o elemento em volta (linha, botão de decisão). */
const zoom=document.createElement('div'); zoom.className='zoom'; zoom.hidden=true;
zoom.innerHTML='<img alt="">'; document.body.appendChild(zoom);
function closeZoom(){ zoom.hidden=true; zoom.firstChild.removeAttribute('src'); }
document.addEventListener('click', e=>{
  const im=e.target.closest && e.target.closest('img.cover'); if(!im) return;
  e.preventDefault(); e.stopPropagation();
  zoom.firstChild.src=im.currentSrc||im.src; zoom.firstChild.alt=im.alt; zoom.hidden=false;
}, true);
zoom.addEventListener('click', closeZoom);
document.addEventListener('keydown', e=>{ if(e.key==='Escape' && !zoom.hidden) closeZoom(); });
window.addEventListener('hashchange', closeZoom);
render();
</script>
