  --sans:"IBM Plex Sans",-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#0F1512; --surface:#161D19; --surface-2:#1C2521; --surface-3:#232E29;
  --ink:#E7EDE9; --ink-soft:#A0AFA8; --ink-faint:#77867F;
  --rule:#29332E; --rule-2:#3A463F;
  --accent:#1b6cd0; --accent-ink:#1b6cd0; --accent-soft:rgba(27,108,208,.16);
  --lit:#B79BE0; --lit-soft:rgba(183,155,224,.16);
  --flag:#D89261; --flag-soft:#2A1F16;
  --ok:#6FBE93; --ok-soft:#16281F;
  --warn:#D6B466; --warn-soft:#2A2415;
}}
:root[data-theme="dark"]{
  --ground:#0F1512; --surface:#161D19; --surface-2:#1C2521; --surface-3:#232E29;
  --ink:#E7EDE9; --ink-soft:#A0AFA8; --ink-faint:#77867F;
  --rule:#29332E; --rule-2:#3A463F;
  --accent:#1b6cd0; --accent-ink:#1b6cd0; --accent-soft:rgba(27,108,208,.16);
  --lit:#B79BE0; --lit-soft:rgba(183,155,224,.16);
  --flag:#D89261; --flag-soft:#2A1F16;
  --ok:#6FBE93; --ok-soft:#16281F;
  --warn:#D6B466; --warn-soft:#2A2415;
}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:var(--accent-ink);text-decoration:none}
a:hover{text-decoration:underline}
a:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
h1,h2,h3{font-family:var(--serif);font-weight:600;letter-spacing:-.015em;margin:0;text-wrap:balance}
h1{font-size:1.75rem;line-height:1.15;font-weight:800}
h2{font-size:1.2rem;margin:28px 0 10px}
h3{font-size:1rem;margin:20px 0 8px}
p{margin:0 0 .8em}
code{font-family:var(--mono);font-size:.86em;background:var(--surface-2);padding:1px 4px;border-radius:3px}

/* shell */
.shell{display:grid;grid-template-columns:212px 1fr;min-height:100vh}
.side{border-right:1px solid var(--rule);background:var(--surface);padding:14px 0;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{font-family:var(--serif);font-weight:800;font-size:1.05rem;padding:0 16px 12px;letter-spacing:-.02em}
.brand span{color:var(--accent)}
.side nav a{display:flex;justify-content:space-between;gap:8px;padding:6px 16px;color:var(--ink-soft);font-size:13px}
.side nav a:hover{background:var(--surface-2);text-decoration:none;color:var(--ink)}
.side nav a.on{background:var(--accent-soft);color:var(--accent-ink);font-weight:500;box-shadow:inset 2px 0 0 var(--accent)}
.side nav a b{font-family:var(--mono);font-weight:400;font-size:11px;color:var(--ink-faint)}
.sect{font-family:var(--mono);font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-faint);padding:16px 16px 5px}
main{padding:20px 26px 80px;max-width:1000px;min-width:0}
.topbar{display:flex;gap:10px;align-items:center;margin-bottom:18px;flex-wrap:wrap}
#q{flex:1;min-width:180px;padding:7px 10px;border:1px solid var(--rule-2);border-radius:4px;background:var(--surface);color:var(--ink);font:inherit;font-size:13px}
.pill-btn{border:1px solid var(--rule-2);background:var(--surface);color:var(--ink);font:inherit;font-size:12px;padding:6px 10px;border-radius:4px;cursor:pointer}
.pill-btn:hover{background:var(--surface-2)}
.pill-btn.hot{background:var(--flag-soft);border-color:var(--flag);color:var(--flag);font-weight:600}

/* badges */
.b{display:inline-block;font-family:var(--mono);font-size:10.5px;letter-spacing:.04em;padding:1.5px 6px;border-radius:3px;background:var(--surface-2);color:var(--ink-soft);white-space:nowrap;vertical-align:1px}
.b.ok{background:var(--ok-soft);color:var(--ok)}
.b.warn{background:var(--warn-soft);color:var(--warn)}
.b.flag{background:var(--flag-soft);color:var(--flag)}
.b.acc{background:var(--accent-soft);color:var(--accent-ink)}
.b.lit{background:var(--lit-soft);color:var(--lit);font-weight:600}
.b.lit .q{opacity:.78;font-weight:400}
.ded h3 .dk{font-family:var(--mono);font-size:10.5px;letter-spacing:.04em;color:var(--ink-faint);margin-right:4px}
.b.core{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.unk{color:var(--ink-faint);font-style:italic}
.by{font-family:var(--mono);font-size:10px;color:var(--ink-faint);letter-spacing:.04em}

/* cards & lists */
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(258px,1fr))}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:6px;padding:15px 17px;
     transition:border-color .12s, box-shadow .12s}
.card:hover{border-color:var(--rule-2);box-shadow:0 2px 10px rgba(0,0,0,.05)}
.card h3{margin:0 0 4px;font-size:1rem}
.muted{color:var(--ink-soft)}
.small{font-size:12.5px}
.stats{display:grid;gap:1px;background:var(--rule);border:1px solid var(--rule);border-radius:5px;overflow:hidden;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));margin-bottom:20px}
.stats div{background:var(--surface);padding:10px 13px}
.stats dt{font-family:var(--mono);font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-faint)}
.stats dd{margin:2px 0 0;font-size:1.35rem;font-family:var(--serif);font-weight:600;font-variant-numeric:tabular-nums}
.stats dd small{display:block;margin-top:1px;font-size:.7rem;font-family:var(--sans);font-weight:400;color:var(--ink-faint);line-height:1.3}

.rows{border:1px solid var(--rule);border-radius:6px;overflow:hidden;background:var(--surface)}
.row{display:grid;grid-template-columns:minmax(28px,auto) 1fr auto;gap:12px;padding:11px 15px;
     border-bottom:1px solid var(--rule);align-items:baseline;transition:background .12s}
/* REGRESSÃO CORRIGIDA 2026-09-20 — a coluna da esquerda (capa + número) flutuava
   ACIMA da primeira linha do título. Causa: `align-items:baseline` na linha. A
   miniatura é um bloco de 47px e a única baseline da coluna é a do número, que
   fica embaixo dela; o alinhamento por baseline empurrava a coluna inteira para
   cima. Rows só-com-número continuam em baseline, que é o alinhamento certo
   para elas. */
.row .n:has(img.cover),
.row .n:has(.nothumb){align-self:start;padding-top:1px}
.row:last-child{border-bottom:0}
.row:hover{background:var(--surface-2)}
.row .t>a{font-size:14.5px}
/* Hierarquia por EXCEÇÃO: o normal não recebe selo. 125 de 146 obras estão
   por pesquisar — um selo em todas elas não informa nada e é o maior ruído
   visual da interface. Marca-se o que foge à norma. */
.dot{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--accent);
     margin-right:6px;vertical-align:2px}
.glyph{font-family:var(--mono);font-size:11px;color:var(--ink-faint);margin-left:6px}

/* cabeçalho de página */
.ph{margin:0 0 18px}
.ph .eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;
     text-transform:uppercase;color:var(--accent);margin-bottom:5px}
.ph h1{margin:0}
.ph .sub{color:var(--ink-soft);margin:6px 0 0;max-width:62ch}

/* busca incremental */
.searchwrap{position:relative;flex:1;min-width:180px}
.searchwrap #q{width:100%}
.sug{position:absolute;z-index:40;left:0;right:0;top:calc(100% + 5px);
     background:var(--surface);border:1px solid var(--rule-2);border-radius:6px;
     box-shadow:0 10px 28px rgba(0,0,0,.14);overflow:hidden;max-height:58vh;overflow-y:auto}
.sug a{display:block;padding:8px 12px;border-bottom:1px solid var(--rule);color:var(--ink);font-size:13px}
.sug a:last-child{border-bottom:0}
.sug a:hover{background:var(--accent-soft);text-decoration:none}
.sug .k{font-family:var(--mono);font-size:10px;letter-spacing:.07em;
     text-transform:uppercase;color:var(--ink-faint);margin-right:7px}
.sug .none{padding:10px 12px;color:var(--ink-faint);font-size:13px}

/* agrupadores do catálogo */
.gh{padding:9px 15px;background:var(--surface-2);border-top:1px solid var(--rule);
    border-bottom:1px solid var(--rule);font-family:var(--mono);font-size:11px;
    letter-spacing:.07em;text-transform:uppercase;color:var(--ink-soft);
    display:flex;justify-content:space-between;gap:10px}
.gh:first-child{border-top:0}

/* agenda */
.todo{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));margin:0}
.todo a{display:block;background:var(--surface);border:1px solid var(--rule);
    border-left:3px solid var(--accent);border-radius:5px;padding:11px 13px;color:var(--ink)}
.todo a:hover{background:var(--surface-2);text-decoration:none}
.todo b{display:block;font-family:var(--serif);font-size:1.3rem;font-weight:600;
    font-variant-numeric:tabular-nums;line-height:1.1}
.todo span{font-size:12.5px;color:var(--ink-soft)}
.row .n{font-family:var(--mono);font-size:11px;color:var(--ink-faint);text-align:right;font-variant-numeric:tabular-nums}
.row .t{min-width:0}
.row .t .au{color:var(--ink-faint);font-size:12.5px}
.row .meta{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
/* LARGURA DA LINHA, NÃO DA JANELA — correção de 2026-09-27.
   A coluna das marcas tem largura fixa (~205px) e a coluna do texto era
   `1fr`, cujo mínimo é o min-content: entre 761px e ~900px de janela, com a
   barra lateral aberta, o texto era espremido a 79px e o título quebrava
   palavra a palavra. A consulta por JANELA não resolvia, porque a largura que
   importa é a da LINHA, e ela muda com a barra lateral, com o painel lateral
   do app e na impressão. Daí a consulta por RECIPIENTE. */
.rows,.volgroup,.wgrp,.mvbody,.mvcard{container-type:inline-size}
@container (max-width:620px){
  .row{grid-template-columns:auto minmax(0,1fr);row-gap:7px;align-items:start;column-gap:9px}
  .row>div:empty{display:none}
  .row .n{grid-column:1;text-align:left}
  .row .t{grid-column:2;min-width:0}
  .row .meta{grid-column:1/-1;justify-content:flex-start}
}
/* A oração da pastilha ("· encena <obra>") é a primeira coisa a sair quando
   a linha aperta: sobra "Literatura", que é o que precisa ser lido. */
@container (max-width:760px){ .b.lit .q{display:none} }
.row .t{min-width:0}
.mv{background:var(--surface-3);padding:12px 15px;font-family:var(--serif);font-size:14px;
     font-weight:600;letter-spacing:-.01em;text-transform:none;color:var(--ink);
     border-bottom:1px solid var(--rule-2);border-top:3px solid var(--rule-2)}
.mv .pp{display:block;font-family:var(--sans);font-size:12.5px;text-transform:none;letter-spacing:0;color:var(--ink-soft);margin-top:3px;font-weight:400}

.kv{display:grid;grid-template-columns:150px 1fr;gap:6px 14px;font-size:13px;margin:10px 0}
.kv dt{color:var(--ink-faint);font-family:var(--mono);font-size:11px;letter-spacing:.04em;padding-top:2px}
.kv dd{margin:0}
.panel{border:1px solid var(--rule);border-radius:5px;background:var(--surface);padding:14px 16px;margin:14px 0}
.panel.pers{border-color:var(--accent);background:var(--accent-soft)}
.panel.prov{border-left:3px solid var(--flag);background:var(--flag-soft)}
.panel h3{margin-top:0}
.lock{font-family:var(--mono);font-size:10px;color:var(--ink-faint);letter-spacing:.05em}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:12.5px;background:var(--surface)}
th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--rule);vertical-align:top}
th{font-family:var(--mono);font-weight:500;font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-faint);background:var(--surface-2)}
blockquote{margin:10px 0;padding:8px 14px;border-left:3px solid var(--rule-2);color:var(--ink-soft)}
hr{border:0;border-top:1px solid var(--rule);margin:18px 0}
select,input[type=date],input[type=text]{font:inherit;font-size:12.5px;padding:4px 7px;border:1px solid var(--rule-2);border-radius:4px;background:var(--surface);color:var(--ink);max-width:100%}
.filters{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
pre.state{font-family:var(--mono);font-size:11.5px;white-space:pre;overflow-x:auto;background:var(--surface-2);padding:12px;border-radius:4px;border:1px solid var(--rule)}
.hint{font-size:12px;color:var(--ink-faint);margin-top:6px}
.cover{display:block;border:1px solid var(--rule);border-radius:3px;background:var(--surface-2)}
.cover.lg{width:110px}
.cover.sm{width:52px}
.cover{cursor:zoom-in}
/* Capa ampliada: clique em qualquer capa abre a imagem inteira; clique ou Esc fecha. */
.zoom{position:fixed;inset:0;z-index:80;display:flex;align-items:center;justify-content:center;
      padding:16px;background:rgba(10,14,12,.86);cursor:zoom-out}
.zoom[hidden]{display:none}
.zoom img{max-width:100%;max-height:100%;object-fit:contain;border-radius:3px;box-shadow:0 8px 40px rgba(0,0,0,.5)}
/* Capa nas listas: sempre com brilho e cor normais. Decisão do Mathews,
   2026-09-24: sem esmaecimento nem selo para edição ainda não confirmada;
   esse status aparece só na página da obra. */
.nothumb{width:52px;height:72px;border:1px dashed var(--rule-2);border-radius:3px;
         display:inline-block}
.pubhead{display:flex;gap:16px;align-items:flex-start;margin-bottom:4px}
.pubhead .t{min-width:0;flex:1}
.nocover{width:110px;height:150px;border:1px dashed var(--rule-2);border-radius:3px;
  display:grid;place-items:center;text-align:center;font-size:10.5px;color:var(--ink-faint);
  font-family:var(--mono);padding:8px;line-height:1.4}
.acq{border:1px solid var(--rule);border-radius:5px;background:var(--surface);overflow:hidden;margin:12px 0}
.acq .a{padding:11px 14px;border-bottom:1px solid var(--rule)}
.acq .a:last-child{border-bottom:0}
.acq .a.no{opacity:.62}
/* --- barra de contexto: voltar + trilha --------------------------------- */
.ctx{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 16px;
     padding-bottom:10px;border-bottom:1px solid var(--rule)}
.ctx .back{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--rule-2);
     background:var(--surface);color:var(--ink);font:inherit;font-size:12.5px;
     padding:5px 10px;border-radius:4px;cursor:pointer;white-space:nowrap}
.ctx .back:hover{background:var(--surface-2)}
.ctx .crumb{font-size:12.5px;color:var(--ink-faint);min-width:0;display:flex;
     gap:6px;flex-wrap:wrap;align-items:center}
.ctx .crumb a{color:var(--ink-soft)}
.ctx .crumb .sep{color:var(--rule-2)}
.ctx .here{color:var(--ink);font-weight:500}

/* --- volume partilhado: os dois sentidos -------------------------------- */
.vol{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;padding:6px 15px 6px 12px;
     background:var(--accent-soft);color:var(--accent-ink);font-size:12px;
     border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);
     box-shadow:inset 3px 0 0 var(--accent)}
.vol .vi{font-family:var(--mono);font-size:11px;letter-spacing:.04em}
.row.involume{box-shadow:inset 3px 0 0 var(--accent)}
.b.volb{background:var(--accent-soft);color:var(--accent-ink)}

/* --- responsividade das linhas ------------------------------------------ */
@media(max-width:620px){
  /* Colunas EXPLÍCITAS: com auto-posicionamento, uma linha sem número punha o
     título na coluna estreita e ele quebrava uma palavra por linha. */
  .row{grid-template-columns:auto minmax(0,1fr);row-gap:7px;align-items:start;column-gap:9px}
  .row>div:empty{display:none}
  .row .n{grid-column:1;text-align:left}
  .row .t{grid-column:2}
  .row .meta{grid-column:1/-1;justify-content:flex-start}
  .pubhead{flex-wrap:wrap}
  .stats{grid-template-columns:repeat(auto-fit,minmax(94px,1fr))}
  h1{font-size:1.4rem;line-height:1.2}
  .filters>*{flex:1 1 auto}
}
@media(max-width:760px){
  .shell{grid-template-columns:1fr}
  .side{position:static;height:auto;border-right:0;border-bottom:1px solid var(--rule)}
  .side nav{display:flex;flex-wrap:wrap;gap:2px;padding:0 10px}
  .side nav a{padding:5px 9px;border-radius:4px}
  .sect{display:none}
  main{padding:16px 14px 60px}
  .kv{grid-template-columns:1fr;gap:2px 0}
  .kv dd{margin-bottom:8px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* =======================================================================
   BIBLIOTHECA — camada "produto"
   O que estava faltando não era paleta: era componente e superfície.
   Cartões com elevação e respiro, controles em pílula, selos preenchidos,
   ícones na navegação, ritmo de 4/8px.

   Paleta: grafite (acento #5B8DEF), escolhida pelo Mathews em 2026-09-13.
   Os neutros vêm do tema (escuro/claro).
   ==================================================================== */

/* --- neutros: escuro é o padrão -------------------------------------- */
:root{
  --ground:#0C0E12; --surface:#13161C; --surface-2:#191D25; --surface-3:#222732;
  --ink:#E8EBF0; --ink-soft:#9BA3B2; --ink-faint:#6B7484;
  --rule:#1F242E; --rule-2:#2C3341;
  --shadow:0 1px 2px rgba(0,0,0,.30), 0 8px 24px rgba(0,0,0,.28);
  --shadow-lift:0 2px 4px rgba(0,0,0,.32), 0 16px 40px rgba(0,0,0,.38);
  --flag:#E0A458; --flag-soft:rgba(224,164,88,.14);
  --ok:#5FCB92;   --ok-soft:rgba(95,203,146,.14);
  --warn:#E3C567; --warn-soft:rgba(227,197,103,.14);
  --serif:"EB Garamond",Georgia,"Times New Roman",serif;
  --sans:ui-sans-serif,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace;
  --r:14px; --r-sm:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ground:#0C0E12}}
:root[data-theme="light"]{
  --ground:#F7F8FA; --surface:#FFFFFF; --surface-2:#F2F4F7; --surface-3:#E7EAF0;
  --ink:#15181E; --ink-soft:#525A68; --ink-faint:#818A99;
  --rule:#E6E9EF; --rule-2:#D2D7E0;
  --shadow:0 1px 2px rgba(16,24,40,.05), 0 8px 24px rgba(16,24,40,.06);
  --shadow-lift:0 2px 4px rgba(16,24,40,.06), 0 16px 40px rgba(16,24,40,.10);
  --flag:#B26B14; --flag-soft:rgba(178,107,20,.10);
  --ok:#1F7A4C; --ok-soft:rgba(31,122,76,.10);
  --warn:#8A6D12; --warn-soft:rgba(138,109,18,.10);
}

/* --- paletas: só o acento muda --------------------------------------- */
:root{ --accent:#5B8DEF; --accent-ink:#8AAEF6; --accent-soft:rgba(91,141,239,.15); --glow:rgba(91,141,239,.16); }
  --lit:#B79BE0; --lit-soft:rgba(183,155,224,.16);

/* --- o chão ----------------------------------------------------------- */
body{
  font-family:var(--sans); font-size:14.5px; line-height:1.6;
  background:
    radial-gradient(900px 500px at 18% -10%, var(--glow), transparent 60%),
    radial-gradient(700px 420px at 92% -6%, var(--glow), transparent 55%),
    var(--ground);
  background-attachment:fixed;
}
body::before{
  content:"";position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.028;
  mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>");
}
.shell{position:relative;z-index:1;grid-template-columns:246px 1fr}
main{padding:30px 40px 120px;max-width:1140px}

/* --- tipografia: serifa no display, sans no produto ------------------- */
h1,h2,h3{font-family:var(--serif);letter-spacing:-.018em}
h1{font-size:clamp(2rem,1.2rem + 2.4vw,2.7rem);line-height:1.08;font-weight:700}
h2{font-size:1.45rem;margin:44px 0 14px;font-weight:600}
h3{font-size:1.12rem;font-weight:600}
.ph .sub,.ph + p.muted{font-size:1rem;color:var(--ink-soft);max-width:62ch}
.ph .eyebrow{font-family:var(--sans);font-size:11px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--accent-ink);font-weight:600}
.row .t>a{font-family:var(--serif);font-size:1.12rem;line-height:1.3;color:var(--ink);font-weight:600}
.row .au{font-size:12.5px;color:var(--ink-faint)}
.by,.lock{font-family:var(--sans);font-size:11px;letter-spacing:.06em;
  text-transform:uppercase;color:var(--ink-faint)}

/* --- barra lateral ---------------------------------------------------- */
.side{background:var(--surface);border-right:1px solid var(--rule);padding:18px 0}
.brand{font-family:var(--serif);font-size:1.32rem;padding:0 18px 18px}
.brand span{color:var(--accent-ink)}
.sect{font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--ink-faint);padding:20px 20px 8px;font-family:var(--sans);font-weight:600}
.side nav a{display:flex;align-items:center;gap:11px;margin:1px 10px;padding:9px 12px;
  border-radius:var(--r-sm);font-size:13.5px;color:var(--ink-soft);font-weight:500;
  transition:background .13s,color .13s}
.side nav a .ic{flex:0 0 18px;width:18px;height:18px;opacity:.75;stroke-width:1.7}
.side nav a .lb{flex:1;min-width:0}
.side nav a b{font-family:var(--sans);font-size:11px;font-weight:600;color:var(--ink-faint);
  background:var(--surface-2);border-radius:999px;padding:1px 8px}
.side nav a:hover{background:var(--surface-2);color:var(--ink)}
.side nav a.on{background:var(--accent-soft);color:var(--accent-ink);box-shadow:none;font-weight:600}
.side nav a.on .ic{opacity:1}
.side nav a.on b{background:transparent;color:var(--accent-ink)}

/* --- controles: pílulas ---------------------------------------------- */
.topbar{gap:12px;margin-bottom:24px}
#q{border-radius:999px;padding:10px 16px;background:var(--surface);border:1px solid var(--rule-2);
  font-size:13.5px;box-shadow:var(--shadow)}
#q:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.pill-btn{border-radius:999px;padding:9px 15px;font-size:12.5px;font-weight:500;
  background:var(--surface);border:1px solid var(--rule-2);box-shadow:var(--shadow);
  transition:background .13s,border-color .13s,transform .13s}
.pill-btn:hover{background:var(--surface-2);transform:translateY(-1px)}
.pill-btn.hot{background:var(--accent-soft);border-color:transparent;color:var(--accent-ink);font-weight:600}
select,input[type=date],input[type=text]{border-radius:999px;padding:8px 14px;font-size:12.5px;
  background:var(--surface);border:1px solid var(--rule-2)}
.filters{gap:10px;margin-bottom:18px}

/* --- selos: pílula preenchida ---------------------------------------- */
.b{font-family:var(--sans);font-size:11px;font-weight:600;letter-spacing:.02em;
  border-radius:999px;padding:3px 10px;background:var(--surface-2);color:var(--ink-soft);
  text-transform:none;vertical-align:1px}
.b.ok{background:var(--ok-soft);color:var(--ok)}
.b.warn{background:var(--warn-soft);color:var(--warn)}
.b.flag{background:var(--flag-soft);color:var(--flag)}
.b.acc,.b.volb{background:var(--accent-soft);color:var(--accent-ink)}
.b.lit{background:var(--lit-soft);color:var(--lit);font-weight:600}
.b.lit .q{opacity:.78;font-weight:400}
.b.core{background:var(--accent-soft);color:var(--accent-ink);font-weight:700}

/* --- superfícies: cartão de verdade ---------------------------------- */
.card,.panel,.rows,.acq,.todo a,.tw table{
  background:var(--surface);border:1px solid var(--rule);border-radius:var(--r);
  box-shadow:var(--shadow)}
.card{padding:22px 24px;transition:transform .14s,box-shadow .14s,border-color .14s}
.card:hover{transform:translateY(-2px);box-shadow:var(--shadow-lift);border-color:var(--rule-2)}
.panel{padding:20px 22px}
.panel.prov{border-left:3px solid var(--flag);background:var(--surface)}
.panel.pers{border-left:3px solid var(--accent);background:var(--surface)}
.grid{gap:16px;grid-template-columns:repeat(auto-fill,minmax(292px,1fr))}
.rows{overflow:hidden}
.row{padding:16px 20px;gap:16px;transition:background .13s}
.row:hover{background:var(--surface-2)}
.row:hover .t>a{color:var(--accent-ink)}
.gh{background:var(--surface-2);padding:11px 20px;font-family:var(--sans);font-size:11px;
  font-weight:600;letter-spacing:.09em;color:var(--ink-faint)}

/* estatísticas: cada número é o seu próprio cartão */
.stats{background:none;border:0;border-radius:0;gap:14px;
  grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:26px}
.stats div{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r);
  padding:16px 18px;box-shadow:var(--shadow)}
.stats dt{font-family:var(--sans);font-size:11px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink-faint);font-weight:600}
.stats dd{font-family:var(--serif);font-size:1.85rem;font-weight:600;margin-top:4px;
  font-variant-numeric:lining-nums tabular-nums}

.todo{gap:14px}
.todo a{border-left:0;padding:18px 20px;transition:transform .14s,box-shadow .14s}
.todo a:hover{transform:translateY(-2px);box-shadow:var(--shadow-lift);background:var(--surface)}
.todo b{font-family:var(--serif);font-size:1.7rem;color:var(--accent-ink);
  font-variant-numeric:lining-nums tabular-nums}
.todo span{font-size:12.5px}

/* movimento: faixa com respiro, não cabeçalho de tabela */
.mv{background:var(--surface-2);border:0;border-left:3px solid var(--accent);
  border-radius:var(--r-sm);margin:26px 14px 10px;padding:16px 18px;
  font-family:var(--serif);font-size:1.22rem;font-weight:600;color:var(--ink)}
.mv .pp{font-family:var(--sans);font-size:12.5px;color:var(--ink-soft);max-width:66ch;margin-top:5px}

/* volume partilhado */
.vol{background:var(--accent-soft);border:0;box-shadow:none;border-radius:var(--r-sm);
  margin:10px 14px;padding:10px 16px;color:var(--accent-ink);font-size:12.5px}
.vol .vi{font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:600}
.row.involume{box-shadow:inset 3px 0 0 var(--accent-soft)}

/* trilha e tabelas */
.ctx{border-bottom:0;padding-bottom:0;margin-bottom:20px}
.ctx .back{border-radius:999px;padding:7px 13px;background:var(--surface);
  border:1px solid var(--rule-2);box-shadow:var(--shadow)}
.tw table{overflow:hidden;border-collapse:separate;border-spacing:0}
th{background:var(--surface-2);font-family:var(--sans);font-size:10.5px;letter-spacing:.09em;
  padding:11px 14px;border-bottom:1px solid var(--rule)}
td{padding:12px 14px;border-bottom:1px solid var(--rule)}
.kv dt{font-family:var(--sans);font-size:11px;letter-spacing:.06em;text-transform:uppercase}
hr{border-top:1px solid var(--rule);margin:28px 0}
.dot{background:var(--accent);opacity:.7}
.sug{border-radius:var(--r);box-shadow:var(--shadow-lift);border-color:var(--rule-2)}
.sug a{padding:10px 16px;font-size:13px}

@media(max-width:760px){
  .shell{grid-template-columns:1fr}
  main{padding:18px 16px 80px}
  .side nav a{margin:1px 6px}
  .mv,.vol{margin-left:0;margin-right:0}
}


/* --- volume partilhado: RECIPIENTE, não rótulo -------------------------
   A faixa anterior abria e não fechava, e tinha a mesma forma do cabeçalho
   de movimento — que vale para tudo abaixo. Lia-se como "daqui para baixo".
   Agora as obras do mesmo objeto ficam DENTRO de uma caixa recuada. */
.volgroup{
  margin:14px 14px;
  border:1px solid var(--accent-soft);
  border-left:3px solid var(--accent);
  border-radius:var(--r-sm);
  background:color-mix(in srgb, var(--accent) 5%, var(--surface));
  overflow:hidden;
}
.volgroup .volhead{
  display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;
  padding:10px 16px;
  border-bottom:1px solid var(--accent-soft);
  font-size:12.5px;color:var(--ink-soft);
}
.volgroup .volhead .vi{
  font-family:var(--sans);font-size:10px;font-weight:700;letter-spacing:.1em;
  text-transform:uppercase;color:var(--accent-ink);
  background:var(--accent-soft);border-radius:999px;padding:3px 9px;
}
.volgroup .volhead a{color:var(--accent-ink);font-weight:600}
.volgroup .volfoot{
  padding:7px 16px;border-top:1px solid var(--accent-soft);
  font-size:11px;letter-spacing:.05em;color:var(--ink-faint);
}
.volgroup .row{background:transparent;border-bottom:1px solid var(--accent-soft)}
.volgroup .row:last-of-type{border-bottom:0}
.volgroup .row:hover{background:color-mix(in srgb, var(--accent) 8%, transparent)}
/* a marca antiga por linha some: o recipiente já diz tudo */
.row.involume{box-shadow:none}
@media(max-width:760px){ .volgroup{margin-left:0;margin-right:0} }
/* O card de VOLUMES DE UMA OBRA pende da linha da obra: menor, recuado,
   e sem a barra de acento cheia — não é um agrupamento de obras. */
.volgroup.edgroup{margin:2px 14px 12px 46px;border-left-width:2px}
.volgroup.edgroup .volhead{padding:7px 13px;font-size:11.5px}
.volgroup.edgroup .volhead .vi{font-size:9px;padding:2px 8px}
.volgroup.edgroup .volhead .vt{color:var(--accent-ink);font-weight:600}
.volgroup.edgroup .volfoot{padding:5px 13px;font-size:10px}
@media(max-width:760px){ .volgroup.edgroup{margin-left:0;margin-right:0} }


/* =======================================================================
   Diferenciação movimento × volume.
   Duas regras, sem exceção:
   1) CAIXA = recipiente. Um título nunca é caixa. O movimento vira
      cabeçalho de seção (fio + respiro + tipografia), sem contêiner.
   2) ACENTO = exceção. O movimento é a estrutura normal (11 por coleção)
      e vai para o neutro; o volume partilhado é o caso raro e fica com a
      cor — a mesma hierarquia por exceção já usada nos selos.
   ==================================================================== */

/* --- movimento: cabeçalho, não cartão -------------------------------- */
.mv{
  background:transparent;border:0;border-left:0;border-radius:0;
  box-shadow:none;
  margin:46px 0 2px;padding:24px 20px 14px;
  border-top:1px solid var(--rule-2);
  font-family:var(--serif);font-size:1.58rem;font-weight:600;
  letter-spacing:-.022em;line-height:1.16;color:var(--ink);
}
.rows > .mv:first-child{margin-top:6px;padding-top:18px;border-top:0}
.mv .pp{
  font-family:var(--sans);font-size:12.5px;line-height:1.55;
  color:var(--ink-soft);max-width:68ch;margin-top:7px;
}
.mv .pp .by{color:var(--ink-faint)}

/* --- volume partilhado: o único recipiente aninhado ------------------ */
:root{--on-accent:#0B0E13}
:root[data-theme="light"]{--on-accent:#FFFFFF}

.volgroup{
  margin:18px 18px 18px 46px;
  border:1px solid color-mix(in srgb, var(--accent) 42%, transparent);
  border-left-width:1px;
  border-radius:12px;
  background:color-mix(in srgb, var(--accent) 7%, var(--surface));
  box-shadow:0 1px 2px rgba(0,0,0,.18), 0 10px 26px color-mix(in srgb, var(--accent) 10%, transparent);
  overflow:hidden;
}
.volgroup .volhead{
  padding:11px 18px;
  border-bottom:1px solid color-mix(in srgb, var(--accent) 22%, transparent);
  background:color-mix(in srgb, var(--accent) 6%, transparent);
}
.volgroup .volhead .vi{
  background:var(--accent);color:var(--on-accent);
  font-weight:700;letter-spacing:.09em;
}
.volgroup .volfoot{
  border-top:1px solid color-mix(in srgb, var(--accent) 22%, transparent);
  background:color-mix(in srgb, var(--accent) 6%, transparent);
  color:var(--ink-faint);
}
.volgroup .row{border-bottom-color:color-mix(in srgb, var(--accent) 16%, transparent)}
.volgroup .row .n{color:var(--accent-ink);opacity:.85}

@media(max-width:760px){
  .volgroup{margin:14px 0 14px 14px}
  .mv{margin-top:34px;padding:18px 14px 12px;font-size:1.36rem}
}


/* =======================================================================
   Movimento (card recolhível) × volume partilhado (caixa aninhada).
   A hierarquia vem do NÍVEL e do TAMANHO: o movimento é o contêiner de
   fora, grande e de largura total; o volume vive dentro dele, menor e
   recuado. A cor de acento aparece nos dois, com pesos diferentes.
   ==================================================================== */

/* --- movimento: o elemento dominante --------------------------------- */
.mvcard{
  background:var(--surface);
  border:1px solid var(--rule);
  border-radius:var(--r);
  box-shadow:var(--shadow);
  margin:22px 0;
  overflow:hidden;
}
.mvcard:first-child{margin-top:4px}
.mvhead{
  display:grid;grid-template-columns:auto 1fr auto;align-items:baseline;
  gap:4px 16px;width:100%;text-align:left;
  background:none;border:0;cursor:pointer;font:inherit;color:inherit;
  padding:20px 22px 18px;
}
.mvhead:hover{background:var(--surface-2)}
.mvhead .mvnum{
  font-family:var(--serif);font-size:1.45rem;font-weight:700;
  color:var(--accent-ink);line-height:1;min-width:2.2ch;
}
.mvhead .mvtitle{
  font-family:var(--serif);font-size:1.52rem;font-weight:600;
  letter-spacing:-.022em;line-height:1.18;color:var(--ink);text-wrap:balance;
}
.mvhead .mvmeta{
  display:flex;align-items:center;gap:12px;white-space:nowrap;
  font-size:11px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--ink-faint);font-weight:600;
}
.mvhead .chev{
  display:inline-block;transition:transform .16s;font-size:13px;
  color:var(--ink-faint);
}
.mvcard.closed .mvhead .chev{transform:rotate(-90deg)}
.mvhead .mvpurpose{
  grid-column:2;font-family:var(--sans);font-size:12.5px;line-height:1.55;
  color:var(--ink-soft);max-width:68ch;margin-top:6px;text-transform:none;
  letter-spacing:0;font-weight:400;
}
.mvhead .mvpurpose .by{color:var(--ink-faint)}
.mvbody{border-top:1px solid var(--rule)}
.mvcard.closed .mvbody{display:none}
.mvbody > .row:last-child{border-bottom:0}

/* obras soltas, fora de qualquer movimento */
.rows > .row{border-bottom:1px solid var(--rule)}

/* --- volume partilhado: aninhado e mais quieto ----------------------- */
.volgroup{
  margin:14px 16px 14px 34px;
  border:1px solid color-mix(in srgb, var(--accent) 34%, transparent);
  border-radius:10px;
  background:color-mix(in srgb, var(--accent) 5%, transparent);
  box-shadow:none;
  overflow:hidden;
}
.volhead{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;width:100%;
  padding:9px 14px;cursor:pointer;
  background:none;border:0;font:inherit;color:var(--ink-soft);text-align:left;
  font-size:12.5px;
}
.volhead:hover{background:color-mix(in srgb, var(--accent) 7%, transparent)}
.volhead .vi{
  font-family:var(--sans);font-size:10px;font-weight:700;letter-spacing:.09em;
  text-transform:uppercase;color:var(--accent-ink);
  background:none;border:1px solid color-mix(in srgb, var(--accent) 45%, transparent);
  border-radius:999px;padding:2px 9px;
}
.volhead a{color:var(--accent-ink);font-weight:600}
.volhead .vr{
  font-family:var(--sans);font-size:11px;letter-spacing:.06em;color:var(--ink-faint);
}
.volhead .chev{margin-left:auto;font-size:12px;color:var(--ink-faint);
  transition:transform .16s}
.volgroup.closed .volhead .chev{transform:rotate(-90deg)}
.volgroup.closed .volbody,.volgroup.closed .volfoot{display:none}
.volbody{border-top:1px solid color-mix(in srgb, var(--accent) 20%, transparent)}
.volgroup .row{background:transparent;
  border-bottom:1px solid color-mix(in srgb, var(--accent) 15%, transparent)}
.volgroup .row:last-child{border-bottom:0}
.volgroup .row:hover{background:color-mix(in srgb, var(--accent) 7%, transparent)}
.volgroup .row .n{color:var(--accent-ink);opacity:.8}
.volfoot{
  padding:6px 14px;border-top:1px solid color-mix(in srgb, var(--accent) 20%, transparent);
  font-size:10.5px;letter-spacing:.06em;color:var(--ink-faint);
}

@media(max-width:760px){
  .volgroup{margin:12px 0 12px 10px}
  .mvhead{padding:16px 14px 14px;gap:4px 10px}
  .mvhead .mvtitle{font-size:1.28rem}
  .mvhead .mvmeta{font-size:10px;gap:8px}
}

/* ====================================================================
   BIBLIOTHECA — camada "suave" (protótipo, 2026-09-24)
   Referência: Soft UI Dashboard — adaptada. Mantém do Mathews: fundo
   escuro com degradê azul e ruído, acento azul, serifa nos títulos.
   Traz da referência: cantos 16px, sombras difusas sem bordas duras,
   ícone em quadradinho no menu, cartões de número com ícone em círculo,
   um cartão destacado em degradê, barras de progresso num cartão.
   ==================================================================== */
:root{
  --r:16px; --r-sm:12px;
  --grad:linear-gradient(310deg,#002D65 0%,#12509b 100%);
  --grad-bar:linear-gradient(90deg,#12509b,#1b6cd0);
  --accent:#1b6cd0; --accent-ink:#1b6cd0; --accent-soft:rgba(27,108,208,.16); --glow:rgba(27,108,208,.20);
  --lit:#B79BE0; --lit-soft:rgba(183,155,224,.16);
  --shadow:0 20px 27px 0 rgba(0,0,0,.30);
  --shadow-sm:0 4px 10px -2px rgba(0,0,0,.40);
  --hair:rgba(255,255,255,.045);
  --track:rgba(255,255,255,.08);
}
:root[data-theme="light"]{
  --shadow:0 20px 27px 0 rgba(16,24,40,.06);
  --shadow-sm:0 4px 10px -2px rgba(16,24,40,.10);
  --hair:rgba(16,24,40,.06);
  --track:#E9ECF2;
}
/* superfícies: sem borda dura, sombra difusa */
.card,.panel,.rows,.acq,.todo a,.tw table,.stats div{border-color:var(--hair)!important;box-shadow:var(--shadow)}

/* --- menu lateral: cartão que "salta" + ícone em quadradinho --------- */
.side{background:transparent;border-right:0;padding:22px 14px}
.brand{padding:4px 10px 20px;margin-bottom:6px;border-bottom:1px solid var(--hair)}
.sect{padding:18px 10px 8px}
.side nav a{margin:2px 0;padding:7px 10px;gap:12px}
.side nav a .ich{flex:0 0 32px;width:32px;height:32px;border-radius:10px;display:grid;place-items:center;
  background:var(--surface);box-shadow:var(--shadow-sm);color:var(--ink-soft)}
.side nav a .ich .ic{width:16px;height:16px;flex:0 0 16px;opacity:1}
.side nav a.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-sm)}
.side nav a.on .ich{background:var(--grad);color:#fff;box-shadow:0 4px 10px -2px rgba(0,45,101,.6)}
.side nav a.on b{background:var(--surface-2);color:var(--ink-soft)}
.navgrp{display:flex;align-items:center;gap:2px}
.navgrp>a{flex:1;min-width:0}
.navx{flex:0 0 28px;height:28px;border:0;border-radius:8px;background:transparent;color:var(--ink-faint);
  cursor:pointer;display:grid;place-items:center;padding:0}
.navx:hover{background:var(--surface-2);color:var(--ink)}
.navx svg{width:14px;height:14px;transition:transform .15s}
.navgrp.open .navx svg{transform:rotate(90deg)}
.navsub{margin:2px 0 6px 26px;padding-left:12px;border-left:1px solid var(--rule-2)}
.navsub a{padding:5px 10px!important;font-size:12.5px!important;font-weight:450!important}
.navsub a .lb{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.navsub a.on{box-shadow:none!important;background:var(--accent-soft)!important;color:var(--accent-ink)!important}

/* --- Visão geral ------------------------------------------------------ */
.homegrid{display:grid;grid-template-columns:minmax(0,1.9fr) minmax(0,1fr);gap:22px;align-items:stretch;margin:6px 0 22px}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.kpi{position:relative;display:flex;flex-direction:column;justify-content:space-between;gap:26px;
  min-height:150px;padding:20px;border-radius:var(--r);background:var(--surface);
  border:1px solid var(--hair);box-shadow:var(--shadow);color:var(--ink);text-decoration:none}
a.kpi:hover{text-decoration:none;transform:translateY(-2px);transition:transform .14s}
.kpi .ico{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;
  background:var(--grad);color:#fff;box-shadow:0 4px 10px -2px rgba(0,45,101,.55)}
.kpi .ico svg{width:19px;height:19px}
.kpi .v{font-family:var(--serif);font-size:2rem;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.kpi .l{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-top:6px;
  font-size:13px;color:var(--ink-soft)}
.kpi .l small{font-size:11.5px;font-weight:600;color:var(--ink-faint);white-space:nowrap}
.kpi.hero{background:var(--grad);border-color:transparent;color:#fff;box-shadow:0 20px 27px -6px rgba(0,45,101,.55)}
.kpi.hero .ico{background:#fff;color:#12509b;box-shadow:none}
.kpi.hero .l,.kpi.hero .l small{color:rgba(255,255,255,.88)}
.pcard{padding:22px 24px;border-radius:var(--r);background:var(--surface);border:1px solid var(--hair);box-shadow:var(--shadow);
  display:flex;flex-direction:column}
.pcard h3{margin:0 0 4px}
.pcard .hint{font-size:12px;color:var(--ink-faint);margin:0 0 14px}
.pbar{display:block;padding:9px 0;color:var(--ink);text-decoration:none}
.pbar:hover{text-decoration:none}
.pbar:hover .pl span:first-child{color:var(--accent-ink)}

    <nav id="nav"></nav>
  </aside>
  <main>
    <div class="topbar">
      <div class="searchwrap">
        <input id="q" type="search" placeholder="Buscar obra, autor, coleção, publicação…"
               autocomplete="off" aria-label="Buscar no acervo">
        <div class="sug" id="sug" hidden></div>
      </div>
      <button class="pill-btn" id="themebtn" title="Alternar tema claro/escuro">◐ Tema</button>
      <button class="pill-btn" id="savestatus" title="Estado pessoal — o único que é seu"></button>
    </div>
    <div id="view"></div>
  </main>
</div>
<nav class="tabbar" id="tabbar" aria-label="Navegação principal"></nav>

<script>
const D = /*__DATA__*/null;
const PENDING = {works:{}, publications:{}};
const $ = (s,r)=> (r||document).querySelector(s);
const el = (h)=>{const t=document.createElement('template');t.innerHTML=h.trim();return t.content.firstChild;};
const E = (s)=> String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- helpers ---------------------------------------------------- */
const W = id => D.works[id];
const C = id => D.collections[id];
const P = id => D.publications[id];
const A = id => D.authors[id];
/* O título na tela é o da EDIÇÃO que a biblioteca tem, na língua em que a tem:
   português se houver, senão o inglês registrado, senão o original. O título
   original NUNCA é sacrificado para isso — ele tem campo próprio, e aparece em
   `Identidade` na página da obra. Decisão do Mathews, 2026-09-23. */
const wTitle = id => {const w=W(id)||{};
  return w.title_pt || w.title_en || w.title_original || id;};
const wAuthors = id => ((W(id)||{}).authors||[]).map(a=>(A(a)||{}).name_display||a).join(', ');
const lk = (h,t,c)=> `<a href="#/${h}"${c?` class="${c}"`:''}>${E(t)}</a>`;
const wLink = id => W(id) ? lk('obra/'+id, wTitle(id)) : `<span class="unk">${E(id)} (sem registro)</span>`;
const unk = (t)=> `<span class="unk">${E(t||'não pesquisado')}</span>`;
/* Nomes de campo em português corrente. A interface é para ler, não para
   espelhar o esquema: `scope_map` não diz nada a quem não escreveu o esquema.
   Correção pedida por ele em 2026-09-20. */
const FIELD_PT = {
  order_changes_implied:'as mudanças de ordem que isto implica',
  alternative_rejected:'a alternativa que descartei, e por quê',
  note:'o que muda e o que não muda',
  extracted_from:'de onde isto foi extraído', raised_context:'o que deu origem a isto',
  question:'a pergunta da coleção', inclusion_criteria:'os critérios do que entra',
  scope_map:'o mapa de assuntos cobertos', role:'o papel de cada obra',
  demand:'o quanto cada obra exige do leitor', paths:'os caminhos de leitura',
  tensions:'as tensões apontadas', sequence:'a ordem das obras',
  perspective:'a perspectiva de cada obra', subjects_stated:'os temas de cada obra',
  why_here:'a justificativa de cada obra', 'movement.titles':'os títulos dos movimentos',
  'movement.purpose':'a descrição de cada movimento',
  'movement.grouping':'o agrupamento dos movimentos'
};
function humanFields(a){
  if(!a || !a.length) return '';
  const xs = a.map(x=>FIELD_PT[x]||x);
  return xs.length<2 ? xs[0] : xs.slice(0,-1).join(', ')+' e '+xs[xs.length-1];
}
const codes = (a)=> (a||[]).map(x=>`<code>${E(x)}</code>`).join(' ');
const val = (v,t)=> (v===null||v===undefined||v===''||(Array.isArray(v)&&!v.length)) ? unk(t) : E(Array.isArray(v)?v.join(', '):v);

const RS = {
  not_researched:['Não pesquisado','warn'], in_progress:['Em pesquisa','warn'],
  partially_researched:['Parcial','warn'], fully_researched:['Pesquisado','ok'],
  needs_review:['Rever','flag']
};
const rsBadge = w => {const r=RS[w.research_status]||['Não pesquisado','warn'];
  return `<span class="b ${r[1]}">${r[0]}</span>`;};
/* Versão de LISTA: silencia a norma. `not_researched` é o estado de 125 das
   146 obras — selá-las todas é ruído, não informação. O estado global está na
   Visão geral e o do registro está na página da obra. */
const rsMark = w => true
  ? '' : `<span class="b ${(RS[w.research_status]||['','warn'])[1]}">${(RS[w.research_status]||['?'])[0]}</span>`;
const edMark = w => false
  ? `<span class="glyph" title="${(w.publications||[]).length} edição(ões) registrada(s)">▣ ${(w.publications||[]).length}</span>` : '';

/* o nome do "balde" de estado vem do config (targets.<kind>.key),
   nunca de uma suposição codificada aqui */
const BUCKET = k => ((((D.config||{}).targets||{})[k]||{}).key) || (k.endsWith('s')?k:k+'s');
const readState = (kind,id,f)=>{
  const b = BUCKET(kind);
  const p = (PENDING[b]||{})[id]||{}; if(f in p) return p[f];
  const s = ((D.state||{})[b]||{})[id]||{}; return s[f];
};
const pendCount = ()=> Object.values(PENDING).reduce((n,o)=>n+Object.keys(o).length,0);
function setState(kind,id,f,v){
  const b = BUCKET(kind);
  PENDING[b] = PENDING[b]||{};
  PENDING[b][id] = PENDING[b][id]||{};
  PENDING[b][id][f] = (v===''?null:v);
  updateSaveUI();
}

/* ---------- gravação ---------------------------------------------------
   Um único indicador, sempre visível, com dois estados. Esconder o aviso
   quando está limpo torna o sinal ambíguo — e é justamente esse sinal que
   diz se o seu trabalho está em disco.                                    */
let DIRH = null, LASTSAVED = null;
function updateSaveUI(){
  const btn=$('#savestatus'); if(!btn) return;
  const n=pendCount();
  if(n){
    btn.className='pill-btn hot';
    btn.textContent='● '+n+' por gravar';
    btn.title='Alterações de estado pessoal ainda NÃO gravadas em state/personal.yaml';
  }else{
    btn.className='pill-btn';
    btn.textContent = LASTSAVED ? '✓ gravado '+LASTSAVED : '✓ sem alterações';
    btn.title='Nada por gravar. O que está na interface está em state/personal.yaml';
  }
  btn.onclick=()=>{location.hash='#/estado';};
}
window.addEventListener('beforeunload', e=>{
  if(pendCount()){ e.preventDefault(); e.returnValue=''; }
});

/* ---------- writable fields (do config, nunca codificados) -------------- */
function fieldControl(target, kind, id, f){
  const cur = readState(kind,id,f.name);
  const lab = `<label style="display:block"><span class="lock">${E(f.label_pt||f.name)}</span><br>`;
  if(f.type==='enum'){
    const opts = ['<option value="">—</option>'].concat((f.values||[]).map(v=>
      `<option value="${E(v)}"${cur===v?' selected':''}>${E(VAL_PT[v]||v)}</option>`)).join('');
    return lab+`<select data-k="${kind}" data-i="${E(id)}" data-f="${E(f.name)}">${opts}</select></label>`;
  }
  const t = f.type==='date'?'date':'text';
  return lab+`<input type="${t}" data-k="${kind}" data-i="${E(id)}" data-f="${E(f.name)}" value="${E(cur||'')}"></label>`;
}
function personalPanel(kind,id){
  const tg = ((D.config||{}).targets||{})[kind];
  if(!tg) return '';
  const fs = (tg.fields||[]).map(f=>`<div>${fieldControl(tg,kind,id,f)}</div>`).join('');
  return `<div class="panel pers"><h3>${kind==='work'?'Sua leitura':'Seu exemplar'}</h3>
    <div style="display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))">${fs}</div></div>`;
}
document.addEventListener('change', e=>{
  const t=e.target; if(!t.dataset||!t.dataset.f) return;
  setState(t.dataset.k, t.dataset.i, t.dataset.f, t.value);
});

/* ---------- views ------------------------------------------------------ */
/* Cartão de coleção — o mesmo na Visão geral e na tela Coleções. */
const pct = (a,b)=> b? Math.round(100*a/b) : 0;
const withEd = k => (k.sequence||[]).filter(s=>s.kind==='work'||s.work).filter(s=>{
    const w=W(s.work); if(!w) return false;
    const m=(w.memberships||[]).find(m=>m.collection===k.id); return m && m.display_edition;}).length;
const fan = k => {
  const imgs=[];
    for(const s of (k.sequence||[])){ if(imgs.length>=3) break; const w=W(s.work); if(!w) continue;
    const m=(w.memberships||[]).find(m=>m.collection===k.id); const de=m&&m.display_edition; if(!de) continue;
    const p=P(de.publication); const cv=p&&p.cover; const src=cv&&(cv.data_uri||cv.relative_path); if(src) imgs.push(`<img src="${src}" alt="" loading="lazy">`); }
    return imgs.length ? `<span class="fan" aria-hidden="true">${imgs.join('')}</span>` : `<span class="fan icon" aria-hidden="true">${icon('#/colecoes')}</span>`;
  };
function collCard(k){
  const t=k.title_pt||k.id, we=withEd(k), mv=(k.sequence||[]).filter(s=>s.kind==='movement').length;
    const bg = k.image && k.image.data_uri;
    const covers = !bg ? (k.sequence||[]).map(s=>{const w=W(s.work);const m=w&&(w.memberships||[]).find(m=>m.collection===k.id);
        const p=m&&m.display_edition&&P(m.display_edition.publication);const cv=p&&p.cover;return cv&&(cv.data_uri||cv.relative_path);}).filter(Boolean) : [];
    const cls = bg ? ' ccard--img' : (covers.length ? ' ccard--mosaic' : '');
    const back = bg ? `<div class="cbg" style="background-image:url('${bg}')"></div><div class="cshade"></div>`
      : covers.length ? `<div class="cmos">${covers.concat(covers).slice(0,18).map(s=>`<img src="${s}" alt="">`).join('')}</div><div class="cshade"></div>` : '';
    return `<div class="ccard${cls}">${back}
      <div class="top">${(bg||covers.length)?'':fan(k)}
        <div><h3><a href="#/colecao/${encodeURIComponent(k.id)}">${E(t).replace(/\//g,'/<wbr>')}</a></h3></div></div>
      <p class="q">${E(k.question||'')}</p>
      <div class="foot">
      <a class="pbar" href="#/colecao/${encodeURIComponent(k.id)}" style="padding:4px 0 0">
        <span class="pl"><span>Com edição</span><span>${we} de ${k.member_count}</span></span>
        <span class="pt"><i style="width:${pct(we,k.member_count)}%"></i></span></a>
      <div class="meta"><span><b>${k.member_count}</b> obras</span><span><b>${mv}</b> movimentos</span>
        ${(k.paths||[]).length?`<span><b>${k.paths.length}</b> caminho(s)</span>`:''}</div></div>
    </div>`;
}
function vHome(){
  const c=D.counts, prov=D.gaps.filter(g=>g.provisional).length;
  const colls = Object.values(D.collections);
  const noEd = c.works - c.works_with_publication;
  const noRes = c.works - c.works_researched_any;
  const nAut = Object.values(D.authors).filter(a=>(a.works||[]).length).length;
  const tenho = Object.values((D.state||{}).publications||{}).filter(s=>s&&s.ownership==='tenho').length;
  const lidas = Object.values((D.state||{}).works||{}).filter(s=>s&&s.reading_status==='lido').length;
  const pct = (a,b)=> b? Math.round(100*a/b) : 0;
  const ico = href => `<span class="ico">${icon(href)}</span>`;
  const kpi = (href,v,label,small,hero,click)=>`<a class="kpi${hero?' hero':''}" href="${href}"${click?` onclick="${click}"`:''}>
      ${ico(href)}<div><div class="v">${v}</div><div class="l"><span>${label}</span>${small?`<small>${small}</small>`:''}</div></div></a>`;
  const bar = (label,a,b,href,click)=>`<a class="pbar" href="${href}"${click?` onclick="${click}"`:''}>
      <span class="pl"><span>${label}</span><span>${a} de ${b}</span></span>
      <span class="pt"><i style="width:${pct(a,b)}%"></i></span></a>`;
  const initials = t => (t||'').replace(/^(A|O|As|Os)\s+/,'').split(/\s+/).filter(x=>x.length>2)[0]?.[0] || (t||'?')[0];
  return `<div class="ph"><div class="eyebrow">Acervo</div><h1>Bibliotheca</h1>
  </div>
  <div class="homegrid">
    <div class="kpis">
      ${kpi('#/catalogo',c.works,'Obras',`${c.works_with_publication} com edição`,true)}
      ${kpi('#/colecoes',c.collections,'Coleções','')}
      ${kpi('#/publicacoes',c.publications,'Publicações',`${c.covers||0} com capa`)}
      ${kpi('#/autores',nAut,'Autores',c.translators?`+${c.translators} tradutores`:'')}
      ${kpi('#/leitura',tenho,'Na sua estante',`${lidas} lidas`)}
      ${kpi('#/revisao',(D.decisions||[]).filter(d=>d.state==='decidir').length,'Decisões',`${(D.decisions||[]).filter(d=>d.state==='aguardando').length} aguardando`)}
    </div>
    <div class="pcard">
      <h3>O que está por fazer</h3>
      ${bar('Obras com edição identificada',c.works_with_publication,c.works,'#/catalogo',"goCat({ed:'sem'})")}
      ${bar('Publicações com capa',c.covers||0,c.publications,'#/publicacoes','')}
      <div class="more">
        <a class="chip" href="#/revisao"><b>${(D.decisions||[]).filter(d=>d.state==='decidir').length}</b> decisões</a>
        <a class="chip" href="#/catalogo" onclick="goCat({coll:'__none'})"><b>${c.pending_assignment}</b> sem coleção</a>
      </div>
    </div>
  </div>
  <h2>Coleções</h2>
  <div class="cgrid">${colls.map(collCard).join('')}</div>`;
}

/* Pontos de entrada. Uma lista alfabética de 146 títulos é uma lista
   telefônica: não tem forma reconhecível. Agrupar dá relevo sem mudar o que
   está lá — e os grupos saem todos de dados que já existem. */
function groupKeys(w, mode){
  if(mode==='autor')   return (w.authors||[]).map(a=>(A(a)||{}).name_display||a);
  if(mode==='colecao') return (w.memberships||[]).map(m=>m.collection_title||m.collection);
  if(mode==='editora') return [...new Set((w.publications||[]).map(p=>p.publisher).filter(Boolean))];
  if(mode==='tradutor'){
    const t=new Set();
    (w.publications||[]).forEach(x=>{const full=P(x.publication)||{};
      (full.contains||[]).filter(c=>c.work===w.id).forEach(c=>
        (c.translator||[]).forEach(id=>t.add((A(id)||{}).name_display||id)));});
    return [...t];
  }
  return [(w.title_pt||w.id||'?').charAt(0).toUpperCase()];
}
const GEMPTY={autor:'Autoria por confirmar',colecao:'Sem coleção',
              editora:'Sem edição registrada',tradutor:'Sem tradutor registrado'};
function grouped(list, mode){
  const g={};
  list.forEach(w=>{
    let ks=groupKeys(w,mode); if(!ks.length) ks=[GEMPTY[mode]||'—'];
    ks.forEach(k=>{(g[k]=g[k]||[]).push(w);});
  });
  const keys=Object.keys(g).sort((a,b)=>a.localeCompare(b,'pt'));
  return '<div class="rows">'+keys.map(k=>
    `<div class="gh"><span>${E(k)}</span><span>${g[k].length}</span></div>`+
    g[k].map(w=>rowWork(w)).join('')).join('')+'</div>';
}

function vCatalogo(){
  const f = state.cat||{};
  const all = Object.values(D.works);
  const colls = Object.values(D.collections);
  let list = all.slice();
  if(f.coll==='__none') list = list.filter(w=>!w.memberships.length);
  else if(f.coll) list = list.filter(w=>w.memberships.some(m=>m.collection===f.coll));
  if(f.rd) list = list.filter(w=>(readState('work',w.id,'reading_status')||'nao-lido')===f.rd);
  if(f.ed==='sem') list = list.filter(w=>!(w.publications||[]).length);
  if(f.ed==='com') list = list.filter(w=>(w.publications||[]).length);
  list.sort((a,b)=> (a.title_pt||'').localeCompare(b.title_pt||'','pt'));
  const opt=(v,l,cur)=>`<option value="${E(v)}"${cur===v?' selected':''}>${E(l)}</option>`;
  return `<h1>Catálogo</h1>
  <p class="muted small">Todas as obras da biblioteca, de todas as coleções.</p>
  <div class="filters">
    <select id="fc">${opt('','Todas as coleções',f.coll)}${opt('__none','Sem coleção',f.coll)}${colls.map(c=>opt(c.id,c.title_pt,f.coll)).join('')}</select>
    <select id="fd">${opt('','Qualquer leitura',f.rd)}${['nao-lido','lendo','lido','relendo','abandonado'].map(k=>opt(k,VAL_PT[k],f.rd)).join('')}</select>
    <select id="fe">${opt('','Com ou sem edição',f.ed)}${opt('com','Com edição',f.ed)}${opt('sem','Sem edição',f.ed)}</select>
    <select id="fg">${opt('','Sem agrupar (A–Z)',f.g)}${opt('autor','Agrupar por autor',f.g)}${opt('colecao','Agrupar por coleção',f.g)}${opt('editora','Agrupar por editora',f.g)}${opt('tradutor','Agrupar por tradutor',f.g)}</select>
    <span class="small muted">${list.length} de ${all.length}</span>
  </div>
  ${list.length? grouped(list, f.g) : '<div class="rows"><div class="row"><div class="unk">Nada corresponde a estes filtros.</div></div></div>'}`;
}
/* Uma obra pode estar repartida por vários volumes de uma MESMA série
   (Oresteia, Hellenica) — isso é um fato sobre a obra. Ter várias edições
   ALTERNATIVAS (Ilíada: caixa Penguin + bilíngue da 34) é outro fato, e a
   interface não os funde. A distinção vem do campo `series` da publicação. */
/* Título de exibição de uma publicação. A palavra "Caixa" no título publicado
   é dado bibliográfico e NÃO é alterada no registro: some só na tela, onde a
   etiqueta Box já diz o que o objeto é. */
function pubTitulo(p){
  const t = p.title_as_published || p.id;
  return (p.packaging==='caixa') ? t.replace(/^\s*(Caixa|Box)\s+/i,'') : t;
}
/* Conjunto de volumes de UMA obra: várias publicações da mesma série. */
function volSet(w){
  const ps=(w.publications||[]).map(x=>P(x.publication)).filter(Boolean);
  if(ps.length<2) return null;
  const ser={}; ps.forEach(p=>{if(p.series) ser[p.series]=(ser[p.series]||0)+1;});
  const hit=Object.entries(ser).find(([,n])=>n>1);
  if(!hit) return null;
  const vols=ps.filter(p=>p.series===hit[0]);
  return {series:hit[0], vols, box:vols.some(p=>p.packaging==='caixa')};
}
/* A etiqueta sobrou só para o caso "várias edições avulsas": um conjunto de
   volumes vira card recolhível (edGroup), igual à caixa e ao mesmo volume. */
function volBadge(w){
  const ps=(w.publications||[]).map(x=>P(x.publication)).filter(Boolean);
  if(ps.length<2 || volSet(w)) return '';
  return `<span class="b">${ps.length} edições</span>`;
}
/* Pastilha de literatura — decisão do Mathews, 2026-09-27.
   Aparece quando a participação tem papel de tratamento literário, isto é,
   quando uma obra literária está colocada junto do argumento que ela encena.
   A segunda parte só aparece se a relação com a obra tratada estiver
   registrada; sem ela a pastilha diz apenas "Literatura". */
function litBadge(w, m){
  if(!m || m.role!=='literary-treatment') return '';
  const rel=(w&&(w.relations||[]).find(r=>r&&r.type==='literary_treatment_of'));
  const alvo=rel&&W(rel.target)?wTitle(rel.target):'';
  return `<span class="b lit" title="Obra literária, colocada junto do argumento que ela encena">Literatura${alvo?` <span class="q">· encena ${E(alvo)}</span>`:''}</span>`;
}
/* Card recolhível dos volumes de uma obra. Mesmo componente visual da caixa e
   do mesmo volume — o que muda é o que está dentro: ali são obras, aqui são
   edições. */
/* Obra + card dos seus volumes formam UM bloco: a linha divisória vem depois
   do card, não entre a obra e ele (senão o card parece da obra de baixo). */
function wrapEd(w, row){
  const eg=edGroup(w);
  return eg ? `<div class="wgrp">${row}${eg}</div>` : row;
}
function edGroup(w){
  const s=volSet(w); if(!s) return '';
  const k='ed|'+w.id;
  if(FOLD.keys && FOLD.keys.vol) FOLD.keys.vol.push(k);
  const aberto=!!FOLD.volOpen[k];
  return `<div class="volgroup edgroup${aberto?'':' closed'}">
    <div class="volhead" onclick="toggleVol('${E(k)}')" role="button" tabindex="0"
         aria-expanded="${aberto}">
      <span class="vi">${s.box?'Box':'Edição em volumes'}</span>
      <span class="vt">${E(s.series)}</span>
      <span class="vr">${s.vols.length} volumes</span>
      <span class="chev">▾</span>
    </div>
    <div class="volbody">${s.vols.map(p=>`<div class="row">
      <div class="n">${coverImg(p,'sm')||'▣'}</div>
      <div class="t">${lk('publicacao/'+p.id, pubTitulo(p))}
        <div class="au">${E(p.publisher||'')}${p.year?' · '+E(p.year):''}</div></div>
      <div class="meta">${p.isbn13?`<code>${E(p.isbn13)}</code>`:''}</div></div>`).join('')}</div>
    <div class="volfoot">${s.box?'fim do box':'fim da edição'}</div></div>`;
}
/* Mapa obra→volume partilhado, dentro de UMA coleção: só conta a publicação
   que carrega mais de um membro desta coleção. */
function volMap(memberIds){
  const m={};
  Object.values(D.publications).forEach(pb=>{
    const inside=(pb.contains||[]).map(c=>c.work).filter(w=>memberIds.has(w));
    if(inside.length>1) inside.forEach(w=>{ if(!m[w]) m[w]={id:pb.id,
      title:pubTitulo(pb), n:inside.length,
      pack:pb.packaging||'volume'}; });
  });
  return m;
}

/* ---------- miniatura da edição de exibição ------------------------------
   DERIVADA na build (display_edition): posse → preferência da coleção →
   veredito `recommended` → publicação única, atenuada. A obra não tem capa; o
   que se mostra é a capa da publicação por onde ela será lida.             */
function thumbWork(w, m){
  const de = (m && m.display_edition) || w.display_edition;
  if(!de) return '<span class="nothumb" title="sem edição decidida"></span>';
  const p = P(de.publication);
  if(!p || !p.cover || !(p.cover.data_uri||p.cover.relative_path))
    return '<span class="nothumb" title="sem capa verificada"></span>';
  const prov = de.state!=='chosen';
  const tit = (prov?'edição em exibição — ':'edição escolhida — ')
            + pubTitulo(p)
            + (de.by_ownership?' (você tem esta)':de.by_collection?' (escolhida para a coleção)':de.by_access?' (a de acesso mais fácil; ainda sem escolha)':'');
  return `<img class="cover sm${prov?' prov':''}" src="${p.cover.data_uri||p.cover.relative_path}"
            alt="Capa de ${E(p.title_as_published||p.id)}" title="${E(tit)}" loading="lazy">`;
}

function rowWork(w, n){
  const ms = w.memberships;
  return wrapEd(w, `<div class="row"><div class="n">${thumbWork(w)}${n?`<div class="small muted" style="margin-top:3px">${n}</div>`:''}</div>
    <div class="t">${lk('obra/'+w.id, wTitle(w.id))}${edMark(w)}
      <div class="au">${E(wAuthors(w.id))||'<span class="unk">autoria por confirmar</span>'}</div></div>
    <div class="meta">${ms.length>1?`<span class="b acc" title="em várias coleções">${ms.length} coleções</span>`:''}
      ${volBadge(w)}
      ${w.pending_assignment?'<span class="b flag">sem coleção</span>':''}

}

function vColecoes(){
  return `<div class="ph"><div class="eyebrow">Acervo</div><h1>Coleções</h1>
  <p class="sub">Uma coleção é um argumento com uma sequência, não uma pasta.</p></div>
  <div class="cgrid">${Object.values(D.collections).map(collCard).join('')}</div>`;
}
function vColecao(id){
  const k = C(id); if(!k) return '<p>Coleção não encontrada.</p>';
  const st = state.coll||{};
  const seq = k.sequence||[];
  const paths = k.paths||[];
  const path = paths.find(p=>p.id===st.path);
  const inPath = path ? new Set(path.works) : null;
  const tens = (k.tensions&&k.tensions.pairs)?k.tensions.pairs:(Array.isArray(k.tensions)?k.tensions:[]);
  const sm = k.scope_map;

  /* ---- corpo da sequência ---------------------------------------------
     Cada movimento é um card recolhível; obras que dividem um mesmo objeto
     físico ficam numa caixa aninhada, também recolhível. */
  let body='';
  if(false){
    FOLD.keys = {mv:[], vol:[]};
    body = `<div class="rows">${(k.original_order||[]).map((wid,i)=>{
      const w=W(wid); return w?rowWork(w,i+1):`<div class="row"><div class="n">${i+1}</div><div class="unk">${E(wid)}</div><div></div></div>`;
    }).join('')}</div>`;
  } else {
    const vmap = volMap(new Set(seq.filter(x=>x.kind!=='movement').map(x=>x.work)));
    const mvKeys=[], volKeys=[];

    /* 1 · cada entrada da sequência vira {vol, n, html} */
    const items = seq.map(s=>{
      if(s.kind==='movement') return {mv:s};
      const w=W(s.work);
      if(!w) return {vol:null, n:s.n, html:`<div class="row"><div class="n">${s.n}</div><div class="unk">${E(s.work)} — sem registro</div><div></div></div>`};
      const dim = inPath && !inPath.has(s.work) ? ' style="opacity:.42"' : '';
      return {vol:vmap[s.work]||null, n:s.n, html:wrapEd(w, `<div class="row"${dim}><div class="n">${thumbWork(w, w.memberships.find(mm=>mm.collection===id))}<div class="small muted" style="margin-top:3px">${s.n}</div></div>
        <div class="t">${lk('obra/'+s.work, wTitle(s.work))}${edMark(w)}
          <div class="au">${E(wAuthors(s.work))}</div>
          ${s.why_here?`<div class="small muted" style="margin-top:4px">${E(s.why_here)}${byMark(s.why_here_by)}</div>`:''}
          ${(s.requires||[]).length?`<div class="small" style="margin-top:3px"><span class="lock">requer</span> ${s.requires.map(r=>wLink(r)).join(', ')}</div>`:''}
          ${s.scope?`<div class="small"><span class="lock">escopo</span> ${E(s.scope)}</div>`:''}</div>
        <div class="meta">${litBadge(w, s)}
          ${s.core?'<span class="b core">★ core</span>':''}
          ${s.demand?`<span class="b" title="exigência de leitura">${E(s.demand)}</span>`:''}
          ${inPath?(inPath.has(s.work)?'<span class="b acc">no caminho</span>':''):''}
          ${volBadge(w)}
          ${rsMark(w)}</div></div>`)};
    });

    /* 2 · agrupa corridas do mesmo volume; devolve HTML e nº de obras */
    function corpo(fatia, mvIdx){
      const out=[]; let i=0, obras=0;
      while(i<fatia.length){
        const v=fatia[i].vol; obras++;
        if(!v){ out.push(fatia[i].html); i++; continue; }
        let j=i; while(j<fatia.length && fatia[j].vol && fatia[j].vol.id===v.id) j++;
        const dentro=j-i; obras+=dentro-1;
        const vk = id+'|'+mvIdx+'|'+v.id+'|'+i;
        volKeys.push(vk);
        const aberto = !!FOLD.volOpen[vk];
        const ns = fatia.slice(i,j).map(x=>x.n).filter(x=>x!=null);
        const faixa = ns.length ? (ns.length>1 ? `nº ${ns[0]}–${ns[ns.length-1]}` : `nº ${ns[0]}`) : '';
        const resto = v.n - dentro;
        out.push(`<div class="volwrap"><div class="volgroup${aberto?'':' closed'}">
          <div class="volhead" onclick="toggleVol('${E(vk)}')" role="button" tabindex="0"
               aria-expanded="${aberto}">
            <span class="vi">${v.pack==='caixa'?'Box':'mesmo volume'}</span>
            <a href="#/publicacao/${E(v.id)}" onclick="event.stopPropagation()">${E(v.title)}</a>
            <span class="vr">${dentro} obra${dentro===1?'':'s'}${faixa?' · '+faixa:''}${resto>0?` · outra${resto===1?'':'s'} ${resto} adiante`:''}</span>
            <span class="chev">▾</span>
          </div>
          <div class="volbody">${fatia.slice(i,j).map(x=>x.html).join('')}</div>
          <div class="volfoot">${v.pack==='caixa'?'fim do box':'fim do volume'}</div></div></div>`);
        i=j;
      }
      return {html:out.join(''), obras};
    }

    /* 3 · cada movimento vira um card */
    const out=[]; let i=0, mvIdx=0;
    /* obras antes do primeiro movimento, se houver */
    let pre=[]; while(i<items.length && !items[i].mv){ pre.push(items[i]); i++; }
    if(pre.length) out.push(`<div class="rows">${corpo(pre,-1).html}</div>`);
    while(i<items.length){
      const s=items[i].mv; i++;
      const fatia=[]; while(i<items.length && !items[i].mv){ fatia.push(items[i]); i++; }
      const mk = id+'|mv|'+mvIdx;
      mvKeys.push(mk);
      const fechado = !!FOLD.mvClosed[mk];
      const m = /^\s*([IVXLCDM]+)\s*[.—-]\s*(.+)$/.exec(s.movement||'');
      const num = m ? m[1] : '';
      const nome = m ? m[2] : (s.movement||'');
      const c = corpo(fatia, mvIdx);
      const ns = fatia.map(x=>x.n).filter(x=>x!=null);
      out.push(`<div class="mvcard${fechado?' closed':''}">
        <button class="mvhead" onclick="toggleMv('${E(mk)}')" aria-expanded="${!fechado}">
          <span class="mvnum">${E(num)}</span>
          <span class="mvtitle">${E(nome)}</span>
          <span class="mvmeta">${c.obras} obra${c.obras===1?'':'s'}${ns.length?` · nº ${ns[0]}–${ns[ns.length-1]}`:''}<span class="chev">▾</span></span>
          ${s.purpose?`<span class="mvpurpose">${E(s.purpose)}${byMark(s.purpose_by)}</span>`:''}
        </button>
        <div class="mvbody">
          ${c.html}
        </div></div>`);
      mvIdx++;
    }
    FOLD.keys = {mv:mvKeys, vol:volKeys};
    body = out.join('');
  }

  return `<div class="ph"><div class="eyebrow">Coleção</div><h1>${E(k.title_pt)}</h1>
  <p class="sub">${E(k.question||'')}</p></div>
  <div class="filters" style="margin-top:4px">
    ${paths.length?`<select onchange="setSub('coll','path',this.value)">
      <option value="">Todas as obras</option>
      ${paths.map(p=>`<option value="${E(p.id)}"${st.path===p.id?' selected':''}>Caminho: ${E(p.title_pt||p.id)}</option>`).join('')}
    </select>`:''}
    <button class="pill-btn" onclick="foldAll(${allOpen()?'false':'true'})">${allOpen()?'⌃ Recolher tudo':'⌄ Expandir tudo'}</button>
  </div>
  ${path?`<div class="panel"><h3>Caminho: ${E(path.title_pt||path.id)}</h3>
    ${path.for?`<p class="small" style="margin:0">${E(path.for)}</p>`:''}</div>`:''}
  ${body}
  ${collExtras(k)}`;
}

const langPt = v => LANG_PT[v] || v;
/* seções de um corpo em markdown já convertido: {título: html} */
function bodySections(html){
  const out = {}; if(!html) return out;
  const parts = html.split(/<h[23][^>]*>/i).slice(1);
  parts.forEach(p=>{ const m=/<\/h[23]>/i.exec(p); if(!m) return;
    out[p.slice(0,m.index).replace(/<[^>]+>/g,'').trim()] = p.slice(m.index+5).trim(); });
  return out;
}
const vazio = h => !h || /^(<p>)?\s*(—|-)?\s*(<\/p>)?$/.test(h.trim());
function buyLink(p, big){
  const a = (p.acquisition||[]).find(x=>x.actionable && x.url);
  if(!a) return '';
  const av = AVAIL_PT[a.availability]||'';
  return `<a class="${big?'buybtn':'buy'}" href="${E(a.url)}" target="_blank" rel="noopener">Comprar${big?' na '+E(a.retailer_name||'loja'):''} ↗</a>${av&&big?` <span class="small muted">${E(av)}</span>`:''}`;
}
function tradutores(p){
  const ts = [...new Set((p.contains||[]).flatMap(c=>c.translator||[]))];
  return ts.map(t=>(A(t)||{}).name_display||t).join(', ');
}

/* ---------- Coleção ------------------------------------------------------ */
function collExtras(k){
  const sm = k.scope_map;

  const sec = bodySections(k.body_html);
  const why = sec['Por que esta ordem'];
  const ACC = {"agricultura": "agricultura", "antigas": "antigas", "antiguidade": "Antiguidade", "arcaica": "arcaica", "arquitetura": "arquitetura", "biblia": "Bíblia", "biblico": "bíblico", "brasileira": "brasileira", "cananeia": "cananeia", "ciencia": "ciência", "classica": "clássica", "comparada": "comparada", "construcao": "construção", "contemporanea": "contemporânea", "crista": "cristã", "critica": "crítica", "educacao": "educação", "egipcia": "egípcia", "epica": "épica", "espetaculo": "espetáculo", "estetica": "estética", "expansao": "expansão", "fenomeno": "fenômeno", "filosofica": "filosófica", "formacao": "formação", "grecia": "Grécia", "hebraica": "hebraica", "hinduismo": "hinduísmo", "historia": "história", "historico": "histórico", "historiografia": "historiografia", "idade": "Idade", "industria": "indústria", "instituicoes": "instituições", "israel": "Israel", "jesus": "Jesus", "judaismo": "judaísmo", "latina": "latina", "localizacao": "localização", "media": "média", "mesopotamica": "mesopotâmica", "metodo": "método", "missao": "missão", "misterio": "mistério", "nao": "não", "novo": "Novo", "pos": "pós", "recepcao": "recepção", "religiao": "religião", "religioes": "religiões", "roma": "Roma", "seculo": "século", "sobrevivencia": "sobrevivência", "tecnica": "técnica", "testamento": "Testamento", "tradicao": "tradição", "tradicoes": "tradições", "xix": "XIX", "xvii": "XVII", "xviii": "XVIII", "iluminismo": "Iluminismo", "renascimento": "Renascimento", "helenismo": "helenismo"};
  const label = id => { const s=(id||'').split('-').map(x=>ACC[x]||x).join(' '); return s.charAt(0).toUpperCase()+s.slice(1); };
  let out = '';

  if(mvs.length || why){
    out += `<h2>Por que esta ordem</h2><div class="panel orderpanel">
      ${mvs.length?`<ol class="steps">${mvs.map(s=>{const m=/^\s*([IVXLCDM]+)\s*[.—-]\s*(.+)$/.exec(s.movement||'');
        return `<li><span class="stn">${E(m?m[1]:'')}</span><div><b>${E(m?m[2]:s.movement)}</b>
          ${s.purpose?`<div class="small muted">${E(s.purpose)}</div>`:''}</div></li>`;}).join('')}</ol>`:''}
      ${why&&!vazio(why)?`<details class="more"><summary>Ler a justificativa completa</summary><div class="prose">${why}</div></details>`:''}
    </div>`;
  }

  if(sm && (sm.regions||[]).length){
    const G = [['covered','Bem coberto','ok'],['thin','Pouco coberto','warn'],['absent','Ainda sem obras','flag']];
    out += `<h2>O que a coleção cobre</h2><div class="scopegrid">${G.map(([c,t,cls])=>{
      const rs = sm.regions.filter(r=>(r.coverage||r.status)===c);
      if(!rs.length) return '';
      return `<div class="panel scopecol"><h3><span class="dotc ${cls}"></span>${t} <span class="muted small">${rs.length}</span></h3>
        <ul class="scopelist">${rs.map(r=>`<li><details><summary>${E(label(r.id))}</summary>
          ${r.note?`<p class="small muted">${E(r.note)}</p>`:''}
          ${(r.held_by||[]).length?`<p class="small">${r.held_by.map(x=>wLink(x)).join(', ')}</p>`:''}</details></li>`).join('')}</ul></div>`;
    }).join('')}</div>`;
  }

  const ic = k.inclusion_criteria;
  if(ic && ((ic.criteria||[]).length || (ic.out_of_scope||[]).length)){
    out += `<h2>O que entra na coleção</h2><div class="panel"><details class="more"><summary>Ver critérios</summary>
      <div class="critgrid">
        ${(ic.criteria||[]).length?`<div><h3>Entra</h3><ul class="small">${ic.criteria.map(c=>`<li>${E(c)}</li>`).join('')}</ul></div>`:''}
        ${(ic.out_of_scope||[]).length?`<div><h3>Fica de fora</h3><ul class="small">${ic.out_of_scope.map(c=>`<li>${E(c)}</li>`).join('')}</ul></div>`:''}
      </div></details></div>`;
  }

  if(tens.length){
    out += `<h2>Tensões</h2><div class="rows">${tens.map(t=>`<div class="row"><div class="n">⇄</div>
      <div class="t">${wLink(t.a)} <span class="muted">⇄</span> ${wLink(t.b)}
      ${t.about?`<div class="small muted">${E(t.about)}</div>`:''}</div><div></div></div>`).join('')}</div>`;
  }

  if(k.provisional && (k.provisional.inferred_by_claude||[]).length){
    out += `<div class="panel prov" style="margin-top:28px"><h3>O que ainda espera a sua confirmação</h3>
      <p class="small" style="margin:0">Propostas minhas, a confirmar: <strong>${humanFields(k.provisional.inferred_by_claude)}</strong>.</p></div>`;
  }
  return out;
}

/* ---------- Por que esta edição -------------------------------------------
   `why` mora em `contains` da publicação: uma ou duas frases, escritas para o
   leitor, dizendo o que faz desta edição a escolha. Só cita outra edição
   quando a escolha aceitou uma concessão. Sem `why`, a interface mostra os
   dados da edição e diz, sem disfarce, que ela não foi comparada. */
function whyOf(pid, wid){
  const p=P(pid); const c=p&&(p.contains||[]).find(c=>c.work===wid);
  return c&&c.why ? c.why : '';
}
function edFacts(p, wid){
  const c=(p.contains||[]).find(c=>c.work===wid)||{}; const w=W(wid)||{};
  const out=[]; const tr=(c.translator||[]).map(t=>(A(t)||{}).name_display||t).join(' e ');
  if(c.translated_from==='direct' && w.original_language) out.push('tradução direta do '+langPt(w.original_language).toLowerCase()+(tr?', de '+tr:''));
  else if(c.translated_from==='direct') out.push('tradução direta'+(tr?', de '+tr:''));
  else if(c.translated_from==='indirect') out.push('tradução indireta'+(tr?', de '+tr:''));
  else if(tr) out.push('tradução de '+tr);
  if(p.bilingual===true) out.push('bilíngue');
  if((c.apparatus||[]).length) out.push('com '+c.apparatus.map(a=>a.replace(/-/g,' ')).join(', '));
  return out.join(' · ');
}
function whyBlock(w){
  const pubs=(w.publications||[]).map(x=>x.publication);
  const de=w.display_edition&&w.display_edition.publication;
  const order=de?[de,...pubs.filter(x=>x!==de)]:pubs;
  const ws=order.map(pid=>({pid, why:whyOf(pid,w.id)})).filter(x=>x.why);
  if(ws.length){
    const many=ws.length>1;
    return `<div class="whyed"><div class="k">${many?'Por que estas edições':'Por que esta edição'}</div>
      ${ws.map(x=>`<p class="w">${many?`<b>${E(pubTitulo(P(x.pid)))}.</b> `:''}${mdi(x.why)}</p>`).join('')}</div>`;
  }
  if(!de) return '';
  const f=edFacts(P(de), w.id);
  return `<div class="whyed"><div class="k">Sobre esta edição</div>
    <p class="small muted">A escolha ainda não foi comparada com outras edições.</p>
    ${f?`<div class="facts">${E(f.charAt(0).toUpperCase()+f.slice(1))}.</div>`:''}</div>`;
}
/* Trecho do corpo a partir do título que começa com `prefix` até o próximo
   título de mesmo nível ou acima — inclui os subtítulos de dentro. */
function bodyFrom(html, prefix){
  if(!html) return '';
  const re=/<h([1-6])[^>]*>([\s\S]*?)<\/h\1>/gi; let m, start=-1, lvl=0, end=html.length;
  while((m=re.exec(html))){
    const t=m[2].replace(/<[^>]+>/g,'').trim();
    if(start<0){ if(t.startsWith(prefix)){ start=re.lastIndex; lvl=+m[1]; } continue; }
    if(+m[1]<=lvl){ end=m.index; break; }
  }
  return start<0 ? '' : html.slice(start,end).trim();
}
function researchBlock(html, prefix, label){
  const h=bodyFrom(html, prefix);
  return h && !vazio(h) ? `<details class="research"><summary>${label}</summary><div class="prose">${h}</div></details>` : '';
}

/* ---------- Obra --------------------------------------------------------- */
function vObra(id){

  const sec = bodySections(w.body_html);
  const fatos = (sec['Fatos']||'').replace(/^<p>\s*(Pesquisa parcial\.|Não pesquisado\.[^<]*)\s*/,'<p>');
  const sobre = [fatos, sec['Síntese'], sec['Avaliações acadêmicas']].filter(h=>h && !vazio(h) && !/^<p>\s*<\/p>$/.test(h));
  const facts = [
    (w.title_original && w.title_original!==wTitle(id)) ? ['Título original', E(w.title_original)] : null,
    w.original_language ? ['Língua original', E(langPt(w.original_language))] : null,
    w.date_written ? ['Data', E(w.date_written)] : null].filter(Boolean);
  const rels = [...(w.relations||[]), ...(w.relations_in||[])];
  return `<h1>${E(wTitle(id))}</h1>
  <p class="muted">${(w.authors||[]).map(a=>lk('autor/'+a,(A(a)||{}).name_display||a)).join(', ')||'Autoria a confirmar'}</p>
  ${facts.length?`<dl class="kv">${facts.map(([k,v])=>`<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl>`:''}
  ${sobre.length?`<h2>Sobre a obra</h2><div class="panel prose">${sobre.join('')}</div>`:''}

  ${w.memberships.length?`<h2>Nas coleções</h2><div class="rows">${w.memberships.map(m=>`<div class="row">
    <div class="n">${m.n}</div>
    <div class="t">${lk('colecao/'+m.collection, m.collection_title)}
      ${m.movement?`<div class="au">${E(m.movement)}</div>`:''}
