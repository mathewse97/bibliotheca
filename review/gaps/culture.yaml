    proposed_collection: culture
    region: cultura-e-tecnica-contemporanea
    note: "As duas já estão registradas no acervo, sem coleção, e os próprios
           registros nomeiam `culture` como candidata condicionada à pergunta
           de escopo — que agora foi respondida. Entrariam como participações
           do mesmo registro canônico, não como compras. NÃO aplicado: incluir
           membro é decisão sua."
  - works: [weber--wissenschaft-als-beruf]
    proposed_collection: culture
    note: "A conferência está órfã desde a importação de Política, esperando
           que Educação e Cultura tivessem critérios declarados. Cultura agora
           tem. Ela fala de desencantamento e neutralidade axiológica na
           universidade moderna — cabe na ala da reflexão, e Educação continua
           sendo a segunda opção, como voz crítica. NÃO aplicado."
  - works: [aristoteles--poietike]
    status: aplicado-em-2026-09-19
    proposed_collection: culture
    movement: "I. O que é a cultura, e o que ela vale"
    region: estetica-filosofica
    note: "A Poética JÁ está no acervo, em Greco-Romana, com publicação
           registrada (Editora 34). É a primeira teoria sistemática da arte do
           Ocidente, e sem ela o movimento I começa em Suassuna como se nada
           houvesse antes. Entraria como participação nova do mesmo registro
           canônico — papel próprio nesta coleção, sem duplicar arquivo e sem
           comprar nada. NÃO aplicado: incluir membro é decisão sua. É o
           caminho mais barato para reduzir o salto que você apontou, e é
           independente de culture--g03: a Poética cobre a antiguidade, não a
           discussão do século XVIII de que Kant é a resposta."

  - works: [damasio--descartes-error, haidt--the-righteous-mind]
    proposed_collection: null
    note: "Continuam sem casa: filosofia da mente e psicologia moral não são
           cobertas por nenhuma das cinco coleções, nem pelo escopo novo de
           Cultura. A decisão permanece sua."

