settled:
  - subject: "História factual do século XX — as duas guerras, o entreguerras,
              a Guerra Fria"
    verdict: fora-de-escopo
    reason: "O acervo tem as consequências (Arendt, 'Origens do
             Totalitarismo'; Koestler, 'O Zero e o Infinito'; Orwell; Schmitt,
             'O Conceito do Político') e não tem os fatos. Mas Cultura e
             Política são coleções de argumento, não de cronologia: uma
             história do século XX pertence a uma coleção de História que não
             existe. Criar coleção é decisão do Mathews, não conclusão minha —
             registrado aqui apenas para que a observação não se perca."
    date: 2026-09-19
