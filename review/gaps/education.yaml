      scope: "Livros II–III e VII"
      role: primary-source
      rationale: "A paideía sendo argumentada, não descrita."
    - work: aristoteles--politika
      scope: "Livros VII–VIII"
      role: primary-source
      rationale: "A formação do cidadão como função da cidade."
    - work: agostinho--de-civitate-dei
      scope: seletivo
      role: complementary
      rationale: "Contexto para A Doutrina Cristã, se E-G1 for aceito."
  effect_if_accepted: "E-G1 muda de severidade: a coleção deixa de ter zero
                       fontes primárias. Sobra a lacuna cristã e medieval, e a
                       proposta fica mais estreita e mais forte."
  recommendation: "Decidir isto antes das lacunas. É mais barato e altera-as."
