# Extração estruturada de review/education.md §3.
#
# EVIDÊNCIA VERIFICÁVEL: cada item de `evidence` guarda a prosa original em
# `claim` e, quando a afirmação é estrutural, um `check` que o build.py
# reexecuta a cada build. Se o check deixar de valer, a lacuna é marcada
# `stale` no índice gerado — a prosa continua visível, para que se veja o que
# era afirmado e o que mudou. Um `check: null` com `checkable: false` é uma
# admissão honesta: a afirmação depende de julgamento e não pode ser
# revalidada por máquina.
#
# `candidates` é OPCIONAL. Uma lacuna pode existir como detecção pura, com
# `candidates: []`. Detectar é automático; propor obras não é.
collection: education
extracted_from: review/education.md
by: claude
date: 2026-09-05

coverage:
  provisional: true
  recheck_after: outras-colecoes-importadas
  note: "Uma obra em Greco-Romana ou Religião pode já ocupar uma destas
         regiões; nesse caso ela não está rasa, falta-lhe uma membership que
         ninguém escreveu ainda. A conclusão 'uma lacuna, cinco sintomas' só
         passa a firme depois da última importação."
  summary: {covered: 2, thin: 5, absent: 6}
  # Atualizado 2026-09-10: `critica-da-escola` passou de absent para covered
  # com a entrada de illich--deschooling-society. Ver review/education.md §7.2.

gaps:
  - id: education--g01
    type: type-monoculture
    necessity: alta
    context: "Agostinho tem tradição editorial sólida em português;
              Quintiliano e Hugo de São Vítor, muito menos. Não altera a
              necessidade de nenhum dos três — entra só em caso de empate."
    status: open
    recheck_after: outras-colecoes-importadas
    provisional: true
    statement: "Das 9 obras, zero são fonte primária. Cinco são história, uma
                é manifesto, duas são estrutura, uma é método. A coleção
                percorre dois mil anos de um ideal educativo sem conter um
                único texto em que esse ideal é exercido."
    evidence:
      - claim: "Nenhuma das 9 obras da coleção é fonte primária."
        check: {type: count_members, collection: education,
                where: {work_type: primary-source}, expect: 0}
      - claim: "As cinco regiões rasas são rasas do mesmo modo: história sem
                fonte. Uma lacuna, cinco sintomas. [PROVISÓRIO]"
        check: {type: region_count, collection: education,
                where: {coverage: thin}, expect: 5}
    candidates:
      - work_title: "Agostinho — A Doutrina Cristã (De Doctrina Christiana)"
        verdict: gap-filler
        argument: "A sua justificativa do item 2 — 'o cristianismo não
                   simplesmente abandona a tradição clássica, mas a incorpora,
                   transforma e dá a ela uma nova finalidade' — É a tese deste
                   livro. O Livro IV é o momento exato em que a retórica
                   clássica é batizada. Nunes narra o processo; Agostinho é o
                   processo."
        placement:
          collection: education
          after: nunes--historia-da-educacao-na-antiguidade-crista
          role: primary-source
          demand: exigente
          priority_library: core
      - work_title: "Quintiliano — Institutio Oratoria"
        verdict: complementary
        argument: "Fonte primária do estágio 1 e excelente, mas volumosa, e o
                   estágio 1 já tem Marrou como guia forte."
      - work_title: "Hugo de São Vítor — Didascalicon"
        verdict: gap-filler
        argument: "O texto medieval sobre a ordem das artes; curto e encaixado
                   no estágio 3. Segundo colocado real, e o melhor candidato
                   se você quiser duas fontes primárias."
      - work_title: "Comênio — Didática Magna"
        verdict: complementary
        argument: "Fonte primária, mas já é o modelo moderno que confronta a
                   tradição, não a tradição."
    raised: 2026-09-05

