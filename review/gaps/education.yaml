    statement: "O estágio 4 da sua cadeia diz 'como mudou no Renascimento e na
                modernidade', mas a modernidade termina no século XVII com
                Nunes e o elo seguinte é Adler, de 1982. Faltam os dois
                séculos em que o ideal clássico foi desmontado e defendido."
    evidence:
      - claim: "Região iluminismo-seculo-xviii: absent."
        check: {type: region, collection: education,
                region: iluminismo-seculo-xviii, expect: {coverage: absent}}
      - claim: "Região seculo-xix: thin desde 2026-09-19 — Weber, 'A Ciência
                como Vocação', entrou na coleção e a sustenta de raspão."
        check: {type: region, collection: education,
                region: seculo-xix, expect: {coverage: thin}}
        note: "A lacuna NÃO se fecha com isso, e por isso continua `open`. A
               conferência de Weber é sobre a universidade de pesquisa já
               consolidada, vista de dentro, e não sobre o século em que o
               ideal de formação liberal foi defendido e desmontado. Ela é
               precisamente a voz que diz que a universidade não pode formar;
               falta a voz que defendeu que ela podia — ver o candidato
               abaixo. O predicado foi atualizado em 2026-09-19 para não
               ficar stale mentindo sobre o estado atual."

    candidates:
      - work_title: "John Henry Newman — A Ideia de uma Universidade"
        verdict: gap-filler
        argument: "A defesa mais forte do ideal de formação liberal escrita
                   depois de ele ter sido posto em causa. Adler argumenta para
                   escolas o que Newman argumentou para a universidade."
        over: "Émile é o outro candidato óbvio, mas é a obra que ROMPE com a
               tradição, não a que a defende — e Rousseau já está na
               biblioteca por Política, o que faz dele um caso de membership."
        placement:
          collection: education
          after: nunes--historia-da-educacao-no-seculo-xvii
          role: foundational
          demand: moderado
          priority_library: secondary
    raised: 2026-09-05

  - id: education--g03
    type: dangling-interlocutor
    necessity: alta
    context: "Há tradução histórica de Dewey em português — conveniente e
              irrelevante para a necessidade."
    status: accepted
    accepted:
      by: voce
      date: 2026-10-05
      work: dewey--democracy-and-education
      note: "Cartão d-edu-dewey, opção A. Entrou no movimento II, entre Ozmon
             e Hirsch — e não 'antes de Adler' por ser o primeiro da fila, como
             o placement abaixo dizia em 2026-09-05, antes de o movimento II
             existir; o efeito é o mesmo, porque o II vem antes do III.
             CORREÇÃO DA PREMISSA: a Paideia é dedicada a Dewey e invoca
             Democracia e Educação. Adler não 'nasce contra' Dewey: reivindica
             o ideal dele e recusa o método progressista. Por isso nenhuma
             tensão Adler × Dewey foi gravada; a relação é responds_to."
      remaining: "Edição Unesp 2026 registrada sem veredito; a tradução de
                  Rangel e Anísio Teixeira não foi comparada."
    recheck_after: outras-colecoes-importadas
    provisional: true
    only_visible_under: escopo-largo
    statement: "A posição de Adler constituiu-se historicamente contra a
                educação progressista. A coleção contém a posição e não contém
                aquilo a que ela responde. tensions: [] é a forma que esse
                vazio toma no arquivo."
    evidence:
      - claim: "adler--the-paideia-proposal presente; região
                educacao-progressista: absent."
        check:
          - {type: member_present, collection: education,
             work: adler--the-paideia-proposal}
          - {type: region, collection: education,
             region: educacao-progressista, expect: {coverage: absent}}
      - claim: "tensions da coleção: 0 pares, contra 8 em political-thought."
        check:
          - {type: count_tensions, collection: education, expect: 0}
          - {type: count_tensions, collection: political-thought, expect: 8}
    candidates:
      - work_title: "John Dewey — Democracia e Educação"
        verdict: gap-filler
        argument: "Exposição sistemática da posição contrária, escrita por quem
                   a formulou."
        placement:
          collection: education
          before: adler--the-paideia-proposal
          role: foundational
          demand: moderado
          priority_library: core
          note: "Antes de Adler, para que Adler se leia como resposta — que é
                 o que é. Depois, Dewey pareceria apêndice crítico e a
                 história ficaria invertida."
      - work_title: "Paulo Freire — Pedagogia do Oprimido"
        verdict: different-region
        argument: "Fecha pedagogia-critica, não esta. Freire não é o
                   interlocutor de Adler; é outro interlocutor, de outra
                   pergunta. Necessidade própria real e estrutural."
        context_note: "Original em português e de altíssima saliência no
                       Brasil. Registrado, sem efeito na prioridade. Qual das
                       regiões vazias tem precedência decide-se por
                       necessidade comparada, e essa comparação não pode ser
                       feita antes da cobertura cruzada."
      - work_title: "Illich — Sociedade sem Escolas"
        verdict: different-region
        argument: "Recusa a forma escolar inteira, incluindo a de Dewey."
        status_note: "Atualizado 2026-09-10: obra registrada na biblioteca como
                      illich--deschooling-society, membro de education na
                      região critica-da-escola (movimento V). Isto NÃO fecha
                      g03 — o interlocutor específico de Adler continua sendo
                      Dewey, ainda ausente."
    raised: 2026-09-05

