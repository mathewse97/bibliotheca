  - id: political-thought--g04
    type: one-sided-tradition
    necessity: alta
    status: accepted
    accepted:
      by: voce
      date: 2026-09-19
      work: marcuse--one-dimensional-man
      note: "Candidato aprovado por você em 2026-09-19. Habermas, 'Mudança Estrutural da Esfera Pública', continua registrado acima como alternativa NÃO aplicada — a lacuna fecha com Marcuse, e a outra obra permanece disponível como candidata de outra natureza."
      remaining: "A obra entrou na coleção. A EDIÇÃO não existe: nenhuma foi
                  enumerada, verificada nem escolhida (§E). Ter participação
                  não é ter livro."

    statement: >
      Distinta da g03, e mais ampla do que ela. A g03 diz que falta a exposição
      sistemática da teoria da história que Popper ("A Sociedade Aberta e Seus
      Inimigos") e Aron ("O Ópio dos Intelectuais") atacam. Esta diz que falta
      também o que a tradição marxista fez DEPOIS de a previsão falhar: a
      releitura que desloca a análise da economia para a cultura, a consciência
      e a esfera pública. A coleção tem o bloco crítico completo — Popper,
      Aron, Arendt ("Origens do Totalitarismo"), Schmitt, Michels, os
      libertários — e o pensamento de esquerda do século XX aparece quase só
      pelo que esses críticos dizem dele.
    evidence:
      - claim: "As duas obras de Marx na coleção são de 1848 e 1852; nenhuma
                obra da tradição posterior a 1917 está presente."
        check: null
        checkable: false
        reason: "Depende de `date_written` e de `traditions`, e os registros
                 estão `not_researched` com esses campos nulos."
      - claim: "Bezmenov entra como fonte primária sobre o método soviético de
                subversão, o que reforça a assimetria: a coleção descreve o
                marxismo por testemunho e por crítica, nunca por exposição
                própria."
        check: null
        checkable: false
        reason: "Leitura do argumento da coleção."
    candidates:
      - work_title: "Marcuse — O Homem Unidimensional (1964)"
        verdict: gap-filler
        argument: "É o texto em que a tese de que a sociedade industrial
                   absorve toda contestação vira argumento político, e é por
                   ele que a Escola de Frankfurt entra na política prática dos
                   anos 1960."
        over: "Adorno e Horkheimer pertencem a Cultura — ver culture--g01 —,
               porque o objeto deles ali é a cultura, não o regime."
        placement:
          collection: political-thought
          role: critical-response
          demand: exigente
          priority_library: secondary
      - work_title: "Habermas — Mudança Estrutural da Esfera Pública (1962)"
        verdict: gap-filler
        argument: "Alternativa de outro tipo: reconstrói como se formou e se
                   degradou um espaço público de discussão racional, e é a
                   ruptura interna com o pessimismo de Adorno. Fala diretamente
                   com Tocqueville, com Mill e com o problema da opinião."
      - work_title: "Gramsci; Lukács"
        verdict: complementary
        argument: "Antecedentes do deslocamento para a cultura. Não fecham a
                   lacuna: são origem, não exposição nem desenvolvimento
                   político."
      - work_title: "Uma história do marxismo ocidental"
        verdict: supporting
        role_if_added: supplementary
        argument: "Apoio de leitura, não fechamento. Entra como
                   material de acompanhamento e não substitui nenhuma das obras acima."
    raised: 2026-09-19

  - id: political-thought--g05
    type: missing-foundation
    necessity: alta
    status: accepted
    accepted:
      by: voce
      date: 2026-09-19
      work: kant--grundlegung-zur-metaphysik-der-sitten
      note: "Candidato aprovado por você em 2026-09-19. 'À Paz Perpétua' continua registrada como complementar e NÃO entrou."
      remaining: "A obra entrou na coleção. A EDIÇÃO não existe: nenhuma foi
                  enumerada, verificada nem escolhida (§E). Ter participação
                  não é ter livro."

    statement: >
      Kant não está em nenhuma coleção do acervo, e a coleção contém duas obras
      que dependem dele para serem lidas. Rawls ("Uma Teoria da Justiça") é
      declaradamente kantiano na construção do procedimento; e o debate sobre
      ordem internacional e paz entre repúblicas, que atravessa a sequência do
      Iluminismo em diante, tem nele o texto de referência. A coleção salta de
      Rousseau ("Do Contrato Social") para Burke ("Reflexões sobre a Revolução
      em França") sem a formulação moral que os dois disputam.
    evidence:
      - claim: "Nenhuma obra de Kant existe no acervo, em nenhuma coleção."
        check: null
        checkable: false
        reason: "Predicado de ausência sobre o acervo; conferido manualmente em
                 2026-09-19."
      - claim: "Rawls está na coleção e é herdeiro direto dessa formulação."
        check: null
        checkable: false
        reason: "Predicado de contagem aposentado em 2026-09-19. Eram 41 ao
                 levantar a lacuna, 43 com Kant e Marcuse, 46 com A Ideologia
                 Alemã, Lukács e Habermas — isto é, envelhece a cada obra que
                 entra e ficaria stale para sempre. A afirmação que importa
                 é que Rawls está na coleção e depende de Kant, e essa é
                 verificável lendo o registro da obra."

    candidates:
      - work_title: "Kant — Fundamentação da Metafísica dos Costumes (1785)"
        verdict: gap-filler
        argument: "Curto, e é onde a autonomia e a dignidade como fim em si são
                   enunciadas. É o mínimo que faz Rawls ser legível."
        placement:
          collection: political-thought
          before: burke--reflections-france
          role: foundational
          demand: exigente
          priority_library: secondary
      - work_title: "Kant — À Paz Perpétua (1795)"
        verdict: complementary
        argument: "O texto político propriamente dito, e muito mais acessível.
                   Não substitui a Fundamentação como fundação moral."
    note: "Kant aparece DUAS vezes no acervo proposto, por razões diferentes:
           aqui pela moral e pela política, e em culture--g02 pela estética.
           São obras distintas e lacunas distintas — não é duplicação."
    raised: 2026-09-19

  - id: political-thought--g06
    type: missing-foundation
    necessity: media-alta
    status: open
    statement: >
      A coleção tem o totalitarismo descrito por fora — Arendt, "Origens do
      Totalitarismo"; Schmitt, "O Conceito do Político"; Michels; Koestler —
      e, desde 2026-09-19, a crítica cultural de Adorno e Horkheimer,
      "Dialética do Esclarecimento", em Cultura. O que falta é a peça que liga
      as duas: a explicação de COMO se forma o indivíduo disposto a obedecer.
      Essa explicação é o próprio programa da Escola de Frankfurt — Marx
      explicado com Freud —, e ela tem obras próprias, nenhuma delas no acervo.
      Sem ela, a biblioteca discute o totalitarismo sem ter a única tentativa
      sistemática de explicar o material humano que o tornou possível.
    context: "Os 'Estudos sobre Autoridade e Família' (1936) provavelmente não
              têm edição em português, e 'A Personalidade Autoritária' é obra
              extensa e de disponibilidade a verificar. Nada disso altera a
