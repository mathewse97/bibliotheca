    candidates:
      - work_title: "Adorno, Frenkel-Brunswik, Levinson & Sanford — A
                     Personalidade Autoritária (1950)"
        verdict: gap-filler
        argument: "É o estudo empírico em que a tese é formulada e testada:
                   traços de personalidade que se agrupariam como resultado de
                   experiências da infância, medidos pela escala F. Fecha a
                   lacuna porque é onde a explicação está escrita pelos
                   próprios autores, e não pelos seus críticos."
        over: "Os 'Estudos sobre Autoridade e Família' são o antecedente de
               1936, mais difíceis de obter e provavelmente sem edição
               brasileira."
        placement:
          collection: political-thought
          movement: "VII. Poder, partidos, massas e ideologia"
          after: arendt--origins-of-totalitarianism
          role: critical-response
          demand: exigente
        caveat: "A obra é alvo de crítica metodológica séria e antiga — viés
                 de amostra, construção da escala F, direcionamento político do
                 instrumento. Se entrar, entra com isso escrito, e não como
                 conclusão estabelecida."
      - work_title: "Horkheimer (org.) — Estudos sobre Autoridade e Família
                     (1936)"
        verdict: complementary
        argument: "O antecedente direto, publicado em Paris pelo Instituto no
                   exílio, com a parte sociopsicológica de Erich Fromm. É onde
                   a família aparece como objeto de pesquisa da escola."
        availability_note: "Edição em português a verificar; provavelmente
                            inexistente."
      - work_title: "Marcuse — Eros e Civilização (1955)"
        verdict: complementary
        argument: "A outra ponta da tese: a repressão pulsional que a
                   civilização exige teria um excedente, imposto pela
                   organização do trabalho e não pela civilização como tal.
                   Pertenceria a Cultura, ao lado de Freud, 'O Mal-Estar na
                   Civilização', e não a esta coleção."
    note: >
      ACHADO QUE CONTRARIA A VERSÃO CORRENTE, e que motivou registrar esta
      lacuna como vale a pena registrá-la: a SEP descreve que a escola
      analisou a mudança na família moderna e sustentou que **o declínio das
      figuras de autoridade na família** contribuiu para o declínio das
      capacidades críticas do indivíduo e da sociedade. Isto é quase o oposto
      do que a versão popular lhes atribui: não celebram a dissolução da
      família, temem que, sem a instância em que a consciência e a autonomia
      se formavam, o indivíduo fique exposto diretamente à cultura de massa e
      à autoridade externa. A tese deles sobre a família patriarcal é
      ambivalente — ela produz obediência E produz a interioridade capaz de
      resistir. Registrar isso aqui é o que impede que a biblioteca responda à
      pergunta pela caricatura, de qualquer um dos lados.
    raised: 2026-09-19
    raised_context: "Pergunta do Mathews sobre se a destruição dos valores da
                     família tradicional seria uma das consequências desse
                     panorama."

