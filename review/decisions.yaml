# ---------------------------------------------------------------------------
# DECISÕES — a caixa de entrada do Mathews (tela "Decisões")
#
# Formato aprovado por ele em 2026-09-25 (protótipo "Decisões"). Cada item é
# uma pergunta que só ele responde, escrita PARA ELE: pergunta em linguagem
# corrente, por que importa, opções com o que muda em cada uma, e a
# recomendação do agente com a razão. Ver config/interface-rules.md §7.
#
# Os registros técnicos (lacunas em review/gaps/, propostas em
# review/structural/) continuam sendo o registro de pesquisa; este arquivo é a
# forma decidível deles. `source` liga o item ao registro de origem.
#
# Campos:
#   id, kind (obra | edicao | posicao | colecao | lugar | regra), collections [ids],
#   priority (alta | media | baixa | null), state (decidir | aguardando | decidida),
#   question, why, update (opcional), options [{key, title, effect, recommended}],
#   recommendation (por que a recomendada), candidates (kind obra),
#   editions (kind edicao), work + collection (kind posicao),
#   composition: true (mostra a composição da coleção por movimento),
#   waiting_for (state aguardando), signals (opcional), source,
#   decided {date, choice, note} (state decidida).
#
# Um cartão decidido CONTINUA na seção temática em que nasceu, com as opções e
# os candidatos preservados — é o registro de por que a escolha foi feita. Quem
# separa as três telas é o campo `state`, não a posição no arquivo.
#
# Quando ele responde: o agente aplica a escolha nos arquivos, muda `state`
# para `decidida`, preenche `decided` e atualiza o registro de origem.
# ---------------------------------------------------------------------------

items:
- id: d-pol-estrelas
  kind: colecao
  collections: [political-thought]
  priority: media
  state: decidida
  decided: {date: 2026-10-30, choice: "Opção A — aplicar a revisão: 21 estrelas.", note: "Aplicado. Perderam a estrela O 18 de Brumário, Os Demônios, Admirável Mundo Novo, A Fazenda dos Animais, Popper, Aron, Dahl, Anatomia do Estado e Hoppe; ganharam Confúcio, Ibn Khaldun e Agostinho. Nenhuma obra mudou de lugar."}
  source: review/political-thought.md §11
  question: "Rever as estrelas de Política, que hoje marcam metade da coleção?"
  why: "A estrela marca a obra indispensável: sem ela a coleção não responde bem à pergunta (com que direito uns governam outros, e quando esse governo é legítimo), e nenhuma outra obra ocupa o lugar dela. Política tem 27 estrelas em 54 obras, todas da sua lista. Aplicando a regra, 18 continuam, 9 perdem a estrela porque outra obra já ocupa o lugar delas, e 3 obras que não tinham estrela deveriam ter. Nenhuma obra sai da coleção; só muda a marca."
  options:
    - {key: A, recommended: true, title: "Aplicar a revisão: 21 estrelas", effect: "Ficam 18 das suas e entram Confúcio, Ibn Khaldun e Agostinho. Perdem a estrela: *O 18 de Brumário*, *Os Demônios*, *Admirável Mundo Novo*, *A Fazenda dos Animais*, Popper, Aron, Dahl, *Anatomia do Estado* e Hoppe. Todas continuam na coleção, na mesma posição."}
    - {key: B, title: "Só acrescentar as três", effect: "Todas as suas estrelas ficam e entram Confúcio, Ibn Khaldun e Agostinho: 30 de 54."}
    - {key: C, title: "Manter como está", effect: "As 27 estrelas da sua lista continuam; as três obras não ganham estrela."}
  recommendation: "as nove que perdem a estrela continuam boas leituras, mas o lugar de cada uma já é ocupado. O *Manifesto* ocupa o lugar do marxismo, que *O 18 de Brumário* aplica a um caso. *1984* ocupa o do romance sobre o poder total; *A Fazenda dos Animais* conta a mesma revolução traída, e o controle pelo conforto de Huxley já tem a sua teoria em Marcuse. Arendt e Berlin ocupam a resposta liberal ao totalitarismo, que Popper e Aron reforçam. *A Ética da Liberdade* é a exposição completa da posição libertária, que *Anatomia do Estado* resume e Hoppe aplica. *Sobre a Democracia* é uma introdução, já em cartão próprio para a troca pela obra madura de Dahl. As três que entram são as únicas respostas de fora da linha que vai de Platão a Rawls: a legitimidade pela virtude (Confúcio), pela coesão do grupo (Ibn Khaldun) e diante de Deus (Agostinho)."
  candidates:
    - {title: "Confúcio, Os Analectos", author: "séc. V a.C.", verdict: resolve, best: true, adds: "Governa quem tem virtude: a única resposta chinesa da coleção.", facts: ["+Ganha estrela", "Grande livro"]}
    - {title: "Ibn Khaldun, Muqaddimah", author: "1377", verdict: resolve, best: true, adds: "O poder nasce da coesão do grupo e decai em gerações: a única teoria do ciclo dinástico.", facts: ["+Ganha estrela", "Grande livro"]}
    - {title: "Agostinho, A Cidade de Deus", author: "413–426", verdict: resolve, best: true, adds: "A justiça da cidade terrena julgada a partir de Deus: a fundação do pensamento político cristão.", facts: ["+Ganha estrela", "Grande livro"]}
    - {title: "Marx, O 18 de Brumário", author: "1852", verdict: complementa, adds: "Aplica a análise de classe a um golpe; o lugar do marxismo é do Manifesto.", facts: ["-Perde a estrela", "Livro de estudo"]}
    - {title: "Dostoiévski, Os Demônios", author: "1872", verdict: complementa, adds: "O niilismo revolucionário em romance; tratamento literário, não resposta à pergunta.", facts: ["-Perde a estrela", "Grande livro"]}
    - {title: "Huxley, Admirável Mundo Novo", author: "1932", verdict: complementa, adds: "O controle pelo prazer; a teoria dele está em Marcuse, e o romance do poder total é 1984.", facts: ["-Perde a estrela", "Grande livro"]}
    - {title: "Orwell, A Fazenda dos Animais", author: "1945", verdict: complementa, adds: "A mesma revolução traída de 1984, em fábula curta.", facts: ["-Perde a estrela", "Livro de estudo"]}
    - {title: "Popper, A Sociedade Aberta e Seus Inimigos", author: "1945", verdict: complementa, adds: "A crítica liberal do historicismo; o lugar da resposta liberal é de Arendt e Berlin.", facts: ["-Perde a estrela", "Livro de estudo"]}
    - {title: "Aron, O Ópio dos Intelectuais", author: "1955", verdict: complementa, adds: "A crítica dos intelectuais marxistas; reforça a mesma resposta.", facts: ["-Perde a estrela", "Livro de estudo"]}
    - {title: "Dahl, Sobre a Democracia", author: "1998", verdict: complementa, adds: "Introdução; a troca pela obra madura está no cartão d-pol-adler-dahl.", facts: ["-Perde a estrela", "Informação"]}
    - {title: "Rothbard, Anatomia do Estado", author: "1974", verdict: complementa, adds: "Resumo da posição que A Ética da Liberdade expõe por inteiro.", facts: ["-Perde a estrela", "Informação"]}
    - {title: "Hoppe, Democracia, o Deus que Falhou", author: "2001", verdict: complementa, adds: "Aplica a posição de Rothbard à democracia; já em cartão próprio.", facts: ["-Perde a estrela", "Informação"]}


# ============================== ADICIONAR OBRA ==============================

- id: d-edu-fonte
  kind: obra
  collections: [education]
  priority: alta
  state: decidida
  decided: {date: 2026-10-27, choice: "Opção B — incluir Agostinho, A Doutrina Cristã, e Hugo de São Vítor, Didascálicon.", note: "Aplicado. Duas obras, quatro edições e seis pessoas registradas. Agostinho entrou no movimento I logo depois de Nunes, Antiguidade Cristã, na edição da Paulus (Patrística 17, trad. Nair de Assis Oliveira; alternativa: Vozes de Bolso, trad. Frei Ary E. Pintarelli). Hugo entrou no mesmo movimento, depois de Jaeger, na edição bilíngue da Vozes (2001, trad. Antonio Marchionni, só usada; alternativa: Kírion 2018, bilíngue, nova). O propósito do movimento I foi revisto para admitir as duas fontes. A lacuna education--g01 passou a accepted. Correção: Hugo tem três traduções em português, não pouca edição."}
  source: education--g01
  question: "Incluir em Educação um texto em que o ideal clássico é praticado, e não só contado?"
  why: "A coleção percorre dois mil anos do ideal clássico de formação só por meio de estudos sobre ele. Das 14 obras, só uma está registrada como fonte primária: Illich, que critica a escola. Nenhum texto da própria tradição clássica está lá."
  update: "Atualizado: quando esta questão foi aberta, a coleção tinha 9 obras."
  options:
    - {key: A, recommended: true, title: "Incluir Agostinho, *A Doutrina Cristã*", effect: "Entra no movimento I, logo depois de Nunes, *Antiguidade Cristã*. Leitura exigente. Eu pesquiso e registro a melhor edição."}
    - {key: B, title: "Incluir Agostinho e Hugo de São Vítor, *Didascalicon*", effect: "Duas fontes: Agostinho no mundo cristão antigo, Hugo na Idade Média (curto). Hugo tem pouca edição em português."}
    - {key: C, title: "Agora não", effect: "Nada muda. A questão volta depois que outras coleções forem importadas."}
    - {key: D, title: "Descartar", effect: "A coleção fica deliberadamente só com estudos sobre a educação. A questão é arquivada."}
  recommendation: "a sua justificativa de Nunes diz que o cristianismo não abandona a tradição clássica, mas a incorpora e transforma. Esse é exatamente o tema de *A Doutrina Cristã*: Nunes narra o processo, Agostinho é o processo. E tem boas edições em português."
  composition: true
  composition_note: "Nenhuma das 14 é um texto da própria tradição clássica."
  candidates:
    - {title: "A Doutrina Cristã", author: "Agostinho · séc. IV–V", verdict: resolve, best: true, adds: "O Livro IV é o momento em que a retórica clássica é posta a serviço do cristianismo — o que Nunes narra, aqui acontece.", facts: ["Movimento I, após Nunes", "+Boas edições em português"]}
    - {title: "Didascalicon", author: "Hugo de São Vítor · séc. XII", verdict: resolve, adds: "O texto medieval sobre a ordem das artes. Melhor escolha se você quiser duas fontes.", facts: ["Curto", "-Pouca edição em português"]}
    - {title: "Instituição Oratória", author: "Quintiliano · séc. I", verdict: complementa, adds: "Excelente, mas o movimento I já tem Marrou como guia dessa época.", facts: ["Volumoso", "-Pouca edição em português"]}
    - {title: "Didática Magna", author: "Comênio · séc. XVII", verdict: complementa, adds: "Já é o modelo moderno que confronta a tradição, não a tradição."}

- id: d-edu-dewey
  kind: obra
  collections: [education]
  priority: alta
  state: decidida
  decided: {date: 2026-10-05, choice: "Opção A — incluir Dewey, Democracia e Educação, pela edição Unesp de 2026 (trad. Guilherme Mirage Umeda, apres. Carlota Boto), que você pesquisou.", note: "Aplicado. Obra, edição e três pessoas registradas; Dewey entrou no movimento II, entre Ozmon e Hirsch (posição minha, a confirmar). A lacuna education--g03 passou a accepted. RESSALVA: a premissa do cartão estava imprecisa — a Paideia de Adler é dedicada a Dewey e invoca este livro; Adler recusa o método progressista, não o ideal democrático de Dewey. Gravei a relação como responds_to e não como tensão. Páginas, dimensões e ISBN da edição ficaram como informados por você: a página da Unesp não abriu deste ambiente."}
  source: education--g03
  question: "Incluir em Educação a posição que Adler combate: a educação progressista, na voz de Dewey?"
  why: "A proposta de Adler nasceu contra a educação progressista, e Hirsch também a ataca. A coleção tem os críticos, mas não o texto criticado — você lê a resposta sem ler aquilo a que ela responde."
  update: "Atualizado: desde que a questão foi aberta entraram Hirsch (que critica a educação progressista de fora) e Illich (que recusa a escola inteira). Nenhum dos dois é a voz da posição progressista."
  options:
    - {key: A, recommended: true, title: "Incluir Dewey, *Democracia e Educação*", effect: "Entra no movimento II, ao lado das posições em disputa. Eu pesquiso e registro a melhor edição."}
    - {key: B, title: "Agora não", effect: "Nada muda. A questão volta depois que outras coleções forem importadas."}
    - {key: C, title: "Descartar", effect: "A coleção fica sem a voz progressista; a questão é arquivada."}
  recommendation: "é a exposição sistemática da posição contrária, escrita por quem a formulou. Com ela, Adler e Hirsch deixam de discutir com uma ausência. Há tradução em português."
  candidates:
    - {title: "Democracia e Educação", author: "John Dewey · 1916", verdict: resolve, best: true, adds: "A posição progressista exposta por quem a formulou.", facts: ["Movimento II", "+Há tradução em português"]}
    - {title: "Pedagogia do Oprimido", author: "Paulo Freire · 1968", verdict: outra, adds: "Não é o interlocutor de Adler: responde a outra pergunta (a pedagogia crítica). Tem valor próprio, mas não resolve esta questão."}

- id: d-edu-newman
  kind: obra
  collections: [education]
  priority: media
  state: decidida
  decided: {date: 2026-10-05, choice: "Opção A — incluir Newman, A Ideia de uma Universidade, pela edição Ecclesiae 2020 que você pesquisou; colocação corrigida por você para o movimento VII, antes de Weber.", note: "Aplicado. Obra, edição e duas pessoas registradas. O cartão dizia movimento I, depois de Nunes — texto meu, errado: o I é narrado por história e Newman é fonte primária. No VII ele é a resposta afirmativa à pergunta do movimento e Weber a negativa; a tensão entre os dois foi gravada. A lacuna education--g02 passou a accepted; o século XVIII continua sem obra. O tradutor (Bruno Alexander) não aparece em nenhuma fonte que eu consegui consultar."}
  source: education--g02
  question: "Preencher em Educação o salto de dois séculos entre Nunes e Adler?"
  why: "A cadeia vai da educação no século XVII (Nunes) direto para Adler, em 1982. Ficam de fora os séculos em que o ideal clássico foi desmontado e defendido."
  options:
    - {key: A, recommended: true, title: "Incluir Newman, *A Ideia de uma Universidade*", effect: "Entra no movimento I, depois de Nunes, *Século XVII*. Eu verifico se há boa edição em português."}
    - {key: B, title: "Agora não", effect: "Nada muda. A questão volta depois que outras coleções forem importadas."}
    - {key: C, title: "Descartar", effect: "O salto fica como está; a questão é arquivada."}
  recommendation: "é a defesa mais forte do ideal de formação liberal escrita depois de ele ter sido posto em causa. Newman fez para a universidade o que Adler faz para a escola. A edição em português pode ser difícil — isso muda o custo, não a importância."
  candidates:
    - {title: "A Ideia de uma Universidade", author: "John Henry Newman · 1852", verdict: resolve, best: true, adds: "A defesa clássica da formação liberal no século XIX.", facts: ["Movimento I, após Nunes", "-Edição em português a verificar"]}

- id: d-pol-nozick
  kind: obra
  collections: [political-thought]
  priority: alta
  state: decidida
  decided: {date: 2026-09-27, choice: "Opção A — incluir Nozick, *Anarquia, Estado e Utopia*, no movimento VIII, logo depois de Rawls.", note: "Falta a pesquisa bibliográfica da edição em português e o registro da obra; está na fila de pesquisa aberta nesta data."}
  source: political-thought--g01
  question: "Incluir em Política uma resposta direta a Rawls?"
  why: "A coleção põe Rawls e a crítica libertária frente a frente, mas Rothbard e Hoppe não respondem a Rawls: partem de outra fundamentação e não discutem o argumento dele. A oposição está na ordem da coleção, não nos textos."
  options:
    - {key: A, recommended: true, title: "Incluir Nozick, *Anarquia, Estado e Utopia*", effect: "Entra no movimento VIII, logo depois de Rawls. Eu pesquiso a edição em português."}
    - {key: B, title: "Agora não", effect: "Nada muda. A questão volta depois que outras coleções forem importadas."}
    - {key: C, title: "Descartar", effect: "A oposição fica só implícita; a questão é arquivada."}
  recommendation: "é a resposta canônica a *Uma Teoria da Justiça*, escrita contra ela. É o livro que fez o debate existir."
  candidates:
    - {title: "Anarquia, Estado e Utopia", author: "Robert Nozick · 1974", verdict: resolve, best: true, adds: "Resposta direta e canônica a Rawls.", facts: ["Movimento VIII, após Rawls", "-Edição em português a verificar"]}

- id: d-pol-federalista
  kind: obra
  collections: [political-thought]
  priority: alta
  state: decidida
  decided: {date: 2026-09-27, choice: "Opção A — incluir *O Federalista* (Hamilton, Madison e Jay) no movimento IV, logo depois de Montesquieu.", note: "Falta a pesquisa bibliográfica da edição e o registro da obra; está na fila de pesquisa aberta nesta data."}
  source: political-thought--g02
  question: "Incluir em Política o momento em que a separação de poderes foi projetada?"
  why: "Montesquieu dá a teoria; Tocqueville descreve o que ela virou numa sociedade real. Falta o texto em que ela foi desenhada e defendida por quem precisava fazê-la funcionar — e Tocqueville supõe que você o conhece."
  options:
    - {key: A, recommended: true, title: "Incluir *O Federalista* (Hamilton, Madison e Jay)", effect: "Entra no movimento IV, logo depois de Montesquieu. Eu pesquiso a edição."}
    - {key: B, title: "Agora não", effect: "Nada muda. A questão volta depois que outras coleções forem importadas."}
    - {key: C, title: "Descartar", effect: "A questão é arquivada."}
  recommendation: "é fonte primária, não comentário: o único texto em que a arquitetura constitucional é argumentada por quem ia governar com ela. Liga Montesquieu a Tocqueville."
  candidates:
    - {title: "O Federalista", author: "Hamilton, Madison e Jay · 1787–88", verdict: resolve, best: true, adds: "A separação de poderes argumentada por quem a fez funcionar.", facts: ["Movimento IV, após Montesquieu"]}

- id: d-pol-autoritaria
  kind: obra
  collections: [political-thought]
  priority: alta
  state: decidida
  decided: {date: 2026-09-27, choice: "Opção A — incluir *A Personalidade Autoritária* (Adorno e outros) no movimento VII, depois de Arendt.", note: "Obra extensa: falta verificar que edição existe em português e em que forma (integral ou condensada), e registrar a obra. Está na fila de pesquisa aberta nesta data."}
  source: political-thought--g06
  question: "Incluir em Política a explicação de como se forma quem está disposto a obedecer?"
  why: "A coleção descreve o totalitarismo por fora — Arendt, Schmitt, Michels, Koestler. Falta a peça que explica o lado de dentro: como se forma o indivíduo que adere. Esse foi o programa da Escola de Frankfurt, e nenhuma obra dela sobre o assunto está no acervo."
  options:
    - {key: A, recommended: true, title: "Incluir *A Personalidade Autoritária* (Adorno e outros)", effect: "Entra no movimento VII, depois de Arendt. Obra extensa; eu verifico a edição disponível."}
    - {key: B, title: "Agora não", effect: "Nada muda."}
    - {key: C, title: "Descartar", effect: "A questão é arquivada."}
  recommendation: "é onde a tese está escrita pelos próprios autores, com a pesquisa que a testou, e não pelos seus críticos."
  candidates:
    - {title: "A Personalidade Autoritária", author: "Adorno, Frenkel-Brunswik, Levinson e Sanford · 1950", verdict: resolve, best: true, adds: "O estudo empírico em que a tese é formulada e testada.", facts: ["Movimento VII, após Arendt", "Extenso", "-Edição a verificar"]}
    - {title: "Estudos sobre Autoridade e Família", author: "Horkheimer (org.) · 1936", verdict: complementa, adds: "O antecedente direto, com a parte de Erich Fromm.", facts: ["-Provavelmente sem edição em português"]}
    - {title: "Eros e Civilização", author: "Marcuse · 1955", verdict: outra, adds: "A outra ponta da tese; pertenceria a Cultura, ao lado de Freud, e não a Política."}

- id: d-rel-eliade
  kind: obra
  collections: [religion]
  priority: alta
  state: decidir
  source: religion--g01
  question: "Incluir em Religião uma voz que conteste o método de Eliade?"
  why: "Seis das 30 obras são de Eliade — cerca de 2.600 páginas, um quinto da coleção — e todas defendem a mesma ideia: existe uma estrutura do sagrado comum a todas as culturas. Essa ideia é contestada há décadas, e a coleção não tem nenhuma obra que apresente a contestação. Berger é um bom contraponto, mas muda de assunto em vez de responder."
  options:
    - {key: A, recommended: true, title: "Incluir J. Z. Smith, *To Take Place*", effect: "Entra no movimento II, o da teoria do fenômeno religioso. Livro curto, em inglês."}
    - {key: B, title: "Agora não", effect: "Nada muda."}
    - {key: C, title: "Descartar", effect: "A coleção fica com a lente de Eliade como principal; a questão é arquivada."}
  recommendation: "Smith volta aos próprios exemplos que Eliade usou como prova e mostra que as fontes não dizem o que Eliade afirma. A conclusão — o padrão é obra de quem compara — é exatamente a contestação que falta."
  candidates:
    - {title: "To Take Place: Toward Theory in Ritual", author: "Jonathan Z. Smith · 1987", verdict: resolve, best: true, adds: "Refaz os exemplos de Eliade e mostra onde eles não se sustentam.", facts: ["Movimento II", "~180 p.", "-Em inglês"]}

- id: d-rel-especificas
  kind: obra
  collections: [religion]
  priority: alta
  state: decidir
  source: religion--g02
  question: "O movimento \"Religiões específicas\" deve cobrir o que a frase dele promete?"
  why: "Você escreveu sob o título: \"Budismo, hinduísmo, islamismo, judaísmo etc.\". O movimento tem duas obras, e as duas são de budismo. Hinduísmo, islamismo e judaísmo como tradição viva não aparecem em nenhuma obra da coleção."
  options:
    - {key: A, title: "Quero sugestões", effect: "Eu trago uma comparação de introduções e fontes para hinduísmo, islamismo e judaísmo, uma por tradição, para você escolher."}
    - {key: B, recommended: true, title: "Agora não", effect: "Nada muda. A questão volta depois que outras coleções forem importadas."}
    - {key: C, title: "Ajustar a frase do movimento", effect: "O movimento passa a dizer o que contém (budismo). As outras tradições saem do escopo declarado."}
  recommendation: "são três tradições inteiras; faz mais sentido decidir depois de ver as outras coleções importadas, para não criar três lacunas de compra de uma vez. Não há aqui nenhuma compra devida."
  composition: true

- id: d-rel-cristianismo
  kind: obra
  collections: [religion]
  priority: alta
  state: decidida
  decided: {date: 2026-10-30, choice: "Opção B — quero sugestões.", note: "As sugestões estão no cartão d-rel-cristianismo-opcoes: uma obra para cada parte que a frase do movimento promete (Padres, história da Igreja, escolástica, Reforma), mais um guia de conjunto."}
  source: religion--g03
  question: "O movimento \"Cristianismo\" deve ter o cristianismo como assunto próprio?"
  why: "A frase dele promete Padres da Igreja, história da Igreja, escolástica, Reforma e teologia. Hoje o movimento tem a Bíblia de Jefferson, as cartas de Francisco Xavier e *Cruzando o Limiar da Esperança* — nenhum Padre da Igreja, nenhuma escolástica, nenhuma Reforma."
  options:
    - {key: A, recommended: true, title: "Incluir *A Cidade de Deus*, de Agostinho", effect: "A obra já está no acervo (em Política). Ganha uma participação no movimento VI, sem compra nova."}
    - {key: B, title: "Quero sugestões", effect: "Eu trago opções para escolástica, Reforma e teologia."}
    - {key: C, title: "Agora não", effect: "Nada muda."}
    - {key: D, title: "Manter como está", effect: "O movimento fica deliberadamente parcial; a questão é arquivada."}
  recommendation: "é o primeiro passo sem custo: um Padre da Igreja que você já tem, e um dos mais importantes."

- id: d-rel-cristianismo-opcoes
  kind: obra
  collections: [religion]
  priority: alta
  state: decidir
  source: religion--g03
  question: "Quais obras dão ao movimento \"Cristianismo\" os Padres, a história da Igreja, a escolástica e a Reforma?"
  why: "A frase do movimento VI promete cristianismo primitivo, Padres da Igreja, história da Igreja, escolástica, Reforma e teologia. O cristianismo primitivo já está no movimento IV (Evangelhos, Ehrman, Vermes) e a teologia aparece nos Padres e na escolástica. Faltam quatro coisas. Para cada uma escolhi uma fonte primária curta ou já na biblioteca, porque a coleção estuda a religião pelas fontes e pelos instrumentos, não por uma tradição. Weber, *A Ética Protestante*, já cobre as consequências da Reforma; falta a Reforma em si."
  options:
    - {key: A, recommended: true, title: "As quatro fontes", effect: "Entram: *A Cidade de Deus*, de Agostinho (já está na biblioteca, sem compra); a *História Eclesiástica*, de Eusébio; o *Proslógio*, de Anselmo; e *Da Liberdade do Cristão*, de Lutero. Eu pesquiso e registro a melhor edição de cada uma."}
    - {key: B, title: "As quatro fontes e um guia de conjunto", effect: "As mesmas quatro, mais *A History of Christianity*, de Diarmaid MacCulloch, a história do cristianismo de referência, em inglês (não achei tradução em português; há uma em espanhol)."}
    - {key: C, title: "Só *A Cidade de Deus*", effect: "Entra a obra que já está na biblioteca, sem compra. Escolástica, Reforma e história da Igreja continuam de fora."}
    - {key: D, title: "Agora não", effect: "Nada muda."}
  recommendation: "uma fonte por parte cobre a promessa da frase sem inchar a coleção: são quatro obras, três delas curtas, e uma já é sua. Agostinho é a fundação da teologia cristã; Eusébio, a primeira história da Igreja, escrita por quem viveu o fim das perseguições; Anselmo mostra o método da escolástica em poucas páginas (a fé que busca entender, e o argumento ontológico); Lutero, o centro da Reforma em um tratado curto. O guia de MacCulloch é excelente, mas é grande e, em português, não o encontrei: vale se você quiser o quadro inteiro, inclusive o cristianismo oriental, que nenhuma das quatro cobre."
  composition: true
  candidates:
    - {title: "A Cidade de Deus", author: "Agostinho · 413–426", verdict: resolve, best: true, adds: "A fundação da teologia cristã da história: a cidade de Deus e a cidade terrena. Padre da Igreja.", facts: ["+Já na biblioteca (Política)", "+Sem compra", "Leitura por partes"]}
    - {title: "História Eclesiástica", author: "Eusébio de Cesareia · c. 325", verdict: resolve, best: true, adds: "A primeira história da Igreja, de Jesus a Constantino, escrita por um bispo da época. É fonte e é história ao mesmo tempo.", facts: ["+Paulus, Patrística vol. 15", "Edição a pesquisar"]}
    - {title: "Proslógio", author: "Anselmo de Cantuária · 1078", verdict: resolve, best: true, adds: "A escolástica em semente: a fé que busca entender e o argumento ontológico, com a objeção de Gaunilo.", facts: ["+Curto", "+Edição bilíngue em português (Concreta)"]}
    - {title: "Da Liberdade do Cristão", author: "Martinho Lutero · 1520", verdict: resolve, best: true, adds: "O núcleo da Reforma: a justificação pela fé e a liberdade do cristão, em um tratado curto.", facts: ["+Curto", "+Editora Unesp, bilíngue"]}
    - {title: "A History of Christianity", author: "Diarmaid MacCulloch · 2009", verdict: complementa, adds: "A história do cristianismo de referência em um volume, inclusive o cristianismo oriental e o moderno.", facts: ["-Sem tradução em português encontrada", "-Cerca de 1.200 páginas"]}
    - {title: "Institutas da Religião Cristã", author: "João Calvino · 1536–1559", verdict: complementa, adds: "A teologia sistemática da Reforma; Lutero já ocupa o lugar da Reforma.", facts: ["-Volumosa"]}
    - {title: "A Filosofia na Idade Média", author: "Étienne Gilson · 1922", verdict: complementa, adds: "O guia clássico da escolástica; útil, mas grande (968 páginas) e caro.", facts: ["-968 páginas", "-Impressão sob demanda"]}
    - {title: "História Ilustrada do Cristianismo", author: "Justo L. González · 1978–", verdict: outra, adds: "A história da Igreja mais usada em português, mas escrita para seminários protestantes; a coleção pede um estudo sem perspectiva confessional.", facts: ["+Em português", "-Perspectiva confessional"]}
    - {title: "Introdução ao Cristianismo", author: "Joseph Ratzinger · 1968", verdict: outra, adds: "Teologia católica do Credo. A coleção já tem uma voz papal (João Paulo II).", facts: ["-Repete a perspectiva de João Paulo II"]}

- id: d-greco-romanas
  kind: obra
  collections: [greco-roman]
  priority: alta
  state: decidida
  decided: {date: 2026-10-30, choice: "Opção A — quero sugestões.", note: "A comparação está no cartão d-greco-romanas-opcoes."}
  source: greco-roman--g01
  question: "Incluir em Greco-Romana fontes antigas sobre a história de Roma?"
  why: "A coleção tem oito obras de história grega, três delas fontes antigas (como Heródoto e Tucídides). Para Roma, tem só dois historiadores modernos (Beard, Woolf). Você lê como os gregos narraram a si mesmos, mas não como os romanos o fizeram."
  options:
    - {key: A, recommended: true, title: "Quero sugestões", effect: "Eu comparo Tito Lívio, Salústio, Tácito e Suetônio (todos com boas edições em português) e recomendo um ou dois."}
    - {key: B, title: "Agora não", effect: "Nada muda."}
    - {key: C, title: "Descartar", effect: "Roma continua presente só pela literatura, pela moral e pelos historiadores modernos."}
  recommendation: "é a assimetria mais forte do acervo. Atenção: incluir várias fontes romanas é justamente o que reabre a questão de dividir a coleção em Grécia e Roma (ver os itens aguardando)."

- id: d-greco-romanas-opcoes
  kind: obra
  collections: [greco-roman]
  priority: alta
  state: decidir
  source: greco-roman--g01
  question: "Quais historiadores antigos trazem para Greco-Romana a história de Roma contada pelos próprios antigos?"
  why: "Comparei os cinco candidatos. Tito Lívio, Tácito e Suetônio só têm em português traduções fora de catálogo, que se acham usadas: as de Tácito são dos anos 1950 e 1960, e a de Tito Lívio, de 1989. Salústio tem uma edição nova (Hedra, 2018), cujo tradutor não consegui confirmar. Políbio tem uma tradução acadêmica nova e anotada, mas só dos livros I a V. Por isso, a melhor combinação mistura um em português e um em inglês."
  options:
    - {key: A, recommended: true, title: "Políbio e Tácito", effect: "Políbio, *História Pragmática*, livros I a V (Perspectiva, 2016, trad. Breno Battistin Sebastiani, professor de grego da USP): como Roma chegou a dominar o Mediterrâneo, contado por um grego que viveu entre os romanos. Tácito, *Anais*: o principado de Tibério a Nero, na tradução inglesa da Oxford World's Classics (J. C. Yardley, com notas de Anthony Barrett) ou da Penguin (Cynthia Damon). Entram no movimento IX, sobre Roma."}
    - {key: B, title: "Só Tácito", effect: "O maior historiador romano, em inglês. A república continua contada só por Mary Beard."}
    - {key: C, title: "Salústio e Políbio, os dois em português", effect: "*A Conjuração de Catilina*, de Salústio (Hedra, 2018), curto, sobre a crise da república, e Políbio. O império fica sem fonte; o tradutor de Salústio ainda precisa ser confirmado."}
    - {key: D, title: "Agora não", effect: "Nada muda."}
  recommendation: "Políbio e Tácito cobrem as duas metades que faltam: como a república se tornou um império, e o que o império fez da liberdade romana. Tácito é o maior historiador latino, e nenhuma edição atual em português lhe faz justiça; por isso o inglês. Atenção: a tradução de Políbio só tem os livros I a V, e a famosa análise da constituição romana está no livro VI; se sair o volume seguinte, ele entra no lugar. Dois historiadores não reabrem a questão de dividir a coleção em Grécia e Roma."
  candidates:
    - {title: "História Pragmática, livros I–V", author: "Políbio · séc. II a.C.", verdict: resolve, best: true, adds: "A ascensão de Roma, das Guerras Púnicas ao domínio do Mediterrâneo, por um grego que viveu em Roma.", facts: ["+Perspectiva 2016, tradução acadêmica anotada", "-Sem o livro VI, da constituição"]}
    - {title: "Anais", author: "Tácito · c. 115", verdict: resolve, best: true, adds: "O principado de Tibério a Nero: o poder de um só e o que restou da liberdade do senado.", facts: ["+O maior historiador latino", "-Só boa tradução em inglês"]}
    - {title: "A Conjuração de Catilina", author: "Salústio · c. 42 a.C.", verdict: complementa, adds: "Uma conspiração de 63 a.C. como retrato da corrupção da república.", facts: ["+Curto", "+Hedra 2018, à venda nova", "-Tradutor não confirmado"]}
    - {title: "História de Roma (Ab urbe condita)", author: "Tito Lívio · c. 27 a.C.–17 d.C.", verdict: complementa, adds: "A Roma dos reis e da república primitiva, entre lenda e história.", facts: ["-Tradução brasileira de 1989, só usada e cara", "Muito longo"]}
    - {title: "A Vida dos Doze Césares", author: "Suetônio · c. 121", verdict: outra, adds: "Biografias dos imperadores, cheias de anedotas; vale mais como retrato que como história.", facts: ["-Só traduções antigas", "-Biografia, não história"]}

- id: d-greco-material
  kind: obra
  collections: [greco-roman]
  priority: media
  state: decidida
  decided: {date: 2026-10-30, choice: "Opção B — quero sugestões.", note: "As sugestões estão no cartão d-greco-material-opcoes."}
  source: greco-roman--g02
  question: "Greco-Romana deve incluir arte, arquitetura e arqueologia, ou ficar só com textos?"
  why: "Nenhuma obra trata de escultura, arquitetura, cerâmica, urbanismo ou arqueologia. A coleção se chama \"Cultura e História\", mas toda a sua evidência é textual."
  options:
    - {key: A, title: "Ficar só com textos", effect: "Fica registrado que a coleção é deliberadamente textual. A questão é arquivada."}
    - {key: B, title: "Quero sugestões", effect: "Eu trago uma ou duas obras de cultura material para você avaliar."}
    - {key: C, title: "Agora não", effect: "Nada muda."}
  recommendation: "nenhuma — é uma escolha de escopo, e as duas respostas são legítimas."

- id: d-greco-material-opcoes
  kind: obra
  collections: [greco-roman]
  priority: media
  state: decidir
  source: greco-roman--g02
  question: "Qual obra traz para Greco-Romana a arte, a arquitetura e a arqueologia?"
  why: "Toda a evidência da coleção é textual: nenhuma obra trata de escultura, pintura de vasos, templos, cidades ou escavações. Uma obra basta para abrir essa porta; mais que isso transformaria a coleção numa história da arte. Procurei obras que tratem de Grécia e Roma juntas, como a coleção, e que leiam as imagens como evidência histórica, não só como estilo."
  options:
    - {key: A, recommended: true, title: "*Classical Art*, de Mary Beard e John Henderson", effect: "A arte grega e romana num volume da Oxford History of Art, escrito por uma historiadora que já está na coleção (*SPQR*). Entra no movimento XII, sobre o legado e a interpretação. Só existe em inglês."}
    - {key: B, title: "*Arquitetura Grega e Romana*, de D. S. Robertson", effect: "O manual clássico de arquitetura antiga, em português (WMF Martins Fontes, trad. Julio Fischer). É de 1929, revisto em 1943: sólido nos edifícios, mas antigo."}
    - {key: C, title: "*Greek and Roman Art*, de Susan Woodford", effect: "Introdução curta e ilustrada (Thames & Hudson, 2020), em inglês. Mais fácil, menos interpretativa."}
    - {key: D, title: "Ficar só com textos", effect: "Fica registrado que a coleção é deliberadamente textual; a questão é arquivada."}
  recommendation: "Beard e Henderson fazem exatamente a pergunta que falta à coleção: o que as imagens e os edifícios dizem sobre quem os fez e quem os olhava, de Atenas a Roma. É curto, interpretativo e conversa com o *SPQR*. O custo é o inglês; se você preferir português, Robertson é a opção, mas cobre só a arquitetura e envelheceu."
  candidates:
    - {title: "Classical Art: From Greece to Rome", author: "Mary Beard e John Henderson · 2001", verdict: resolve, best: true, adds: "A arte grega e romana lida como evidência: quem fazia, para quem, e como o Ocidente a reinventou.", facts: ["Oxford History of Art", "-Só em inglês", "+Mesma autora do SPQR"]}
    - {title: "Arquitetura Grega e Romana", author: "D. S. Robertson · 1929/1943", verdict: complementa, adds: "Templos, teatros e cidades, da Grécia arcaica a Constantinopla.", facts: ["+Em português", "-Só arquitetura", "-Antigo"]}
    - {title: "Greek and Roman Art", author: "Susan Woodford · 2020", verdict: complementa, adds: "Introdução curta e muito ilustrada.", facts: ["-Só em inglês", "Introdutório"]}
    - {title: "Grécia e Roma", author: "Pedro Paulo Funari · 2001", verdict: outra, adds: "Introdução brasileira à Antiguidade por um arqueólogo; é um panorama histórico, não uma obra de arte ou arqueologia.", facts: ["+Em português", "-Panorama, não arte"]}

- id: d-greco-ciencia
  kind: obra
  collections: [greco-roman]
  priority: baixa
  state: decidida
  decided: {date: 2026-10-31, choice: "Opção A — quero sugestões.", note: "As sugestões estão no cartão d-greco-ciencia-opcoes."}
  source: greco-roman--g03
  question: "Greco-Romana deve incluir ciência e medicina antigas, e religião romana?"
  why: "A coleção conta a passagem do mito ao pensamento racional sem a matemática, a astronomia e a medicina que fazem parte dela. E a religião romana não tem obra — a coleção Religião, agora importada, também não a cobre."
  options:
    - {key: A, title: "Quero sugestões", effect: "Eu trago opções para as duas áreas."}
    - {key: B, recommended: true, title: "Agora não", effect: "Nada muda."}
    - {key: C, title: "Descartar", effect: "As duas áreas ficam fora do escopo; a questão é arquivada."}
  recommendation: "é a de menor prioridade da coleção; as fontes romanas vêm antes."

- id: d-greco-ciencia-opcoes
  kind: obra
  collections: [greco-roman]
  priority: baixa
  state: decidida
  decided: {date: 2026-10-31, choice: "Opção B — a opção A e também Euclides.", note: "Aplicado. Textos hipocráticos (Fiocruz, 2005, trad. Henrique Cairus e Wilson Ribeiro Jr.) entrou no movimento V; Os Elementos, de Euclides (Unesp, 2009, trad. Irineu Bicudo), no movimento VIII, com indicação do livro I; os Fastos, de Ovídio (Autêntica, 2015, bilíngue, trad. Márcio Meirelles Gouvêa Júnior), no movimento IX, depois das Metamorfoses. Correção: Textos hipocráticos também se vende novo (a partir de R$ 80,61), não só usado. A lacuna greco-roman--g03 passou a accepted."}
  source: greco-roman--g03
  question: "Quais obras trazem para Greco-Romana a ciência e a medicina antigas, e a religião romana?"
  why: "Você pediu sugestões. Procurei fontes antigas com tradução brasileira de tradutor conhecido. Para a medicina e para a religião romana há uma boa em cada área; para a matemática, a tradução completa de Euclides. Os estudos modernos que amarram tudo, como o de G. E. R. Lloyd sobre a ciência grega, não têm tradução em português que eu tenha achado."
  options:
    - {key: A, recommended: true, title: "Textos hipocráticos e os Fastos de Ovídio", effect: "Textos hipocráticos: o doente, o médico e a doença (Fiocruz, 2005, trad. Henrique Cairus e Wilson Ribeiro Jr.) entra no movimento V, junto da passagem do mito ao pensamento racional. Os Fastos, de Ovídio (Autêntica, 2015, bilíngue, trad. Márcio Meirelles Gouvêa Júnior), entram no movimento sobre Roma."}
    - {key: B, title: "A opção A e também Euclides", effect: "Entram também Os Elementos, de Euclides (Unesp, 2009, trad. Irineu Bicudo, completa), com indicação de ler o livro I."}
    - {key: C, title: "Só os Textos hipocráticos", effect: "A medicina entra; a religião romana continua sem obra."}
    - {key: D, title: "Agora não", effect: "Nada muda."}
  recommendation: "os textos hipocráticos são o lugar em que a passagem do mito à razão fica mais clara: o tratado Da doença sagrada argumenta que a epilepsia não vem dos deuses, mas de causas naturais. Os Fastos percorrem o calendário romano, festa por festa, e são a melhor fonte antiga para a religião praticada em Roma. As duas edições são acadêmicas, com introdução e notas. Os Textos hipocráticos só se acham usados, por cerca de R$ 70; o texto está também na SciELO Livros, o que permite lê-lo antes de comprar. Euclides é um grande livro, mas pesa: só vale se você quiser a matemática como passo da coleção."
  candidates:
    - {title: "Textos hipocráticos: o doente, o médico e a doença", author: "Hipócrates e escola · séc. V–IV a.C.", verdict: resolve, best: true, adds: "Juramento, Da natureza do homem, Da doença sagrada, Ares, águas e lugares e os textos sobre o médico: a medicina grega separando-se da religião.", facts: ["+Fiocruz 2005, trad. Henrique Cairus e Wilson Ribeiro Jr.", "+Introdução e notas", "-Só usado, cerca de R$ 70", "Texto também na SciELO Livros, para ler antes de comprar"]}
    - {title: "Fastos", author: "Ovídio · c. 8 d.C.", verdict: resolve, best: true, adds: "O calendário religioso romano em verso: cada festa, seus ritos e as lendas que os explicam.", facts: ["+Autêntica 2015, bilíngue", "+Trad. Márcio Meirelles Gouvêa Júnior", "Em verso"]}
    - {title: "Os Elementos", author: "Euclides · c. 300 a.C.", verdict: complementa, adds: "A geometria grega como sistema de definições, postulados e demonstrações; o modelo de prova por séculos.", facts: ["+Unesp 2009, trad. Irineu Bicudo, completa e direta do grego", "-Longo e técnico"]}
    - {title: "A Natureza dos Deuses", author: "Cícero · 45 a.C.", verdict: complementa, adds: "Um epicurista, um estoico e um cético discutem se os deuses existem e cuidam dos homens.", facts: ["+Edufu 2016, bilíngue, trad. Bruno Fregni Bassetto", "-Completude não confirmada", "-Mais filosofia que religião praticada"]}
    - {title: "Early Greek Science: Thales to Aristotle", author: "G. E. R. Lloyd · 1970", verdict: outra, adds: "O estudo curto e clássico da ciência grega, dos pré-socráticos a Aristóteles.", facts: ["-Só em inglês", "Livro de estudo, não fonte"]}

