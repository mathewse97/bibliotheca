    - {title: "Sobre a Democracia", author: "Robert Dahl · 1998", adds: "Hoje na coleção. Introdução curta: o que é democracia, por que preferi-la e que instituições ela exige.", facts: ["Leve", "★ sua"]}

- id: d-pol-adler-distopias
  kind: colecao
  collections: [political-thought]
  priority: baixa
  state: decidida
  decided: {date: 2026-10-31, choice: "Opção B — Nós e A Fazenda dos Animais viram leitura complementar.", note: "Aplicado. Os dois continuam no lugar, marcados como complementares; 1984, Admirável Mundo Novo e Os Demônios seguem como passos da coleção."}
  source: review/political-thought.md §10
  question: "Manter os cinco romances sobre totalitarismo como passos obrigatórios de Política?"
  why: "A parte da coleção sobre poder, partidos e ideologia tem 16 obras, quase um terço do total, e cinco são romances sobre regimes totalitários. Cada um mostra um modo de controle, mas há sobreposição: os dois de George Orwell tratam da mesma revolução traída, e *Nós*, de Yevgeny Zamiátin, é a fonte de ideias que *Admirável Mundo Novo* e *1984* retomaram. Três deles têm a sua ★: *Admirável Mundo Novo*, *A Fazenda dos Animais* e *1984*."
  options:
    - {key: A, title: "Manter os cinco como estão", effect: "Nada muda."}
    - {key: B, recommended: true, title: "*Nós* e *A Fazenda dos Animais* viram leitura complementar", effect: "Os dois ficam na coleção, marcados como opcionais. A sequência principal fica com *Admirável Mundo Novo*, de Aldous Huxley, *O Zero e o Infinito*, de Arthur Koestler, e *1984*, de George Orwell."}
    - {key: C, title: "Só *Nós*, de Yevgeny Zamiátin, vira leitura complementar", effect: "Os quatro outros continuam como passos da coleção."}
    - {key: D, title: "Agora não", effect: "O cartão fica aqui para depois."}
  recommendation: "os três que ficam centrais mostram três modos diferentes de controle: pelo prazer (*Admirável Mundo Novo*), pela confissão forçada (*O Zero e o Infinito*) e pelo terror com a reescrita da verdade (*1984*). Os outros dois continuam ao alcance, sem pesar na sequência."
  candidates:
    - {title: "Nós", author: "Yevgeny Zamiátin · 1921", adds: "O primeiro romance do gênero: um Estado que regula a vida matematicamente e apaga o indivíduo.", facts: ["-Ideias retomadas pelos outros dois"]}
    - {title: "Admirável Mundo Novo", author: "Aldous Huxley · 1932", adds: "Controle pelo prazer, pelo consumo e pelo condicionamento desde o nascimento.", facts: ["★ sua", "+Modo de controle próprio"]}
    - {title: "O Zero e o Infinito", author: "Arthur Koestler · 1940", adds: "Um velho revolucionário, preso nos expurgos de Stálin, acaba confessando crimes que não cometeu.", facts: ["+Único visto de dentro do partido"]}
    - {title: "A Fazenda dos Animais", author: "George Orwell · 1945", adds: "Fábula: os animais expulsam o dono e a revolução degenera em tirania dos porcos.", facts: ["★ sua", "-Mesmo tema de 1984, em forma curta"]}
    - {title: "1984", author: "George Orwell · 1949", adds: "Vigilância total, terror e reescrita do passado pelo partido.", facts: ["★ sua", "+Modo de controle próprio"]}

- id: d-pol-adler-marxismo
  kind: colecao
  collections: [political-thought]
  priority: media
  state: decidida
  decided: {date: 2026-10-31, choice: "Opção A — incluir O Capital (livro I) e tirar O Homem Unidimensional, de Herbert Marcuse; apagar da biblioteca todos os registros de O Homem Unidimensional.", note: "Aplicado. O Capital, livro I, entrou no movimento VI depois de O 18 de Brumário, com estrela e com indicação das partes centrais; edição Boitempo, trad. Rubens Enderle, sobre a MEGA-2. O Homem Unidimensional foi apagado: a obra, a edição da Edipro, a capa, o autor, o tradutor e o autor da introdução, e as ligações com A Ideologia Alemã e Admirável Mundo Novo. A lacuna political-thought--g04 continua fechada por Lukács. O nome continua só no histórico de decisões, nas revisões e nas lacunas."}
  source: review/political-thought.md §10
  question: "Trazer *O Capital*, de Karl Marx, para Política, e no lugar de qual obra?"
  why: "A coleção tem três obras exigentes de pensadores do século XX ligados à tradição marxista: Georg Lukács, Herbert Marcuse e Jürgen Habermas. Juntas pesam mais que o próprio Marx, de quem a coleção tem só textos curtos: o *Manifesto Comunista*, *O 18 de Brumário* e a primeira parte de *A Ideologia Alemã*. Falta a obra principal dele, *O Capital*, em que Marx explica como, para ele, o capitalismo funciona e explora o trabalho."
  options:
    - {key: A, recommended: true, title: "Incluir *O Capital* (livro I) e tirar *O Homem Unidimensional*, de Herbert Marcuse", effect: "*O Capital* entra com indicação das partes centrais; *O Homem Unidimensional* sai da coleção. Os livros de Georg Lukács e Jürgen Habermas ficam."}
    - {key: B, title: "Incluir *O Capital* sem tirar nenhum", effect: "A coleção ganha mais uma obra longa e exigente."}
    - {key: C, title: "Manter como está", effect: "Nada muda; Marx continua representado só pelos textos curtos."}
    - {key: D, title: "Agora não", effect: "O cartão fica aqui para depois."}
  recommendation: "pelo critério de Adler, a obra principal de um autor vem antes dos herdeiros dele. Dos três, *O Homem Unidimensional* é o mais preso à década de 1960 e o que mais depende de *História e Consciência de Classe*. Este explica a ideia que os outros usam, e *Mudança Estrutural da Esfera Pública* trata de outro assunto: a democracia e o debate público."
  candidates:
    - {title: "O Capital, livro I", author: "Karl Marx · 1867", verdict: resolve, best: true, adds: "A obra principal de Marx: mercadoria, trabalho, mais-valia (o valor que o trabalhador produz além do que recebe) e acumulação.", facts: ["Longo; leitura parcial indicada", "-Edição a escolher"]}
    - {title: "História e Consciência de Classe", author: "Georg Lukács · 1923", adds: "Fica. Como o capitalismo faz relações entre pessoas parecerem relações entre coisas; a ponte entre Marx e os críticos da cultura.", facts: ["+Ideia usada pelos outros dois"]}
    - {title: "O Homem Unidimensional", author: "Herbert Marcuse · 1964", adds: "Sairia. Como a sociedade de consumo absorve a contestação e cria as necessidades que satisfaz.", facts: ["-Mais datado", "-Depende de Lukács"]}
    - {title: "Mudança Estrutural da Esfera Pública", author: "Jürgen Habermas · 1962", adds: "Fica. Como surgiu o debate público argumentado (cafés, imprensa, associações) e como decaiu com os meios de massa.", facts: ["+Trata da democracia"]}

