  question: "Incluir em Cultura as *Notas para a Definição de Cultura*, de T. S. Eliot?"
  why: "A pergunta da coleção é o que é a cultura e como ela se transmite, se degrada ou se perde. O livro clássico sobre exatamente isso é o do poeta T. S. Eliot, de 1948: a cultura como modo de vida inteiro, transmitido pela família, pelas classes e pelas regiões, e o que acontece quando essa transmissão se rompe. Os diagnósticos que a coleção traz depois (Roger Scruton, Mario Vargas Llosa) dialogam com ele."
  options:
    - {key: A, recommended: true, title: "Incluir as *Notas para a Definição de Cultura*", effect: "Entra na primeira parte da coleção, a que pergunta o que é a cultura. Eu pesquiso a edição em português."}
    - {key: B, title: "Agora não", effect: "Nada muda; o cartão fica aqui para depois."}
    - {key: C, title: "Descartar", effect: "A questão é arquivada."}
  recommendation: "é o livro que responde de frente à pergunta da coleção, curto e escrito por um dos grandes poetas do século XX. Roger Scruton escreveu muito sobre Eliot e retoma as suas ideias."
  candidates:
    - {title: "Notas para a Definição de Cultura", author: "T. S. Eliot · 1948", verdict: resolve, best: true, adds: "O que é cultura, como ela se transmite e por que não pode ser planejada.", facts: ["Curto", "+Há tradução em português"]}

