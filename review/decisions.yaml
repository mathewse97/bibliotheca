  options:
    - {key: A, recommended: true, title: "Tirar da coleção", effect: "Sai de Política. O livro continua registrado na biblioteca, sem coleção."}
    - {key: B, title: "Manter como leitura complementar", effect: "Fica onde está, marcado como opcional."}
    - {key: C, title: "Manter como está", effect: "Nada muda."}
    - {key: D, title: "Agora não", effect: "O cartão fica aqui para depois."}
