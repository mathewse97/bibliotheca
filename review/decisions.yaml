- id: d-pol-shakespeare
  kind: obra
  collections: [political-thought]
  priority: media
  state: decidida
  decided: {date: 2026-09-28, choice: "As DUAS caixas da Nova Fronteira — a de 2017 e a de 2022.", note: "Aplicado. Três peças entraram na biblioteca e em Política, no movimento IV, por período: Ricardo II e Júlio César pela caixa de 2017, Coriolano pela de 2022. As duas publicações estão registradas com ISBN, aparato e link de compra conferido por correspondência de ISBN. Shakespeare, Barbara Heliodora e Liana de Camargo Leão entraram no arquivo de pessoas. RESSALVA REGISTRADA: as duas caixas somam 24 peças, e não as 38 do teatro completo — se a intenção era ter Shakespeare inteiro, faltam 14, e quem as traz é o Teatro Completo da Nova Aguilar."}
  question: "Qual caixa de Shakespeare entra na biblioteca — e, com ela, quais peças entram em Política?"
  why: "É o único ponto desta fila que custa dinheiro. As peças que a coleção precisa são Ricardo II, que encena a destruição da legitimidade, e Júlio César, o tiranicídio preventivo. Coriolano, sobre representação popular, é a terceira da fila."
  update: "PESQUISA DE EDIÇÃO FEITA em 28/09, nas páginas das editoras. O achado que decide: as três opções têm a MESMA tradutora, Barbara Heliodora. Tradução não diferencia nada aqui — o que diferencia é quais peças cada caixa contém, e as duas caixas da Nova Fronteira são seleções que se complementam sem se sobrepor."
  options:
    - {key: A, recommended: true, title: "Nova Fronteira, Grandes obras de Shakespeare (2017)", effect: "Entram Ricardo II e Júlio César — exatamente as duas de que a coleção precisa —, mais Ricardo III e Antônio e Cleópatra no mesmo volume de peças históricas. Doze peças em três volumes de capa dura, com notas e textos complementares organizados por Liana de Camargo Leão. Coriolano NÃO está nesta caixa."}
    - {key: B, title: "Nova Aguilar, Teatro Completo (2016)", effect: "As 38 peças, incluindo as três, em três volumes de 4.440 páginas em papel bíblia. É a opção completista: resolve Shakespeare na biblioteca inteira de uma vez, e não só para esta coleção. Bem mais caro e bem mais pesado."}
    - {key: C, title: "As duas caixas da Nova Fronteira", effect: "A de 2017 traz Ricardo II e Júlio César; a de 2022 traz Coriolano. Juntas dão as três peças e mais 21, por menos que a obra completa — mas com 14 peças a menos que ela."}
    - {key: D, title: "Agora não", effect: "A pesquisa fica registrada e nenhuma peça de Shakespeare entra."}
  recommendation: "a A. A coleção precisa de duas peças e a caixa de 2017 tem as duas, na mesma tradução de qualquer alternativa, em capa dura e com aparato. Comprar a obra completa para resolver duas participações é pagar por 36 peças que nenhuma coleção sua reivindica hoje — e a regra do projeto é explícita em não deixar disponibilidade e volume hierarquizarem necessidade. A B é a escolha certa por outra razão, não por esta: se você quiser Shakespeare inteiro na biblioteca como fim em si, aí ela ganha, e a questão deixa de ser de Política."
