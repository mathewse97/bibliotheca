- id: d-edu-ciencia-aprendizagem
  kind: colecao
  collections: [education]
  priority: alta
  state: decidida
  decided: {date: 2026-10-05, choice: "Opção A — abrir a coleção para a ciência da aprendizagem.", note: "Aplicado. Educação ganhou o critério dos meios sustentados por evidência empírica, a região ciencia-da-aprendizagem no mapa e o movimento VIII no fim da sequência: Dehaene primeiro, depois Brown, Roediger e McDaniel. A proposta education--sp01 está aprovada e a linhagem registrada na coleção. Continua pendente a classificação work_type das duas obras (e de Hirsch), que é decisão separada."}
  source: education--sp01
  question: "Educação deve admitir obras sobre COMO se aprende, e não só sobre o que a educação deve formar?"
  why: "Você pediu duas obras novas — Fixe o Conhecimento e É assim que aprendemos. As duas estão registradas na biblioteca, com edição, ISBN e link de compra. Mas nenhuma delas tem lugar defensável em Educação hoje: a pergunta da coleção fala de fins e meios, e os critérios só admitem meios quando vêm amarrados a uma tese sobre fins. Fixe o Conhecimento não tem tese sobre fins nenhuma — tem práticas de estudo apoiadas em experimentos. Nenhum dos sete movimentos a recebe sem deixar de ser verdadeiro. Pela regra do projeto, isso é sinal de escopo, e escopo é sua decisão."
  options:
    - {key: A, recommended: true, title: "Abrir a coleção para a ciência da aprendizagem", effect: "Acrescenta um critério — meios sustentados por evidência empírica entram, mesmo sem tese sobre fins —, abre uma região própria para isso no mapa de assuntos da coleção e cria um movimento novo no fim da sequência com as duas obras, Dehaene antes de Brown, que é a ordem que você sugeriu. A pergunta, sua ordem e os sete movimentos atuais não mudam."}
    - {key: B, title: "As duas entram no movimento II, sem mexer em critério nenhum", effect: "Caminho mais curto: elas vão para as posições em disputa, ao lado de Hirsch, que também argumenta por ciência cognitiva. Custo: o cabeçalho do movimento II enumera doutrinas filosóficas e passaria a ser falso sobre metade dos seus membros — e o mapa de escopo continuaria sem região para elas, de modo que a análise de cobertura seguiria cega a essa parte da coleção."}
    - {key: C, title: "Só Dehaene entra; Fixe o Conhecimento fica sem coleção", effect: "Respeita a diferença real entre as duas: Dehaene chega a afirmações sobre como ensinar, o Brown fica no nível do estudante. Dehaene entraria no movimento II. Fixe o Conhecimento continua na biblioteca, pesquisado e comprável, sem participar de coleção — o mesmo estado em que Weber ficou até Educação ter critérios."}
    - {key: D, title: "As duas ficam na biblioteca, sem coleção, por agora", effect: "Nada muda em Educação. As duas obras existem, com edição e link, e a questão volta quando houver mais obras do gênero ou quando você quiser decidir se isso é uma coleção própria."}
  recommendation: "a A, e a razão é que o problema é real e as outras três o escondem. A pergunta da sua coleção já diz 'por que meios' — o território está reivindicado desde a importação; o que faltou foi desenhar a região e escrever o critério. A B resolve a colocação e deixa o defeito: um cabeçalho falso e um mapa que não vê duas obras. A C é intelectualmente a mais fina das alternativas, e eu a escolheria se a dúvida fosse só sobre o Brown — mas ela deixa na biblioteca uma obra que você quer ler e usar, fora de qualquer coleção, por uma distinção de grau. A D é legítima e não custa nada, se você preferir decidir isto com mais obras na mão. Uma ressalva contra a minha própria recomendação: o critério novo abre a coleção para um gênero com muita divulgação fraca, e a única proteção contra isso é analisar necessidade obra a obra — não o critério."
  composition: true
  composition_note: "As 14 obras de hoje; nenhuma estuda empiricamente como se aprende."
  signals:
    - "A região psicologia-do-desenvolvimento está no mapa desde a importação, declarada thin, e nunca teve uma obra. A nota dela nomeia estágios e mediação — Piaget e Vigotski —, não ciência da memória: não é o lugar destas duas."
    - "Hirsch entrou em 2026-09-23 com argumento de ciência cognitiva, mas para defender uma posição de currículo. É o que mais se aproxima no acervo, e ainda assim não é o mesmo gênero."

- id: d-sob-medicina
  kind: obra
  collections: [survival-self-sufficiency]
  priority: media
  state: decidida
  decided: {date: 2026-10-10, choice: "A — trocar Werner por Alton, The Survival Medicine Handbook (4ª ed., 2021); incluir Schlaad, Medicina em áreas remotas no Brasil (Manole, 2019); manter Dickson.", note: "Decisão do Mathews. Aplicado: Werner saiu de Sobrevivência (registrado em excluded; obra e publicações continuam no acervo); Alton entrou no lugar dele e Schlaad depois do PHTLS (posição de Claude, a confirmar), cada um com obra, edição, capa e link de compra; d-ed-werner arquivado."}
  source: review/survival-self-sufficiency.md §9
  question: "Trocar *Onde não há médico* por um manual de medicina de sobrevivência mais atual?"
  why: "Você pediu para pesquisar se há obras melhores sobre os mesmos temas. Werner e Dickson foram escritos nos anos 1970–80 para agentes de saúde em vilas pobres, não para quem fica sem sistema de saúde por tempo indeterminado. Uma avaliação sistemática de Werner (Babu e Eisenberg) achou 'problemas consideráveis' nas recomendações de diagnóstico e tratamento. A edição brasileira de cada um está décadas desatualizada. A pesquisa está em review/survival-self-sufficiency.md §9."
  update: "Este cartão vem antes dos cartões d-ed-werner e d-ed-dickson: se Werner sair, d-ed-werner é arquivado."
  options:
    - {key: A, recommended: true, title: "Trocar Werner por Alton e incluir Schlaad", effect: "Sai *Onde não há médico*. Entra *The Survival Medicine Handbook*, 4ª ed. (2021), como manual principal, e *Medicina em áreas remotas no Brasil* (Manole, 2019) como referência em português para o contexto brasileiro. Dickson fica, na edição inglesa revista em 2018. Eu registro obras e edições."}
    - {key: B, title: "Só trocar Werner por Alton", effect: "Sai Werner, entra Alton. Nenhuma obra brasileira entra. Dickson fica."}
    - {key: C, title: "Manter Werner e Dickson e incluir Alton", effect: "Nada sai; Alton entra como complemento. As escolhas de edição de Werner e Dickson continuam valendo."}
    - {key: D, title: "Nada muda", effect: "A coleção fica como está; as edições de Werner e Dickson continuam em aberto."}
  recommendation: "Alton responde exatamente à pergunta da coleção: o livro parte do princípio de que hospital e médico não estão disponíveis por tempo indefinido, e cobre o que Werner cobre (infecções, doenças comuns, medicamentos, parto, dentes) e mais: cuidado de doenças crônicas, procedimentos e plantas medicinais. É de 2021, escrito por um médico e uma enfermeira de prática avançada, com cerca de 700 páginas. Schlaad entra porque nenhum dos manuais estrangeiros trata do que é específico do Brasil, como animais peçonhentos e doenças tropicais. Dickson fica porque não achei nada melhor sobre dentes: a única alternativa específica, o manual de Met Clark (2011), tem 80 páginas."
  composition: true
  composition_note: "Medicina e socorro hoje: Dickson, Werner, Silva e Conforto (primeiros socorros), PHTLS (trauma pré-hospitalar), Hoffmann (ervas). Os dois últimos supõem que haverá atendimento depois; só Werner e Dickson tratam do cuidado continuado sem médico."
  candidates:
    - {title: "The Survival Medicine Handbook (4ª ed.)", author: "Joseph Alton e Amy Alton · 2021", verdict: resolve, best: true, adds: "O manual que assume que a ajuda não vem: trauma, primeiros socorros, doenças crônicas, infecções, procedimentos, dentes, plantas medicinais. Mais de 300 tópicos e 300 ilustrações.", facts: ["694 p., Doom and Bloom", "+Atualizado em 2021", "-Só em inglês", "Importado"]}
    - {title: "Medicina em áreas remotas no Brasil", author: "Juliana e Sascha Schlaad (org.) · 2019", verdict: complementa, adds: "O primeiro livro brasileiro de medicina de expedição e áreas remotas: prevenção, diagnóstico e tratamento das afecções mais comuns longe dos centros médicos.", facts: ["544 p., Manole", "+Português, contexto brasileiro", "-Escrito para profissionais de saúde; supõe evacuação", "~R$ 152"]}
    - {title: "The Survival Doctor's Complete Handbook", author: "James Hubbard · 2016", verdict: resolve, adds: "Mesma proposta de Alton, mais curto, por médico de família com 30 anos de prática.", facts: ["288 p., Reader's Digest/Trusted Media", "-Menos completo que Alton", "-Só em inglês"]}
    - {title: "Medicina de Emergência em Áreas Remotas", author: "Paulo Willian · 2025", verdict: complementa, adds: "Protocolos de emergência adaptados aos biomas brasileiros, em 46 capítulos.", facts: ["332 p., Dialética, capa dura", "+Português, recente", "-Para profissionais; foco em emergência, não em cuidado continuado"]}
    - {title: "NOLS Wilderness Medicine (7ª ed.) e Medicine for the Outdoors (7ª ed.)", author: "Schimelpfenig, 2021 · Auerbach e outros, 2023", verdict: outra, adds: "Excelentes, mas são primeiros socorros para estabilizar até a evacuação — o terreno que Silva e Conforto e o PHTLS já cobrem na coleção.", facts: ["Inglês", "NOLS tem edição em espanhol (2016)"]}
    - {title: "Emergency Dentistry Handbook", author: "Met Clark · 2011", verdict: outra, adds: "Odontologia em ambientes austeros, mas tem só 80 páginas: não substitui Dickson.", facts: ["Paladin Press"]}

- id: d-greco-adler-lucrecio
  kind: obra
  collections: [greco-roman]
  priority: media
  state: decidir
  source: review/greco-roman.md §9
  question: "Incluir em Greco-Romana o poema de Lucrécio sobre a natureza das coisas?"
  why: "O epicurismo, a filosofia que busca a felicidade na ausência de dor e de medo, está na coleção só por uma carta curta de Epicuro. Falta a exposição completa: *Da Natureza das Coisas*, poema em latim de Tito Lucrécio Caro (século I a.C.). Ele explica o mundo como átomos em movimento, sem intervenção dos deuses, para livrar o homem do medo da morte. É uma das obras-primas da poesia latina e a principal fonte do epicurismo que chegou até nós. Sem ele, a filosofia romana da coleção é só estoica."
  options:
    - {key: A, recommended: true, title: "Incluir Lucrécio, *Da Natureza das Coisas*", effect: "Entra na parte de filosofia moral romana, antes de Cícero, que escreveu depois dele. Eu pesquiso a melhor edição em português."}
    - {key: B, title: "Agora não", effect: "Nada muda; o cartão fica aqui para depois."}
    - {key: C, title: "Descartar", effect: "A filosofia romana da coleção fica só com os estoicos e Cícero; a questão é arquivada."}
  recommendation: "é o caso que o critério de Adler mais claramente pede: um grande livro, dos que nenhuma leitura esgota, e expõe por inteiro uma posição que nenhuma outra obra da coleção expõe. A carta de Epicuro fica como resumo, e Lucrécio como a obra."
  candidates:
    - {title: "Da Natureza das Coisas", author: "Tito Lucrécio Caro · c. 55 a.C.", verdict: resolve, best: true, adds: "O epicurismo inteiro, em poema: átomos, a alma mortal, por que não temer a morte nem os deuses.", facts: ["Parte de filosofia romana, antes de Cícero", "-Edição em português a verificar"]}

