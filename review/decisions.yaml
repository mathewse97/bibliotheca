- id: d-pol-adler-aquino
  kind: colecao
  collections: [political-thought]
  priority: media
  state: decidida
  decided: {date: 2026-10-31, choice: "Opção B — manter os dois.", note: "Aplicado. O Tratado da Lei (Suma Teológica I-II, q. 90–97) entrou logo antes de Do Governo dos Príncipes, com estrela. Está no mesmo volume da Vozes já escolhido (Escritos Políticos, trad. Francisco Benjamin de Souza Neto), sem compra a mais."}
  source: review/political-thought.md §10
  question: "Trocar a obra de Tomás de Aquino em Política pelo *Tratado da Lei*?"
  why: "Hoje está *Do Governo dos Príncipes* (c. 1267), de Tomás de Aquino, teólogo e filósofo do século XIII: um texto curto, escrito como conselho a um rei, que defende a monarquia voltada ao bem comum. Aquino o deixou inacabado, e outro autor o completou. Você incluiu Aquino por lei natural, autoridade, bem comum e legitimidade. Mas a lei natural, a ideia de uma lei acima das leis humanas, está em outro texto: o *Tratado da Lei*, um trecho curto da *Suma Teológica*, a obra principal dele."
  options:
    - {key: A, recommended: true, title: "Trocar pelo *Tratado da Lei*", effect: "O *Tratado da Lei* entra no mesmo lugar da coleção, e *Do Governo dos Príncipes* sai. Eu pesquiso a edição em português."}
    - {key: B, title: "Manter os dois", effect: "O *Tratado da Lei* entra logo antes; *Do Governo dos Príncipes* fica como leitura curta sobre a monarquia."}
    - {key: C, title: "Agora não", effect: "Nada muda; o cartão fica aqui para depois."}
  recommendation: "é o texto de Aquino que a tradição política cita até hoje, e o único que responde de frente à pergunta da coleção: quando uma lei injusta deixa de obrigar. É também o problema que *Antígona*, de Sófocles, já na coleção, põe em cena."
  candidates:
    - {title: "Tratado da Lei (Suma Teológica I-II, questões 90 a 97)", author: "Tomás de Aquino · c. 1271", verdict: resolve, best: true, adds: "O que é lei, os quatro tipos de lei (eterna, natural, humana e divina) e por que uma lei humana injusta não é verdadeira lei.", facts: ["Curto", "-Edição em português a verificar"]}
    - {title: "Do Governo dos Príncipes", author: "Tomás de Aquino · c. 1267", adds: "Hoje na coleção. Conselho a um rei sobre a melhor forma de governo e sobre a tirania.", facts: ["Curto", "-Inacabado; completado por outro autor"]}

