- id: d-greco-adler-campbell
  kind: colecao
  collections: [greco-roman]
  priority: baixa
  state: decidida
  decided: {date: 2026-10-30, choice: "Opção A — tirar de Greco-Romana.", note: "Aplicado. Campbell saiu de Greco-Romana (participação, caminho cronológico e a tensão com Vernant) e continua em Religião."}
  source: review/greco-roman.md §9
  question: "Tirar *O Herói de Mil Faces*, de Joseph Campbell, de Greco-Romana? Ele continua em Religião."
  why: "Livro de 1949 em que Joseph Campbell, estudioso americano de mitologia, propõe que os mitos heroicos de todas as culturas seguem um mesmo roteiro, a jornada do herói: partida, provas e retorno. Influenciou muito o cinema, mas os estudiosos de mitologia o criticam por forçar mitos muito diferentes num molde só. Não trata do mundo greco-romano em particular, e a coleção já tem quem estude o mito grego por dentro: Jean-Pierre Vernant e Paul Veyne. O livro também está na coleção Religião, onde a comparação entre culturas é o próprio assunto."
  options:
    - {key: A, recommended: true, title: "Tirar de Greco-Romana", effect: "Sai desta coleção e continua em Religião. Nada sai da biblioteca."}
    - {key: B, title: "Manter como leitura complementar", effect: "Fica nas duas coleções; aqui, marcado como opcional."}
    - {key: C, title: "Manter como está", effect: "Nada muda."}
    - {key: D, title: "Agora não", effect: "O cartão fica aqui para depois."}
  recommendation: "a pergunta de Greco-Romana é como a cultura grega se formou e foi herdada. Campbell responde a outra pergunta, sobre o que todos os mitos teriam em comum, e essa pergunta já tem lugar em Religião."

