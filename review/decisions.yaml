- id: d-pol-literatura
  kind: obra
  collections: [political-thought]
  priority: media
  state: decidida
  decided: {date: 2026-09-27, choice: "Opção B, ampliada por você — Antígona e a Oresteia como participações novas, mais Shakespeare, sem limite de uma peça só.", note: "Você disse: não precisa ser só uma de Shakespeare. Então eu pesquiso Ricardo II, Júlio César e Coriolano e apresento a comparação das três antes de você escolher quantas e quais entram. Antígona e a Oresteia não dependem dessa escolha e seguem para pesquisa de posição."}
  question: "Que literatura entra em Política junto dos argumentos que ela encena?"
  why: "A coleção discute legitimidade, tiranicídio e retórica só por tratado. A literatura que ela tem trata de outra coisa — ideologia do século XX vivida por dentro. Falta a literatura que encena o problema anterior: por que obedecer, e quando matar o governante deixa de ser crime."
  update: "Aberta depois da sua decisão de 2026-09-27 (cartão `d-reg-literatura`): literatura passa a ser colocada dentro do movimento que ela complementa, e não agrupada por gênero. Duas das candidatas já estão na biblioteca, vindas de Greco-Romana — entrariam como participação, sem compra."
  options:
    - {key: A, recommended: true, title: "Pesquisar Antígona e a Oresteia primeiro", effect: "As duas já são suas. Eu estabeleço forma, gênero, data e tradição de cada uma e proponho a posição — Antígona junto de Aquino e Hobbes, a Oresteia junto de Montesquieu. Nenhuma compra."}
    - {key: B, title: "Antígona, Oresteia e um Shakespeare", effect: "Acrescenta uma compra. Eu pesquiso qual das três peças romanas serve melhor e te apresento a comparação antes de você escolher."}
    - {key: C, title: "Só o Júlio César, que originou a conversa", effect: "Uma compra, e o problema do tiranicídio entra. Fica sem a Antígona, que é o caso mais forte e já é sua."}
    - {key: D, title: "Agora não", effect: "Nada muda. O movimento X continua como está até a redistribuição dele ser decidida."}
  recommendation: "Antígona é o único texto literário que a tradição inteira do direito natural — Aquino, Hobbes, Locke — cita como o caso. Ela já é sua, está em Greco-Romana, e entraria em Política sem custo nenhum. Júlio César é excelente e foi o que abriu esta questão, mas é uma compra para um problema que a coleção já toca por Maquiavel."
  composition: true
  composition_note: "Das 6 obras literárias atuais, 6 são romances dos séculos XIX–XX sobre ideologia. Nenhuma é anterior a 1871."
  candidates:
    - {title: "Antígona", author: "Sófocles · séc. V a.C.", verdict: resolve, best: true, adds: "Lei da cidade contra lei não escrita — o caso que a tradição do direito natural cita há dois mil anos. Iria junto de Aquino e Hobbes.", facts: ["Já na biblioteca, em Greco-Romana", "+Sem compra"]}
    - {title: "Oresteia", author: "Ésquilo · séc. V a.C.", verdict: resolve, adds: "Termina fundando um tribunal: é o relato literário da passagem da vingança privada à justiça institucional.", facts: ["Já na biblioteca, em Greco-Romana", "+Sem compra"]}
    - {title: "Ricardo II", author: "Shakespeare · c. 1595", verdict: resolve, adds: "A legitimidade por direito divino destruída em cena: o rei ungido deposto, e o que sobra da autoridade depois disso.", facts: ["Compra nova", "Complementaria os movimentos III e IV"]}
    - {title: "Júlio César", author: "Shakespeare · c. 1599", verdict: resolve, adds: "Tiranicídio preventivo e a retórica como instrumento de poder — o discurso de Antônio é o caso de fabricação de consenso. Vem da Vida de César de Plutarco, que já é sua.", facts: ["Compra nova", "Relação com a Vida de César a registrar"]}
    - {title: "Coriolano", author: "Shakespeare · c. 1608", verdict: complementa, adds: "Plebe contra patrícios e o problema do demagogo. Excelente, mas um terceiro Shakespeare desequilibraria a coleção.", facts: ["Compra nova"]}
    - {title: "Viagens de Gulliver", author: "Swift · 1726", verdict: outra, adds: "Sátira institucional de primeira linha, mas responde a uma pergunta mais difusa que as cinco acima. Candidata de fronteira, não recomendação."}

- id: d-pol-shakespeare
  kind: obra
  collections: [political-thought]
  priority: media
  state: decidida
  decided: {date: 2026-09-28, choice: "As DUAS caixas da Nova Fronteira — a de 2017 e a de 2022.", note: "Aplicado. Três peças entraram na biblioteca e em Política, no movimento IV, por período: Ricardo II e Júlio César pela caixa de 2017, Coriolano pela de 2022. As duas publicações estão registradas com ISBN, aparato e link de compra conferido por correspondência de ISBN. Shakespeare, Barbara Heliodora e Liana de Camargo Leão entraram no arquivo de pessoas. RESSALVA REGISTRADA: as duas caixas somam 24 peças, e não as 38 do teatro completo — se a intenção era ter Shakespeare inteiro, faltam 14, e quem as traz é o Teatro Completo da Nova Aguilar."}
  question: "Qual caixa de Shakespeare entra na biblioteca — e, com ela, quais peças entram em Política?"
  why: "É o único ponto desta fila que custa dinheiro. As peças que a coleção precisa são Ricardo II, que encena a destruição da legitimidade, e Júlio César, o tiranicídio preventivo. Coriolano, sobre representação popular, é a terceira da fila."
  update: "PESQUISA DE EDIÇÃO FEITA em 28/09, nas páginas das editoras. O achado que decide: as três opções têm a MESMA tradutora, Barbara Heliodora. Tradução não diferencia nada aqui — o que diferencia é quais peças cada caixa contém, e as duas caixas da Nova Fronteira são seleções que se complementam sem se sobrepor."
  options:
    - {key: A, recommended: true, title: "Nova Fronteira, Grandes obras de Shakespeare (2017)", effect: "Entram Ricardo II e Júlio César — exatamente as duas de que a coleção precisa —, mais Ricardo III e Antônio e Cleópatra no mesmo volume de peças históricas. Doze peças em três volumes de capa dura, com notas e textos complementares organizados por Liana de Camargo Leão. Coriolano NÃO está nesta caixa."}
    - {key: B, title: "Nova Aguilar, Teatro Completo (2016)", effect: "As 38 peças, incluindo as três, em três volumes de 4.440 páginas em papel bíblia. É a opção completista: resolve Shakespeare na biblioteca inteira de uma vez, e não só para esta coleção. Bem mais caro e bem mais pesado."}
    - {key: C, title: "As duas caixas da Nova Fronteira", effect: "A de 2017 traz Ricardo II e Júlio César; a de 2022 traz Coriolano. Juntas dão as três peças e mais 21, por menos que a obra completa — mas com 14 peças a menos que ela."}
    - {key: D, title: "Agora não", effect: "A pesquisa fica registrada e nenhuma peça de Shakespeare entra."}
  recommendation: "a A. A coleção precisa de duas peças e a caixa de 2017 tem as duas, na mesma tradução de qualquer alternativa, em capa dura e com aparato. Comprar a obra completa para resolver duas participações é pagar por 36 peças que nenhuma coleção sua reivindica hoje — e a regra do projeto é explícita em não deixar disponibilidade e volume hierarquizarem necessidade. A B é a escolha certa por outra razão, não por esta: se você quiser Shakespeare inteiro na biblioteca como fim em si, aí ela ganha, e a questão deixa de ser de Política."
  editions:
    - {key: A, label: "Nova Fronteira · Grandes obras de Shakespeare", status: "Seleção de 12 peças · 2017",
