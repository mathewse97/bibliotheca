  source: review/political-thought.md §10
  question: "Com Robert Nozick entrando em Política, manter *Democracia, o Deus que Falhou*, de Hans-Hermann Hoppe, como passo obrigatório?"
  why: "A parte da coleção sobre crítica libertária, a posição de que o Estado deve ser mínimo ou nem existir, tem três obras: duas de Murray Rothbard e *Democracia, o Deus que Falhou* (2001), de Hans-Hermann Hoppe, economista alemão que compara a democracia, para pior, com a monarquia hereditária. Você já decidiu incluir *Anarquia, Estado e Utopia* (1974), de Robert Nozick, a defesa clássica do Estado mínimo e a resposta direta a John Rawls. Com esse livro, a posição libertária fica bem servida, e o de Hans-Hermann Hoppe repete parte dela de forma mais polêmica. O livro tem a sua ★."
