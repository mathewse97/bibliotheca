  decided: {date: 2026-10-30, choice: "Opção A — incluir os três.", note: "Aplicado. Otto, Durkheim e William James entraram no movimento II de Religião, antes de Eliade, os três com estrela. Edições: O Sagrado (Sinodal/EST e Vozes, 2007, trad. Walter O. Schlupp, do alemão); As Formas Elementares da Vida Religiosa (Martins Fontes, 1996, trad. Paulo Neves, do francês); As Variedades da Experiência Religiosa (Cultrix, 2017, trad. Octavio Mendes Cajado), todas recomendadas e à venda nova."}
  source: "review/religion.md, auditoria pela pirâmide de Adler"
  question: "Incluir em Religião os três clássicos que fundaram o estudo moderno da religião?"
  why: "A parte da coleção sobre teoria da religião tem Mircea Eliade, Max Weber, Peter Berger e Charles Taylor, mas nenhum dos três livros de que todos eles partem: Émile Durkheim, que explica a religião pela sociedade; Rudolf Otto, que descreve a experiência do sagrado, ponto de partida declarado de Eliade; e William James, que estuda a experiência religiosa pela psicologia. Pelo critério de Adler, são grandes livros, e a coleção hoje lê os herdeiros sem os fundadores."
  options:
    - {key: A, recommended: true, title: "Incluir os três", effect: "Entram na parte de teoria, antes de Eliade: Otto, Durkheim e James. Eu pesquiso as edições em português."}
    - {key: B, title: "Incluir só Otto e Durkheim", effect: "Os dois de que Eliade e Berger dependem diretamente. William James fica para depois."}
    - {key: C, title: "Agora não", effect: "Nada muda; o cartão fica aqui para depois."}
    - {key: D, title: "Descartar", effect: "A teoria da coleção fica sem os fundadores; a questão é arquivada."}
  recommendation: "cada um abre um dos três caminhos que a coleção já segue: a sociologia (Durkheim, depois Weber e Berger), a fenomenologia (Otto, depois Eliade) e a psicologia (James, que hoje não tem representante). Os três têm tradução em português."
  candidates:
    - {title: "O Sagrado", author: "Rudolf Otto · 1917", verdict: resolve, best: true, adds: "A experiência do sagrado como algo que atrai e aterroriza ao mesmo tempo. Eliade abre *O Sagrado e o Profano* citando este livro.", facts: ["Curto", "-Edição a pesquisar"]}
    - {title: "As Formas Elementares da Vida Religiosa", author: "Émile Durkheim · 1912", verdict: resolve, best: true, adds: "A religião como forma de a sociedade representar a si mesma, estudada a partir dos povos aborígenes da Austrália.", facts: ["Longo", "-Edição a pesquisar"]}
    - {title: "As Variedades da Experiência Religiosa", author: "William James · 1902", verdict: resolve, adds: "A experiência religiosa estudada pela psicologia: conversão, misticismo, santidade.", facts: ["Longo", "-Edição a pesquisar"]}

- id: d-edu-adler-emilio
  kind: obra
  collections: [education]
  priority: media
  state: decidida
  decided: {date: 2026-10-30, choice: "Opção A — incluir o Emílio.", note: "Aplicado. O Emílio entrou no movimento II de Educação, antes de Dewey, com estrela, na tradução de Thomaz Kawauche (Editora Unesp, 2022, revisão técnica e posfácio de Thiago Vargas), recomendada e à venda nova. É a primeira obra da região do Iluminismo."}
  source: "review/education.md §10"
  question: "Incluir em Educação o *Emílio*, de Jean-Jacques Rousseau?"
  why: "*Emílio, ou Da Educação* (1762) é o livro que funda a educação centrada na criança e no seu desenvolvimento natural. A coleção tem John Dewey, que herda essa ideia, e Mortimer Adler e E. D. Hirsch, que a combatem, mas não a voz original. O século XVIII já aparecia como ausência no mapa da coleção."
  options:
    - {key: A, recommended: true, title: "Incluir o *Emílio*", effect: "Entra na parte sobre as posições em disputa, antes de Dewey. Eu pesquiso a edição em português."}
    - {key: B, title: "Agora não", effect: "Nada muda; o cartão fica aqui para depois."}
    - {key: C, title: "Descartar", effect: "A posição progressista fica representada só por Dewey; a questão é arquivada."}
  recommendation: "pelo critério de Adler, a fonte vem antes dos herdeiros. Com o *Emílio*, Dewey passa a ser lido como continuação de uma tradição, e não como ponto de partida."
  candidates:
    - {title: "Emílio, ou Da Educação", author: "Jean-Jacques Rousseau · 1762", verdict: resolve, best: true, adds: "A educação de um menino imaginário, do nascimento à idade adulta, longe da sociedade e segundo a natureza.", facts: ["Longo", "+Há tradução em português"]}

