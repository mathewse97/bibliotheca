    - {key: B, title: "Pôr em ordem de data", effect: "*Os Persas*, *Os Sete* e *As Suplicantes* passam para antes da Oresteia; *Prometeu*, de data e autoria discutidas, fica depois."}
  recommendation: "a Oresteia é a obra central de Ésquilo e a mais estudada; ler as outras depois dela aproveita o que ela ensina. A coleção não é cronológica."

