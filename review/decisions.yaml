       pros: ["Tem Ricardo II e Júlio César, as duas de que a coleção precisa", "Notas e textos complementares", "Capa dura"],
       cons: ["Não tem Coriolano", "É seleção, não obra completa"]}
    - {key: B, label: "Nova Aguilar · Teatro Completo", status: "38 peças · 2016",
       facts: [["Tradução", "Barbara Heliodora"], ["Forma", "3 volumes, 4.440 p., papel bíblia, em caixa"], ["Volumes", "Tragédias e comédias sombrias; Comédias e romances; Tragédias históricas"], ["Extra", "Inclui Eduardo III, última tradução de Heliodora"]],
       pros: ["Resolve Shakespeare inteiro de uma vez", "Papel bíblia e projeto gráfico próprio"],
       cons: ["As três peças foram inferidas do total de 38, e não vistas listadas nominalmente", "O ISBN do box impresso não foi confirmado em fonte de editora", "Caro e volumoso para resolver duas participações"]}
