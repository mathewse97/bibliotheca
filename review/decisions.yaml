- id: d-greco-adler-tragedias
  kind: colecao
  collections: [greco-roman]
  priority: media
  state: decidida
  decided: {date: 2026-10-31, choice: "Opção B — a opção A e, além disso, completar Sófocles.", note: "Aplicado. De Eurípides ficam como passos Medeia, Hipólito, Electra, As Troianas e As Bacantes; as outras dez viraram leitura complementar. Sófocles ficou completo: Ájax, As Traquínias e Filoctetes (Editora 34, edições bilíngues) e Electra (Ateliê, Electra(s)), todas na tradução de Trajano Vieira, direta do grego, entraram logo depois de Antígona."}
  source: review/greco-roman.md §9
  question: "Manter as quinze tragédias de Eurípides como passos obrigatórios de Greco-Romana?"
  why: "Eurípides, o mais jovem dos três grandes autores de tragédia de Atenas (século V a.C.), tem quinze peças na coleção. Elas entraram porque você indicou os volumes completos da tradução de Jaa Torrano. Ésquilo está completo, com sete peças, e Sófocles tem só três das sete que sobreviveram. Para Adler, todas as tragédias gregas são grandes livros: o problema não é a qualidade, é o peso. São quinze passos seguidos do mesmo autor."
  options:
    - {key: A, recommended: true, title: "Cinco de Eurípides ficam obrigatórias; as outras dez viram leitura complementar", effect: "Ficam como passos: *Medeia*, *Hipólito*, *Electra*, *As Troianas* e *As Bacantes*. As outras dez continuam na coleção e nos seus livros, marcadas como opcionais."}
    - {key: B, title: "A opção A e, além disso, completar Sófocles", effect: "Entram as quatro peças de Sófocles que faltam (*Ájax*, *Electra*, *Filoctetes* e *As Traquínias*), e ele fica completo como Ésquilo. Eu pesquiso a edição."}
    - {key: C, title: "Manter as quinze como estão", effect: "Nada muda."}
    - {key: D, title: "Agora não", effect: "O cartão fica aqui para depois."}
  recommendation: "as cinco escolhidas mostram o que faz Eurípides diferente dos outros dois: a paixão que destrói (*Medeia*, *Hipólito*), a releitura crítica de um mito que Ésquilo já tinha tratado (*Electra*), a guerra vista pelas vítimas (*As Troianas*) e o confronto do homem com o deus (*As Bacantes*). As outras dez continuam ao alcance, sem pesar na sequência."
  candidates:
    - {title: "Medeia", author: "Eurípides · 431 a.C.", adds: "A mulher estrangeira abandonada que se vinga matando os próprios filhos.", facts: ["Ficaria obrigatória"]}
    - {title: "Hipólito", author: "Eurípides · 428 a.C.", adds: "A paixão de Fedra pelo enteado, e o jovem destruído por recusar o amor.", facts: ["Ficaria obrigatória"]}
    - {title: "Electra", author: "Eurípides · c. 420 a.C.", adds: "O mesmo mito da *Oresteia* de Ésquilo, recontado sem heroísmo.", facts: ["Ficaria obrigatória", "+Lida contra Ésquilo"]}
    - {title: "As Troianas", author: "Eurípides · 415 a.C.", adds: "As mulheres de Troia depois da derrota: a guerra contada pelas vítimas.", facts: ["Ficaria obrigatória"]}
    - {title: "As Bacantes", author: "Eurípides · c. 405 a.C.", adds: "O deus Dioniso se vinga do rei que o recusa; a última e mais estranha das peças dele.", facts: ["Ficaria obrigatória"]}

