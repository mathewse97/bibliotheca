- id: d-pos-antigas-politica
  kind: posicao
  collections: [political-thought]
  priority: alta
  state: decidida
  decided: {date: 2026-09-28, choice: "Opção B — casa cronológica, com a ligação feita pela relação.", note: "Aplicado. Antígona e a Oresteia entraram no movimento I, depois de Cícero, como participações novas e sem compra. As relações foram gravadas: Antígona aponta para Aquino (a lei da cidade contra a lei não escrita) e a Oresteia para Hobbes — e não para Montesquieu, como eu havia sugerido antes, porque o argumento da trilogia é a substituição da vingança privada por uma instituição, que é o problema de Hobbes, e não a divisão de poderes. A tela já mostra a ligação dos dois lados."}
  question: "Antígona e a Oresteia entram em Política junto do argumento que elas iluminam, ou no movimento da Antiguidade?"
  why: "É a primeira vez que a sua convenção de 27/09 encontra um caso que ela não previu. A convenção manda colocar a obra literária dentro do movimento que ela complementa. Só que os movimentos de Política são de PERÍODO — III é Cristianismo e política medieval, IV é Formação da política moderna. Antígona complementa Aquino, que está no III; a Oresteia complementa Montesquieu, que está no IV. Mas as duas são do século V a.C.: colocá-las ali faria o cabeçalho do movimento afirmar algo falso sobre elas."
  update: "Pesquisa das duas obras concluída em 2026-09-27: Oresteia encenada em 458 a.C., Antígona na década de 440 a.C. (data precisa ainda por confirmar). As duas já são suas, vindas de Greco-Romana, e entram sem compra."
  options:
    - {key: A, title: "Vizinhança argumentativa", effect: "Antígona entra no movimento III, antes de Aquino; a Oresteia no IV, antes de Montesquieu. É a leitura literal da convenção — mas dois cabeçalhos de período passam a abrigar obras que não são daquele período."}
    - {key: B, recommended: true, title: "Casa cronológica, com a ligação feita pela relação", effect: "As duas entram no movimento I, Antiguidade: fundamentos da política, ao lado de Platão, Aristóteles, Tucídides e Cícero. A ligação com Aquino e com Montesquieu passa a existir como relação registrada, que a tela mostra dos dois lados e a pastilha anuncia."}
    - {key: C, title: "Misto", effect: "Antígona vai para junto de Aquino, porque a tradição do direito natural a cita nominalmente; a Oresteia fica no movimento I. Resolve o caso mais forte e adia o outro."}
    - {key: D, title: "Agora não", effect: "As duas continuam só em Greco-Romana. A pesquisa fica registrada e a questão volta quando o movimento X for redistribuído."}
  recommendation: "a A quebra a sua própria regra de que um movimento é território e tem de continuar verdadeiro depois que entram mais obras — foi a regra que nasceu do erro de Kant e Marcuse caindo dentro do movimento de literatura. Uma tragédia do século V a.C. dentro de Cristianismo e política medieval é o mesmo erro por outro caminho. A B não perde nada: a convenção tem três camadas, e a que carrega o argumento é a relação, não a adjacência. O movimento I não é um gueto de gênero — é a abertura cronológica da coleção, onde Platão e Tucídides já estão."
  composition: true
  composition_note: "O movimento I tem hoje quatro obras, todas do mundo antigo: A República, a Política, Tucídides e Cícero."


# ============================== MUDAR UMA REGRA =============================

- id: d-reg-proposito-movimento
  kind: regra
  collections: []
  priority: media
  state: decidir
  question: "Proibir que eu escreva o propósito de um movimento a partir das obras que já estão dentro dele?"
  why: "Foi o erro desta conversa. O movimento X de Política tem título seu — *Literatura como crítica política*, que é amplo — e propósito meu, que eu inferi dos seis romances que estavam lá: *como a ideologia é vivida por dentro*. Com esse propósito no arquivo, eu passei duas respostas defendendo que Júlio César não cabia na coleção. Estava defendendo um rascunho meu contra a sua obra, sem perceber. As regras já me proíbem de tirar os critérios de inclusão de uma coleção das obras que ela já tem; não dizem nada sobre o propósito de um movimento, que é a mesma falha um nível abaixo."
  options:
    - {key: A, recommended: true, title: "Acrescentar a proibição às regras", effect: "Passa a ser proibição explícita: *derivar o propósito de um movimento das obras que hoje estão dentro dele, em vez do argumento da coleção e do título do movimento*. Vale para qualquer agente, não só para mim."}
    - {key: B, title: "A proibição e uma revisão dos propósitos que já escrevi", effect: "Além da regra, eu releio os propósitos que escrevi em todas as seis coleções e te aponto os que foram inferidos do conteúdo — não corrijo nenhum sem você ver."}
    - {key: C, title: "Não mudar nada", effect: "As regras já dizem que um movimento deve continuar verdadeiro depois de entrarem mais obras, e você considera isso suficiente."}
  recommendation: "a B, se você tiver paciência para a lista. O erro que a regra descreve é meu e sistemático: escrevi propósito de movimento em seis coleções, sempre olhando para os membros. A regra sozinha impede o próximo; a revisão mostra quantos já existem."

- id: d-reg-literatura
  kind: regra
  collections: []
  state: decidida
  question: "Onde entra a literatura que complementa uma obra teórica, histórica ou técnica?"
  decided: {date: 2026-09-27, choice: "Dentro do movimento que ela complementa, com papel de tratamento literário e aresta apontando para a obra tratada — não agrupada com as outras obras literárias por serem literatura. Vale para todas as coleções.", note: "Gravado como §2.8 das regras de curadoria. Reversível: remover a §2.8; nenhum membro foi movido por esta decisão, e a redistribuição do movimento X de Política é decisão separada, ainda aberta em d-pol-movimento-x."}

# ============================== AGUARDANDO =================================

- id: d-pol-movimento-x
  kind: colecao
  collections: [political-thought]
  priority: alta
  state: decidida
  decided: {date: 2026-09-28, choice: "Opção B — aplicar a redistribuição e registrar o crescimento do movimento VII como questão separada.", note: "Aplicado. O cabeçalho X deixou de existir; Os Demônios foi para o movimento VI, as outras cinco para o VII, cada uma ao lado da obra que ela encena. As seis mudanças estão em order_changes, uma a uma, com razão e forma de reverter. O movimento VII passou de 10 para 15 obras e isso ficou registrado como sinal estrutural no próprio arquivo da coleção — a resposta, se houver, é subdivisão interna do VII, não um movimento de gênero de volta."}
  question: "Redistribuir os seis romances do movimento X de Política pelos movimentos que eles complementam?"
  why: "É a consequência da sua decisão de 27/09: se a literatura passa a ser colocada junto do que ela ilumina, um movimento que existe para agrupar literatura por gênero perde a razão de existir. A pesquisa das seis obras foi concluída em 28/09 e as posições abaixo já são conclusão de pesquisa, não palpite."
  update: "ACHADO QUE CONTRARIA A EXPECTATIVA: a dispersão quase não dispersa. Cinco das seis obras vão para o MESMO movimento, o VII, porque cinco das seis tratam de ideologia do século XX — que é exatamente o que eu havia escrito, erradamente, como propósito do movimento X. O agrupamento que você tinha feito estava certo sobre os seus membros; o que estava errado era eu derivar dele um propósito e depois usar esse propósito para excluir outra literatura. O movimento VII passaria de 10 para 15 obras, quase um terço da coleção."
  options:
    - {key: A, title: "Aplicar as seis posições como propostas", effect: "Os Demônios vai para o movimento VI, junto da tradição revolucionária que ele ataca. As outras cinco vão para o VII, cada uma ao lado da obra teórica que ela encena. O movimento X deixa de existir. O VII fica com 15 obras."}
    - {key: B, recommended: true, title: "Aplicar, e tratar o tamanho do VII como questão separada", effect: "Mesma redistribuição, mas eu registro o crescimento do movimento VII como sinal estrutural a reavaliar depois, em vez de resolver agora no mesmo movimento. Nada fica escondido e nada é decidido no susto."}
    - {key: C, title: "Rever a decisão de 27/09 à luz disto", effect: "Você olha o resultado e decide se a dispersão total continua valendo a pena para ESTA coleção. O movimento X continua existindo. A convenção continua valendo para as obras que entram, como Antígona e Ricardo II, onde ela dispersa de verdade."}
    - {key: D, title: "Agora não", effect: "A pesquisa fica registrada e nada muda na sequência."}
  recommendation: "a redistribuição é boa para cinco das seis obras — 1984 ao lado do ensaio de Orwell sobre linguagem e do diário de Klemperer é um ganho real de leitura, e os três tratam do mesmo objeto por três vias. Mas fingir que o movimento VII não vai inchar seria esconder o efeito colateral, e é por isso que eu prefiro a B à A: mesma mudança, com o problema registrado em vez de varrido. A C é a escolha honesta se, vendo o resultado, você achar que o custo não compensa nesta coleção — eu não teria como saber disso antes de fazer a pesquisa."
  composition: true
  composition_note: "As seis foram pesquisadas em 28/09 e estão classificadas como literatura, valor criado na mesma data."
  candidates:
    - {title: "Os Demônios", author: "Dostoiévski · 1872", verdict: resolve, best: true, adds: "Único que sai do bloco: vai para o movimento VI, ao lado do Manifesto e do 18 de Brumário. É o romance sobre a célula revolucionária por dentro, colocado junto da tradição que ele ataca.", facts: ["Destino: movimento VI"]}
    - {title: "Nós", author: "Zamiátin · 1920–21", verdict: resolve, adds: "Vai para o VII. Escrito contra o projeto soviético no momento em que ele começava — anterior a tudo o que a coleção tem sobre o assunto.", facts: ["Destino: movimento VII"]}
    - {title: "Admirável Mundo Novo", author: "Huxley · 1932", verdict: resolve, adds: "Vai para o VII. É a distopia do controle brando, não a do terror: condicionamento, consumo e conformismo. Encena o que Marcuse argumenta.", facts: ["Destino: movimento VII", "Relação proposta: Marcuse"]}
    - {title: "O Zero e o Infinito", author: "Koestler · 1938–40", verdict: resolve, adds: "Vai para o VII, junto de Arendt: partido, confissão e disciplina ideológica vistos de dentro do revolucionário.", facts: ["Destino: movimento VII", "Relação proposta: Arendt"]}
    - {title: "A Revolução dos Bichos", author: "Orwell · 1945", verdict: resolve, adds: "Vai para o VII: revolução traída, propaganda e reescrita do passado.", facts: ["Destino: movimento VII"]}
    - {title: "1984", author: "Orwell · 1949", verdict: resolve, adds: "Vai para o VII, ao lado do ensaio de Orwell sobre linguagem e política e do registro de Klemperer. Argumento, testemunho e ficção sobre o mesmo objeto.", facts: ["Destino: movimento VII", "Relações propostas: o ensaio de Orwell e Klemperer"]}


