# ============================== MUDAR UMA REGRA =============================

- id: d-reg-proposito-movimento
  kind: regra
  collections: []
  priority: media
  state: decidida
  decided: {date: 2026-10-31, choice: "Opção C — não mudar nada.", note: "Nenhuma regra mudou. Vale o que já está escrito: um movimento deve continuar verdadeiro depois de entrarem mais obras."}
  question: "Proibir que eu escreva o propósito de um movimento a partir das obras que já estão dentro dele?"
  why: "Foi o erro desta conversa. O movimento X de Política tem título seu — *Literatura como crítica política*, que é amplo — e propósito meu, que eu inferi dos seis romances que estavam lá: *como a ideologia é vivida por dentro*. Com esse propósito no arquivo, eu passei duas respostas defendendo que Júlio César não cabia na coleção. Estava defendendo um rascunho meu contra a sua obra, sem perceber. As regras já me proíbem de tirar os critérios de inclusão de uma coleção das obras que ela já tem; não dizem nada sobre o propósito de um movimento, que é a mesma falha um nível abaixo."
  options:
    - {key: A, recommended: true, title: "Acrescentar a proibição às regras", effect: "Passa a ser proibição explícita: *derivar o propósito de um movimento das obras que hoje estão dentro dele, em vez do argumento da coleção e do título do movimento*. Vale para qualquer agente, não só para mim."}
    - {key: B, title: "A proibição e uma revisão dos propósitos que já escrevi", effect: "Além da regra, eu releio os propósitos que escrevi em todas as seis coleções e te aponto os que foram inferidos do conteúdo — não corrijo nenhum sem você ver."}
    - {key: C, title: "Não mudar nada", effect: "As regras já dizem que um movimento deve continuar verdadeiro depois de entrarem mais obras, e você considera isso suficiente."}
  recommendation: "a B, se você tiver paciência para a lista. O erro que a regra descreve é meu e sistemático: escrevi propósito de movimento em seis coleções, sempre olhando para os membros. A regra sozinha impede o próximo; a revisão mostra quantos já existem."

