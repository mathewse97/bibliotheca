# ============================== AGUARDANDO =================================

- id: d-pol-movimento-x
  kind: colecao
  collections: [political-thought]
  priority: alta
  state: decidida
  decided: {date: 2026-09-28, choice: "Opção B — aplicar a redistribuição e registrar o crescimento do movimento VII como questão separada.", note: "Aplicado. O cabeçalho X deixou de existir; Os Demônios foi para o movimento VI, as outras cinco para o VII, cada uma ao lado da obra que ela encena. As seis mudanças estão em order_changes, uma a uma, com razão e forma de reverter. O movimento VII passou de 10 para 15 obras e isso ficou registrado como sinal estrutural no próprio arquivo da coleção — a resposta, se houver, é subdivisão interna do VII, não um movimento de gênero de volta."}
  question: "Redistribuir os seis romances do movimento X de Política pelos movimentos que eles complementam?"
  why: "É a consequência da sua decisão de 27/09: se a literatura passa a ser colocada junto do que ela ilumina, um movimento que existe para agrupar literatura por gênero perde a razão de existir. A pesquisa das seis obras foi concluída em 28/09 e as posições abaixo já são conclusão de pesquisa, não palpite."
  update: "ACHADO QUE CONTRARIA A EXPECTATIVA: a dispersão quase não dispersa. Cinco das seis obras vão para o MESMO movimento, o VII, porque cinco das seis tratam de ideologia do século XX — que é exatamente o que eu havia escrito, erradamente, como propósito do movimento X. O agrupamento que você tinha feito estava certo sobre os seus membros; o que estava errado era eu derivar dele um propósito e depois usar esse propósito para excluir outra literatura. O movimento VII passaria de 10 para 15 obras, quase um terço da coleção."
  options:
    - {key: A, title: "Aplicar as seis posições como propostas", effect: "Os Demônios vai para o movimento VI, junto da tradição revolucionária que ele ataca. As outras cinco vão para o VII, cada uma ao lado da obra teórica que ela encena. O movimento X deixa de existir. O VII fica com 15 obras."}
    - {key: B, recommended: true, title: "Aplicar, e tratar o tamanho do VII como questão separada", effect: "Mesma redistribuição, mas eu registro o crescimento do movimento VII como sinal estrutural a reavaliar depois, em vez de resolver agora no mesmo movimento. Nada fica escondido e nada é decidido no susto."}
    - {key: C, title: "Rever a decisão de 27/09 à luz disto", effect: "Você olha o resultado e decide se a dispersão total continua valendo a pena para ESTA coleção. O movimento X continua existindo. A convenção continua valendo para as obras que entram, como Antígona e Ricardo II, onde ela dispersa de verdade."}
    - {key: D, title: "Agora não", effect: "A pesquisa fica registrada e nada muda na sequência."}
  recommendation: "a redistribuição é boa para cinco das seis obras — 1984 ao lado do ensaio de Orwell sobre linguagem e do diário de Klemperer é um ganho real de leitura, e os três tratam do mesmo objeto por três vias. Mas fingir que o movimento VII não vai inchar seria esconder o efeito colateral, e é por isso que eu prefiro a B à A: mesma mudança, com o problema registrado em vez de varrido. A C é a escolha honesta se, vendo o resultado, você achar que o custo não compensa nesta coleção — eu não teria como saber disso antes de fazer a pesquisa."
  composition: true
  composition_note: "As seis foram pesquisadas em 28/09 e estão classificadas como literatura, valor criado na mesma data."
  candidates:
    - {title: "Os Demônios", author: "Dostoiévski · 1872", verdict: resolve, best: true, adds: "Único que sai do bloco: vai para o movimento VI, ao lado do Manifesto e do 18 de Brumário. É o romance sobre a célula revolucionária por dentro, colocado junto da tradição que ele ataca.", facts: ["Destino: movimento VI"]}
    - {title: "Nós", author: "Zamiátin · 1920–21", verdict: resolve, adds: "Vai para o VII. Escrito contra o projeto soviético no momento em que ele começava — anterior a tudo o que a coleção tem sobre o assunto.", facts: ["Destino: movimento VII"]}
    - {title: "Admirável Mundo Novo", author: "Huxley · 1932", verdict: resolve, adds: "Vai para o VII. É a distopia do controle brando, não a do terror: condicionamento, consumo e conformismo. Encena o que Marcuse argumenta.", facts: ["Destino: movimento VII", "Relação proposta: Marcuse"]}
    - {title: "O Zero e o Infinito", author: "Koestler · 1938–40", verdict: resolve, adds: "Vai para o VII, junto de Arendt: partido, confissão e disciplina ideológica vistos de dentro do revolucionário.", facts: ["Destino: movimento VII", "Relação proposta: Arendt"]}
    - {title: "A Revolução dos Bichos", author: "Orwell · 1945", verdict: resolve, adds: "Vai para o VII: revolução traída, propaganda e reescrita do passado.", facts: ["Destino: movimento VII"]}
    - {title: "1984", author: "Orwell · 1949", verdict: resolve, adds: "Vai para o VII, ao lado do ensaio de Orwell sobre linguagem e política e do registro de Klemperer. Argumento, testemunho e ficção sobre o mesmo objeto.", facts: ["Destino: movimento VII", "Relações propostas: o ensaio de Orwell e Klemperer"]}


