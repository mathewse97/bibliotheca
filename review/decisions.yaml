- id: d-pol-adler-bezmenov
  kind: colecao
  collections: [political-thought]
  priority: media
  state: decidida
  decided: {date: 2026-10-31, choice: "Manter o livro de Bezmenov e acrescentar Arquipélago Gulag, de Aleksandr Soljenítsin.", note: "Pedido do Mathews na conversa, sem cartão novo. O Mathews apontou que o argumento do cartão estava errado: LTI trata do nazismo e não substitui um livro sobre a União Soviética. Bezmenov fica como está. Arquipélago Gulag entrou no movimento VII, logo depois de O Zero e o Infinito, na edição da Carambaia (trad. Lucas Simone e equipe, direta do russo, versão condensada pelo autor)."}
  source: review/political-thought.md §10
  question: "Tirar de Política o livro de Yuri Bezmenov sobre a subversão soviética?"
  why: "*Subversão: Teoria, Aplicação e Confissão de um Método* reúne palestras e entrevistas de 1983 e 1984 de Yuri Bezmenov, ex-agente da KGB, o serviço secreto soviético, que fugiu para o Ocidente. Ele conta como a União Soviética tentava desestabilizar outros países por dentro, com propaganda. É um depoimento, não um argumento sobre quando um governo é legítimo, que é a pergunta da coleção. E o tema da propaganda já está em obras mais sólidas: *1984*, de George Orwell, e *LTI*, o estudo de Victor Klemperer sobre a língua do nazismo."
  options:
    - {key: A, recommended: true, title: "Tirar da coleção", effect: "Sai de Política. O livro continua registrado na biblioteca, sem coleção, e pode voltar quando você quiser."}
    - {key: B, title: "Manter como leitura complementar", effect: "Fica onde está, marcado como opcional: não é passo obrigatório da coleção."}
    - {key: C, title: "Manter como está", effect: "Nada muda."}
    - {key: D, title: "Agora não", effect: "O cartão fica aqui para depois."}
  recommendation: "pelo critério de Adler, uma obra precisa cumprir na coleção um papel que nenhuma outra cumpre. Esta não cumpre: a propaganda já está explicada por grandes livros e livros de estudo da coleção. Se o testemunho de quem esteve dentro te interessa, a B mantém o livro sem pesar na sequência."
  candidates:
    - {title: "Subversão: Teoria, Aplicação e Confissão de um Método", author: "Yuri Bezmenov · palestras de 1983–84", adds: "Depoimento de um ex-agente soviético sobre propaganda e desestabilização.", facts: ["Hoje na parte sobre poder e ideologia", "-Depoimento, não argumento"]}
    - {title: "1984", author: "George Orwell · 1949", adds: "Já na coleção. A propaganda e a reescrita da verdade num regime total.", facts: ["+Já está na coleção"]}
    - {title: "LTI: A Linguagem do Terceiro Reich", author: "Victor Klemperer · 1947", adds: "Já na coleção. Um filólogo judeu registra, dia a dia, como o nazismo mudou o sentido das palavras.", facts: ["+Já está na coleção"]}

