  question: "Trocar o livro de Robert Dahl em Política pela obra mais completa dele?"
  why: "Hoje está *Sobre a Democracia* (1998), de Robert Dahl, cientista político americano e um dos principais teóricos da democracia do século XX. É uma introdução curta e acessível ao que ele pensou a vida toda. A obra madura é *A Democracia e seus Críticos* (1989): nela ele expõe as objeções mais fortes à democracia, desde Platão, e responde a cada uma, o que toca de frente a pergunta da coleção. O livro atual tem a sua ★, então a decisão é sua."
  options:
